name: Publish PR Preview

# The triggering pull-request workflow has no deployment credentials. This
# workflow definition and every executable it uses come from the base branch.
on:
  workflow_run:
    workflows:
      - Checks
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  deploy:
    name: Cloudflare Static Preview
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted deployment policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up trusted Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Identify the still-open pull request head
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(bun apps/web/cloudflare/preview-policy/request.ts \
            --event "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY")
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > /tmp/preview-pull-request.json
          bun apps/web/cloudflare/preview-policy/request.ts \
            --event "$GITHUB_EVENT_PATH" \
            --pull-request /tmp/preview-pull-request.json \
            --repository "$GITHUB_REPOSITORY"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Read canonical contract artifacts as inert data
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/apps/server/contracts/openapi.json?ref=$EXPECTED_HEAD_SHA" \
            > /tmp/preview-openapi.json
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/apps/server/contracts/operation-policy.json?ref=$EXPECTED_HEAD_SHA" \
            > /tmp/preview-operation-policy.json

      - name: Calculate the canonical contract digest with trusted code
        id: contract
        run: |
          bun install --frozen-lockfile --ignore-scripts
          DIGEST=$(bun apps/server/tools/contracts/digest-artifacts.ts \
            /tmp/preview-openapi.json /tmp/preview-operation-policy.json)
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Download only the triggering run's exact artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fidy-web-preview-${{ github.event.workflow_run.head_sha }}
          path: incoming-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Independently validate and safely extract the untrusted artifact
        env:
          EXPECTED_CONTRACT_DIGEST: ${{ steps.contract.outputs.digest }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          bun apps/web/cloudflare/preview-policy/artifact.ts \
            --archive incoming-preview/preview.tar \
            --output apps/web/dist \
            --expected-sha "$EXPECTED_HEAD_SHA" \
            --expected-digest "$EXPECTED_CONTRACT_DIGEST" \
            --trusted-headers apps/web/cloudflare/public/_headers

      - name: Reverify pull request immediately before upload
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > /tmp/preview-pull-request.json
          bun apps/web/cloudflare/preview-policy/request.ts \
            --event "$GITHUB_EVENT_PATH" \
            --pull-request /tmp/preview-pull-request.json \
            --repository "$GITHUB_REPOSITORY"

      - name: Upload the validated static version
        id: cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: >-
            versions upload
            --config cloudflare/wrangler.json
            --preview-alias pr-${{ steps.pull-request.outputs.number }}

      - name: Publish preview location
        env:
          PREVIEW_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: echo "### Static preview\n$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

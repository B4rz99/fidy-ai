name: Verify Bancolombia sandbox signing possession

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bancolombia-signing-proof
  cancel-in-progress: false

jobs:
  possession:
    if: github.ref == 'refs/heads/trunk'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out protected trunk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pinned Bun
        uses: ./.github/actions/bun-runtime
      - name: Install locked dependencies without lifecycle scripts
        run: bash scripts/install-workspace.sh --ignore-scripts
      - name: Read only the public sandbox JWKS
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 5 --max-time 10 --max-filesize 16384 \
            'https://api.fidyapp.com/connections/bancolombia/sandbox/jwks' \
            --output "$RUNNER_TEMP/bancolombia-jwks.json"
      - name: Verify protected signing possession offline
        env:
          BANCOLOMBIA_SANDBOX_PRIVATE_KEY_PEM: ${{ secrets.BANCOLOMBIA_SANDBOX_PRIVATE_KEY_PEM }}
          FIDY_BANCOLOMBIA_JWKS_FILE: ${{ runner.temp }}/bancolombia-jwks.json
        run: |
          set -euo pipefail
          umask 077
          bun scripts/bancolombia-signing-proof.ts > "$RUNNER_TEMP/bancolombia-proof.json"
          {
            printf '%s\n' '## Bancolombia sandbox signing possession' \
              "Revision: $GITHUB_SHA" \
              '- Matching protected signing key and pinned public JWKS verified with RS256.' \
              '- Offline challenge only; no bank request, assertion, key change or deployment.'
            cat "$RUNNER_TEMP/bancolombia-proof.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary public proof files
        if: always()
        run: rm -f "$RUNNER_TEMP/bancolombia-jwks.json" "$RUNNER_TEMP/bancolombia-proof.json"

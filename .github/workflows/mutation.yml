name: Mutation

on:
  schedule:
    - cron: "17 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - uses: ./.github/actions/bun-install
      - name: Install mutation runner
        working-directory: tools/mutation
        run: bash scripts/install-workspace.sh
      - name: Mutation score
        run: bun run test:mutation

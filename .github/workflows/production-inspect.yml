name: Inspect Production Worker traffic

on:
  workflow_dispatch:
    inputs:
      probe_staged_pair:
        description: "Probe only the inspected 0%-traffic candidates from the interrupted release"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      RELEASE_GIT_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
      ALCHEMY_PROFILE: ci
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SMOKE_PROOF: ${{ secrets.SMOKE_PROOF }}
    steps:
      - name: Configure release file paths
        run: |
          echo "RELEASE_SNAPSHOT_FILE=$RUNNER_TEMP/fidy-release.json" >> "$GITHUB_ENV"
          echo "SMOKE_ATTESTATION_FILE=$RUNNER_TEMP/fidy-smoke-passed.json" >> "$GITHUB_ENV"
      - name: Check out protected trunk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"
      - name: Install locked workspace
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Configure Alchemy's ephemeral Cloudflare profile
        uses: ./.github/actions/configure-alchemy-cloudflare-profile
      - name: Report public and Core Worker deployments without changing traffic
        working-directory: infra/cloudflare
        run: bun production-release.ts inspect
      - name: Classify Production drift without printing provider attributes
        working-directory: infra/cloudflare
        run: |
          if bash scripts/check-topology-drift.sh inspect; then
            echo 'No Production topology drift.'
          else
            echo 'Drift remains blocked; see sanitized resource categories above.'
          fi
      - name: Diagnose the inspected zero-traffic candidate pairing without promoting
        if: ${{ inputs.probe_staged_pair }}
        working-directory: infra/cloudflare
        env:
          # Only the versions uploaded in run 36602097827. No traffic-changing command runs here.
          RELEASE_GIT_SHA: bb266058b40663208c2478ae48af4fe8bb5fa79d
          CONTRACT_DIGEST: f33c9633df9fdfe0dbb730156fe9083dc4d0f676648a27d102f73bc98262fd4f
          PUBLIC_VERSION_ID: 18489858-358b-4986-9d60-98a686052c85
          CORE_VERSION_ID: 2216c932-4dc6-4195-baad-8944aa28bf07
          STABLE_PUBLIC_VERSION_ID: 90b1cd6a-4796-41bf-ae33-fb3333a3fff0
          STABLE_RELEASE_GIT_SHA: 2d65bde42f81b5c4af377e433100a7500bec0a5b
          STABLE_CONTRACT_DIGEST: f33c9633df9fdfe0dbb730156fe9083dc4d0f676648a27d102f73bc98262fd4f
          PUBLIC_WORKER_NAME: fidycloudflare-ingress-production-hf6ajjsszff23h5z
          CORE_WORKER_NAME: fidycloudflare-core-production-hdv5cspnk7fai6vg
        run: |
          bun production-release.ts verify-staged
          bun verify-production-smoke.ts

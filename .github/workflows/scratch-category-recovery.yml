name: Verify independent Category recovery
on:
  push:
    branches: [test/2260-recovery-latency]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/bun-install
      - run: bun run --cwd apps/web test -- src/transport/workspace-query.test.ts src/features/transactions/corrections.test.ts

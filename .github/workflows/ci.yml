name: Checks

# Pull requests only. The protect ruleset requires the branch to be up to date
# with trunk before merging.
on:
  pull_request:
    branches:
      - trunk

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Workspace Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch base branch tip
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
      - uses: ./.github/actions/bun-install
      - name: Static repository validation
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: bun run verify -- --group static

  builds:
    name: Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/bun-install
      - name: Build validation
        env:
          RELEASE_GIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run verify -- --group builds
      - name: Check out the exact preview source without credentials
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Reinstall dependencies for the exact preview source
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: ./.github/actions/bun-install
      - name: Build credential-free static preview artifact
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          PREVIEW_GIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run --cwd apps/web build:preview
      - name: Publish static artifact for trusted validation
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fidy-web-preview-${{ github.event.pull_request.head.sha }}
          path: apps/web/preview.tar
          if-no-files-found: error
          retention-days: 1

  unit:
    name: Unit and artifact tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/bun-install
      - name: Unit and artifact validation
        run: bun run verify -- --group unit
      - name: Preserve core coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-coverage-core
          path: apps/server/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  browser:
    name: Web browser and accessibility checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/bun-install
      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        run: bunx --bun playwright install --with-deps chromium
      - name: Static-shell browser validation
        run: bun run verify -- --group browser

  security-secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Fetch base ref
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: git fetch origin "$BASE_BRANCH"
      - name: Gitleaks — pattern-based secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: TruffleHog — verified secret scan
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          version: 3.97.1@sha256:deb2af10659a488a14d262a323addcde099d99827a1cf1dc4e93c17915c39f08
          extra_args: --only-verified --exclude-paths=.trufflehog-exclude-paths.txt
      - name: Fluid Attacks secret scan
        run: >-
          docker run --rm --pull=always -v "$PWD:/src" -w /src docker.io/fluidattacks/ss:latest
          ss scan --strict --config /src/.fluidattacks/secrets.yaml

  security-sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Semgrep SAST
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/owasp-top-ten
            p/typescript
            p/secrets
      - name: Fluid Attacks SAST
        run: docker run --rm --pull=always -v "$PWD:/src" docker.io/fluidattacks/sast:latest sast --strict scan /src/.fluidattacks/sast.yaml

  security-sca:
    name: SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fluid Attacks SCA
        run: docker run --rm --pull=always -v "$PWD:/src" docker.io/fluidattacks/sca:latest sca --strict scan /src/.fluidattacks/sca.yaml

  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    needs:
      - static
      - builds
      - unit
      - browser
      - security-secrets
      - security-sast
      - security-sca
    if: ${{ always() }}
    steps:
      - name: Verify required jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries | map(select(.value.result != "success") | "\(.key): \(.value.result)") | .[]' <<<"$RESULTS")
          if [[ -n "$failed" ]]; then
            echo "Required jobs did not succeed:" >&2
            echo "$failed" >&2
            exit 1
          fi

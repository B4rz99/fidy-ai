name: Public-site before and after
on:
  pull_request:
    branches: [trunk]
    paths:
      - "apps/web/src/features/public-site/**"
      - "apps/web/public-preview/**"
      - "apps/web/playwright.public-preview.config.ts"
      - ".github/workflows/public-site-preview.yml"
permissions:
  contents: read
concurrency:
  group: public-site-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/bun-install
        with:
          save-cache: "false"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .preview-base
          persist-credentials: false
      - name: Build unchanged base
        working-directory: .preview-base
        run: |
          bash scripts/install-workspace.sh
          cd apps/web
          VITE_API_ORIGIN=http://127.0.0.1:4199 bun --bun vite build --outDir preview-dist
      - name: Build proposed page
        working-directory: apps/web
        run: VITE_API_ORIGIN=http://127.0.0.1:4199 bun --bun vite build --outDir preview-dist
      - name: Install test browser
        run: |
          sudo env NEEDRESTART_SUSPEND=1 node node_modules/.bin/playwright install-deps chromium
          bunx --bun playwright install --only-shell chromium
      - name: Capture public synthetic views
        working-directory: apps/web
        run: bun --bun playwright test --config playwright.public-preview.config.ts
      - name: Save before and after screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-site-before-after
          path: apps/web/test-results/public-preview/**/*.png
          if-no-files-found: error
          retention-days: 7

name: Test operator alert email

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      OPERATOR_ALERT_EMAIL: ${{ vars.OPERATOR_ALERT_EMAIL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Deliver test alert to the production operator channel
        run: |
          set -euo pipefail
          test -n "$OPERATOR_ALERT_EMAIL"
          test -n "$RESEND_API_KEY"
          jq -n --arg to "$OPERATOR_ALERT_EMAIL" \
            '{from:"Fidy <obarboza@fidyapp.com>",to:[$to],subject:"Fidy: test operational alert",text:"This is a test of Fidy production operational alert delivery. No action is required."}' \
            > "$RUNNER_TEMP/operator-alert.json"
          curl --fail --silent --show-error --max-time 10 \
            --request POST 'https://api.resend.com/emails' \
            --header "Authorization: Bearer $RESEND_API_KEY" \
            --header 'Content-Type: application/json' \
            --header "Idempotency-Key: fidy-operator-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --data-binary "@$RUNNER_TEMP/operator-alert.json" >/dev/null
          echo 'Test email accepted by provider; operator must confirm inbox receipt.'

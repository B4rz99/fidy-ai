name: Alchemy state diagnostic

on:
  pull_request:
    branches: [trunk]
    types: [synchronize]

permissions:
  contents: read

jobs:
  state-logs:
    name: Read state store diagnostics
    if: ${{ github.event.pull_request.number == 2488 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/1809-recurring-transaction-details' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ALCHEMY_PROFILE: ci
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/bun-runtime
      - run: bash scripts/install-workspace.sh --ignore-scripts
      - uses: ./.github/actions/configure-alchemy-cloudflare-profile
      - name: Extract error classifications without logging state
        working-directory: infra/cloudflare
        shell: bash
        run: |
          umask 077
          diagnostic_path="$(mktemp)"
          trap 'rm -f "$diagnostic_path"' EXIT
          if bun ../../node_modules/alchemy/bin/alchemy.js state logs --backend cloudflare --profile ci --limit 50 --since 1h --no-input > "$diagnostic_path" 2>&1; then
            echo "State-store log query succeeded."
          else
            echo "State-store log query failed."
          fi
          pattern='State store listStacks failed|RpcCallError|SecretNotFound|Secrets Worker: Failed to fetch secret|Failed to fetch secret|Secrets Store|Invalid key length|InvalidAccessError|DataError|TypeError|RangeError|ReferenceError|SyntaxError|NotFoundError|CloudflareInternalError|InternalError|Unauthorized|Forbidden|not authorized|permission denied|no log entries|Durable Object[^.]{0,3}(was reset|is overloaded|not found)|WorkerHasNoVersions|NoSuchMethod|method not found|root DO|No such module|Cannot find module|InvalidArgument'
          sort -u < <(grep -oEi "$pattern" "$diagnostic_path" || true)

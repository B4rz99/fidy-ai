name: Interleave the native browser admission variants

on: workflow_dispatch

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: e5ef953abd694481c3eb4a09f2bbf7a6e844b379
          path: native-baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 92de8d58905b583f85c8d2323bc1a6824a86f270
          path: native-candidate
          persist-credentials: false
      - uses: ./.github/actions/bun-runtime
      - name: Install each pinned workspace and locate Chromium
        run: |
          bash scripts/install-workspace.sh --ignore-scripts
          (cd native-baseline && bash scripts/install-workspace.sh --ignore-scripts)
          (cd native-candidate && bash scripts/install-workspace.sh --ignore-scripts)
          echo "ASSESSMENT_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
      - name: Measure eight alternating isolated native pairs
        run: python3 scripts/infra-performance/reference/same-native.py native-baseline native-candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: native-admission-phase-comparison
          path: |
            apps/web/test-results/reference/*/plan.json
            apps/web/test-results/reference/*/samples.jsonl
            apps/web/test-results/reference/*/report.json
            apps/web/test-results/reference/*/*/workspace-events.jsonl

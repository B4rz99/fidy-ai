name: Verify the browser presentation changes
on:
  push:
    branches: [test/2260-browser-product-checks]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 289a268f8077aacca47bba9c2c3f46d3d5c9331a
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/bun-install
      - name: Typecheck, mounted interaction and Chromium layout regressions
        run: |
          bun run --cwd apps/web typecheck
          bun run --cwd apps/web test -- src/ui/components/choice-dropdown.test.ts src/features/recurring/feature.test.ts src/features/transactions/corrections.test.ts src/transport/workspace-query.test.ts
          ASSESSMENT_CHROMIUM="$(command -v google-chrome)" bun scripts/infra-performance/reference/transaction-panel.test.mjs
      - name: Check product files with type-aware and UI lint
        run: |
          bun install --cwd tools/astro --frozen-lockfile
          bun install --cwd tools/mutation --frozen-lockfile
          bun install --cwd tools/mcp-inspector --frozen-lockfile
          bun install --cwd tools/depcruise --frozen-lockfile
          bun run --cwd apps/docs sync
          files=(apps/web/src/ui/components/choice-dropdown{.test.ts,.tsx} apps/web/src/features/{transactions,recurring}/inline-category.tsx apps/web/src/ui/{workspace-reference,pattern-reference}.tsx)
          bun x --no-install oxlint --deny-warnings --config .oxlintrc.json --type-aware --threads=1 "${files[@]}" scripts/infra-performance/reference/transaction-panel.test.mjs
          bun x --no-install oxlint --deny-warnings --config .oxlintrc.ui.json "${files[@]}"

name: Measure the closed native browser journey

on:
  pull_request:
    paths:
      - ".github/workflows/hosted-browser.yml"
      - "scripts/infra-performance/hosted-browser/**"
      - "scripts/infra-performance/reference/fresh-transactions.mjs"
      - "scripts/infra-performance/reference/fresh-workspaces.mjs"
      - "scripts/infra-performance/reference/fresh-dashboard.mjs"
      - "scripts/infra-performance/reference/fresh-recurring.mjs"
      - "infra/cloudflare/native-acceptance.ts"
      - "apps/server/cloudflare/release-isolation/**"
  workflow_dispatch:
    inputs:
      revision:
        description: Installed closed native release Git SHA
        required: true
        type: string
      view:
        description: Browser journey on the prepared synthetic fixture
        type: choice
        options: [transactions, budgets, needs-review, dashboard, recurring, offline-calibration]
        default: transactions
      network:
        description: Browser network profile
        type: choice
        options: [ordinary, poor]
        default: ordinary

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/bun-install
      - name: Verify Chromium signs the actual preflight and WebSession request
        run: |
          source scripts/infra-performance/hosted-browser/tls.sh
          export ASSESSMENT_CHROMIUM="$(command -v google-chrome)"
          bun scripts/infra-performance/hosted-browser/proof.test.mjs

  native:
    needs: transport
    if: github.event_name == 'workflow_dispatch' && inputs.view != 'offline-calibration' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/bun-runtime
      - run: bash scripts/install-workspace.sh --ignore-scripts
      - name: Measure the selected fresh view on the native acceptance alias
        env:
          BROWSER_RELEASE_REVISION: ${{ inputs.revision }}
          BROWSER_VIEW: ${{ inputs.view }}
          BROWSER_NETWORK: ${{ inputs.network }}
          NATIVE_STORAGE_ADMISSION: ${{ vars.NATIVE_STORAGE_ADMISSION }}
          SMOKE_PROOF: ${{ secrets.NATIVE_STORAGE_SMOKE_PROOF }}
        run: |
          source scripts/infra-performance/hosted-browser/tls.sh
          export ASSESSMENT_CHROMIUM="$(command -v google-chrome)"
          bun scripts/infra-performance/hosted-browser/native.mjs
      - name: Retain observed and partial browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: closed-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/hosted-browser/attempts.jsonl
          if-no-files-found: error
          retention-days: 7

  calibration:
    if: github.event_name == 'workflow_dispatch' && inputs.view == 'offline-calibration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/bun-install
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fb53d9e755c14393048dc945fc0b7f117730d872
          path: baseline-d1
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 15cfe773cd263b6a3d4e1b6e1b958f233cdde84f
          path: baseline-calibration
          sparse-checkout: apps/server
          persist-credentials: false
      - name: Rehearse the mounted ordinary Transactions profile
        run: |
          set -eu
          (cd baseline-d1 && bash scripts/install-workspace.sh --ignore-scripts)
          source scripts/infra-performance/hosted-browser/tls.sh
          export ASSESSMENT_CHROMIUM="$(command -v google-chrome)"
          export FIDY_DIAGNOSTIC_DIR="$RUNNER_TEMP"
          export NATIVE_WEB_ASSETS="$RUNNER_TEMP/native-web" D1_WEB_ASSETS="$RUNNER_TEMP/d1-web"
          (cd apps/web && VITE_API_ORIGIN=installed bun ../../node_modules/vite/bin/vite.js build --mode production --outDir "$NATIVE_WEB_ASSETS")
          (cd baseline-d1/apps/web && VITE_API_ORIGIN=https://api.fidyapp.com bun ../../node_modules/vite/bin/vite.js build --mode production --outDir "$D1_WEB_ASSETS")
          python3 scripts/infra-performance/canonical-fixture/hosted.py rehearse --browser-workspace --out "$RUNNER_TEMP/native"
          export SMOKE_PROOF="$(jq -r .SMOKE_PROOF "$RUNNER_TEMP/native/rehearsal-verifier.json")"
          export FIDY_NATIVE_FIXTURE_PUBLIC_KEY="$(jq -r .FIDY_NATIVE_FIXTURE_PUBLIC_KEY "$RUNNER_TEMP/native/rehearsal-verifier.json")"
          python3 scripts/infra-performance/cells/prepare.py --d1 baseline-d1 --calibration baseline-calibration \
            --canonical-fixture "$RUNNER_TEMP/native/fixture" --materialized --browser-workspace --out "$RUNNER_TEMP/bulk"
      - name: Retain the verified workload and D1 cost
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: closed-browser-calibration-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bulk/snapshot-proof.json
            ${{ runner.temp }}/bulk/probe.json
            ${{ runner.temp }}/ordinary-*.json

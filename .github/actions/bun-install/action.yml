name: Bun install
description: Pin Bun, restore its install cache, and install the root dependencies.
inputs:
  save-cache:
    description: Save a missing cache after the job; disable when another job publishes the same key.
    default: "true"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/bun-runtime
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      if: ${{ runner.os != 'Windows' && inputs.save-cache == 'true' }}
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'tools/*/bun.lock') }}
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      if: ${{ runner.os != 'Windows' && inputs.save-cache != 'true' }}
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'tools/*/bun.lock') }}
    - name: Install dependencies
      shell: bash
      run: bash scripts/install-workspace.sh

name: Deploy Production

on:
  push:
    branches: [trunk]

permissions:
  contents: read

# GitHub retains at most one pending run in this group. A newer trunk revision
# supersedes an older pending revision, while the active deployment finishes.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Railway then Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out the exact trunk revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install the locked workspace
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Calculate the canonical contract identity
        id: contract
        run: |
          DIGEST=$(bun run --cwd apps/server --silent contracts:digest)
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Confirm the release is still the current trunk revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GIT_SHA: ${{ github.sha }}
        run: |
          CURRENT_TRUNK_SHA=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/${{ github.event.repository.default_branch }}" \
            --jq .sha)
          if [[ "$CURRENT_TRUNK_SHA" != "$RELEASE_GIT_SHA" ]]; then
            echo "Release $RELEASE_GIT_SHA was superseded by $CURRENT_TRUNK_SHA; skipping Railway." >&2
            exit 1
          fi

      - name: Deploy and verify the exact Railway revision
        id: railway
        env:
          PRODUCTION_API_ORIGIN: ${{ vars.PRODUCTION_API_ORIGIN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RELEASE_CONTRACT_DIGEST: ${{ steps.contract.outputs.digest }}
          RELEASE_GIT_SHA: ${{ github.sha }}
        run: bun scripts/production/railway-release.ts

      - name: Build and validate the Production static artifact
        env:
          RELEASE_GIT_SHA: ${{ github.sha }}
        run: bun run --cwd apps/web build:production

      - name: Upload one immutable Cloudflare version
        id: cloudflare-upload
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          workingDirectory: apps/web
          command: >-
            versions upload
            --config cloudflare/wrangler.json
            --tag ${{ github.sha }}
            --message "Production ${{ github.sha }}"

      - name: Capture the exact uploaded Cloudflare version
        id: cloudflare-version
        env:
          WRANGLER_OUTPUT: ${{ steps.cloudflare-upload.outputs.command-output }}
        run: bun scripts/production/cloudflare-version.ts

      - name: Recheck trunk immediately before promotion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GIT_SHA: ${{ github.sha }}
        run: |
          CURRENT_TRUNK_SHA=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/${{ github.event.repository.default_branch }}" \
            --jq .sha)
          if [[ "$CURRENT_TRUNK_SHA" != "$RELEASE_GIT_SHA" ]]; then
            echo "Release $RELEASE_GIT_SHA was superseded by $CURRENT_TRUNK_SHA; leaving the prior web version active." >&2
            exit 1
          fi

      - name: Promote only the uploaded Cloudflare version
        id: cloudflare-deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          workingDirectory: apps/web
          command: >-
            versions deploy
            ${{ steps.cloudflare-version.outputs.version-id }}
            --config cloudflare/wrangler.json
            --message "Production ${{ github.sha }}"
            --yes

      - name: Record the coordinated release
        if: ${{ always() }}
        env:
          CLOUDFLARE_VERSION_ID: ${{ steps.cloudflare-version.outputs.version-id }}
          RAILWAY_DEPLOYMENT_ID: ${{ steps.railway.outputs.deployment-id }}
          RELEASE_GIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Production release"
            echo "- Git revision: \`$RELEASE_GIT_SHA\`"
            echo "- Railway deployment: \`${RAILWAY_DEPLOYMENT_ID:-not-created}\`"
            echo "- Cloudflare version: \`${CLOUDFLARE_VERSION_ID:-not-uploaded}\`"
          } >> "$GITHUB_STEP_SUMMARY"

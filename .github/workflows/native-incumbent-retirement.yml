name: Retire the exact incumbent storage installation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect the fenced incumbent or dispose the observed exact inventory
        required: true
        type: choice
        options: [inventory, dispose]
      opening_artifact:
        description: Protected verified canonical opening artifact ID
        required: true
        type: string
      opening_sha256:
        description: Canonical opening artifact ZIP SHA-256
        required: true
        type: string
      activity_artifact:
        description: Protected ordinary signup and native recovery artifact ID for disposition
        required: false
        type: string
      activity_sha256:
        description: Ordinary signup and native recovery artifact ZIP SHA-256
        required: false
        type: string
      inventory_artifact:
        description: Protected incumbent inventory artifact ID for disposition
        required: false
        type: string
      inventory_sha256:
        description: Incumbent inventory artifact ZIP SHA-256 for disposition
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  retirement:
    if: github.ref == 'refs/heads/trunk' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/bun-runtime
      - run: bash scripts/install-workspace.sh --ignore-scripts
      - name: Check the reviewed deployment policy
        run: bun infra/cloudflare/verify-edge-policy.ts
      - name: Inspect the fenced incumbent or dispose the exact published inventory
        env:
          GH_TOKEN: ${{ github.token }}
          RETIREMENT_OPERATION: ${{ inputs.operation }}
          OPENING_ARTIFACT: ${{ inputs.opening_artifact }}
          OPENING_SHA256: ${{ inputs.opening_sha256 }}
          ACTIVITY_ARTIFACT: ${{ inputs.activity_artifact }}
          ACTIVITY_SHA256: ${{ inputs.activity_sha256 }}
          INVENTORY_ARTIFACT: ${{ inputs.inventory_artifact }}
          INVENTORY_SHA256: ${{ inputs.inventory_sha256 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
          RETIREMENT_R2_ACCESS_KEY_ID: ${{ secrets.RETIREMENT_R2_ACCESS_KEY_ID }}
          RETIREMENT_R2_SECRET_ACCESS_KEY: ${{ secrets.RETIREMENT_R2_SECRET_ACCESS_KEY }}
        run: python3 scripts/retirement/run.py "$RETIREMENT_OPERATION"
      - name: Retain the exact incumbent inventory
        if: success() && inputs.operation == 'inventory'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: incumbent-retirement-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/incumbent-inventory.json
          if-no-files-found: error
      - name: Retain the disposition and reconciled provider findings
        if: always() && inputs.operation == 'dispose'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: incumbent-retirement-disposition-${{ github.run_id }}
          path: ${{ runner.temp }}/incumbent-disposition.jsonl
          if-no-files-found: warn

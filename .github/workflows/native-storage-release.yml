name: Release native application

on:
  push:
    branches: [trunk]
    paths:
      - "apps/server/**"
      - "apps/web/**"
      - "apps/site/**"
      - "infra/cloudflare/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - ".github/workflows/native-storage-release.yml"
  workflow_dispatch:
    inputs:
      installed_revision:
        description: Optional installed commit for installed verification after verifier-only changes
        required: false
        type: string
      transaction_fixture_signer:
        description: Require the protected performance-1 signer on this closed acceptance revision
        required: false
        default: false
        type: boolean
      fallback_artifact:
        description: Protected sealed stage artifact ID for dormant forward recovery
        required: false
        type: string
      fallback_sha256:
        description: Independently approved stage archive SHA-256 for dormant forward recovery
        required: false
        type: string
      canonical_source_revision:
        description: Exact accepted application SHA when its active archive was produced by a separate verifier
        required: false
        type: string
      canonical_source_artifact:
        description: Protected active successor artifact ID for the read-only canonical host plan
        required: false
        type: string
      canonical_source_sha256:
        description: Reviewed active successor archive SHA-256 for the read-only canonical host plan
        required: false
        type: string
      canonical_smoke_artifact:
        description: Protected native-only correctness and disposal archive ID
        required: false
        type: string
      canonical_smoke_sha256:
        description: Independently verified SHA-256 of the native correctness archive
        required: false
        type: string
      canonical_transfer_artifact:
        description: Protected closed canonical host transfer artifact ID
        required: false
        type: string
      canonical_transfer_sha256:
        description: Reviewed SHA-256 of the exact closed canonical host transfer
        required: false
        type: string
      canonical_rollback_artifact:
        description: Protected failed opening artifact for retrying after an exact rollback
        required: false
        type: string
      canonical_rollback_sha256:
        description: Reviewed SHA-256 of the failed opening evidence
        required: false
        type: string
      canonical_opening_artifact:
        description: Exact protected opening artifact ID for actual signup and background verification
        required: false
        type: string
      canonical_opening_sha256:
        description: Independently verified SHA-256 of the protected opening artifact
        required: false
        type: string
      canonical_signup_observed_at:
        description: UTC timestamp for an operator-confirmed public signup if its log event is missing
        required: false
        type: string
      fleet_source_run:
        description: Original protected ten-User trial run ID for cleanup
        required: false
        type: string
      operation:
        description: Operate the isolated SQLite installation
        required: true
        type: choice
        options:
          [
            verify,
            verify-erasure,
            continue-erasure,
            fleet-pilot,
            ten-hosted,
            continue-ten-cleanup,
            continue-fleet-cleanup,
            plan-first-install,
            first-install,
            open-canonical-signup,
            verify-canonical-activity,
            stage-hosts,
            plan-fixture-repair,
            plan-pairing-repair,
            stage-pairing-repair,
            resume-pairing-stage,
            resume-fixture-upload,
            plan-fixture-fallback,
            prepare-fixture-fallback,
            reseal-fixture-fallback,
            diagnose-fixture-pairing,
            recover-fixture-fallback,
            resume-pairing-rollback,
            rollout,
            rehearse-rollback,
            publish-site,
          ]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/trunk' && inputs.operation != 'publish-site' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.operation == 'fleet-pilot' || inputs.operation == 'ten-hosted' || inputs.operation == 'continue-ten-cleanup') && 110 || inputs.operation == 'continue-fleet-cleanup' && 55 || (inputs.operation == 'first-install' || inputs.operation == 'verify-erasure' || inputs.operation == 'continue-erasure' || inputs.operation == 'resume-fixture-upload' || (inputs.operation == 'prepare-fixture-fallback' || (inputs.operation == 'stage-pairing-repair' || inputs.operation == 'resume-pairing-stage')) || inputs.operation == 'reseal-fixture-fallback' || inputs.operation == 'diagnose-fixture-pairing' || inputs.operation == 'recover-fixture-fallback') && 90 || 30 }}
    environment: production
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_OPERATION: ${{ inputs.operation || 'rollout' }}
      FIXTURE_RELEASE_OPERATION: ${{ inputs.operation || 'rollout' }}
      NATIVE_FIXTURE_BUILD: ${{ (inputs.operation == 'plan-fixture-fallback' || (inputs.operation == 'plan-fixture-repair' || inputs.operation == 'plan-pairing-repair' || (inputs.operation == 'stage-pairing-repair' || inputs.operation == 'resume-pairing-stage')) || inputs.operation == 'resume-fixture-upload' || inputs.operation == 'prepare-fixture-fallback' || inputs.operation == 'reseal-fixture-fallback' || inputs.operation == 'diagnose-fixture-pairing' || inputs.operation == 'recover-fixture-fallback' || inputs.operation == 'resume-pairing-rollback') && 'fallback' || 'ordinary' }}
      NATIVE_FIXTURE_SIGNER_SHA256: ${{ inputs.transaction_fixture_signer && vars.NATIVE_FIXTURE_SIGNER_SHA256 || '' }}
      NATIVE_STORAGE_HOSTS: ${{ (inputs.operation == 'open-canonical-signup') && 'staged' || vars.NATIVE_STORAGE_HOSTS || 'acceptance' }}
      CLOUDFLARE_ACCESS_ISSUER: ${{ secrets.CLOUDFLARE_ACCESS_ISSUER }}
      RECOVERY_OPERATOR_EMAIL: ${{ vars.RECOVERY_OPERATOR_EMAIL }}
      BETA_PRO_OPERATOR_EMAIL: ${{ vars.BETA_PRO_OPERATOR_EMAIL }}
      SAMPLE_REVIEWER_EMAIL: ${{ vars.SAMPLE_REVIEWER_EMAIL }}
      BILLING_SUPPORT_AUDIENCE: ${{ vars.BILLING_SUPPORT_AUDIENCE }}
      PRICING_PUBLISH_AUDIENCE: ${{ vars.PRICING_PUBLISH_AUDIENCE }}
      RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
      NATIVE_STORAGE_ADMISSION: ${{ vars.NATIVE_STORAGE_ADMISSION }}
      RELEASE_GIT_SHA: ${{ github.sha }}
      RELEASE_ATTEMPT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      ALCHEMY_PROFILE: ci
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      SMOKE_PROOF: ${{ secrets.NATIVE_STORAGE_SMOKE_PROOF }}
    steps:
      - name: Require closed admission in the protected environment
        env:
          EXPECTED_INSTALLED_REVISION: ${{ inputs.installed_revision }}
          RELEASE_OPERATION: ${{ inputs.operation || 'rollout' }}
          FIXTURE_SIGNER_REQUESTED: ${{ inputs.transaction_fixture_signer }}
          STAGE_ARTIFACT: ${{ inputs.fallback_artifact }}
          STAGE_SHA256: ${{ inputs.fallback_sha256 }}
        run: |
          if [[ "$RELEASE_OPERATION" == verify-canonical-activity ]]; then
            [[ "$NATIVE_STORAGE_ADMISSION" == closed || "$NATIVE_STORAGE_ADMISSION" == open ]]
          else
            test "$NATIVE_STORAGE_ADMISSION" = closed
          fi
          if [[ "$NATIVE_FIXTURE_BUILD" == fallback ]]; then
            [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$GITHUB_REF_PROTECTED" == true && "$FIXTURE_SIGNER_REQUESTED" == true ]]
          fi
          if [[ "$FIXTURE_SIGNER_REQUESTED" == true ]]; then
            [[ "$NATIVE_STORAGE_HOSTS" == acceptance && "$NATIVE_FIXTURE_SIGNER_SHA256" =~ ^[a-f0-9]{64}$ ]]
            [[ "$RELEASE_OPERATION" == rollout || "$RELEASE_OPERATION" == verify || "$NATIVE_FIXTURE_BUILD" == fallback ]]
          fi
          if [[ "$RELEASE_OPERATION" == ten-hosted ]]; then
            test "$GITHUB_RUN_ATTEMPT" = 1
          fi
          if [[ "$RELEASE_OPERATION" == resume-pairing-rollback ]]; then
            test -n "$EXPECTED_INSTALLED_REVISION"
          fi
          if [[ "$RELEASE_OPERATION" == fleet-pilot || "$RELEASE_OPERATION" == continue-fleet-cleanup || "$RELEASE_OPERATION" == ten-hosted || "$RELEASE_OPERATION" == continue-ten-cleanup ]]; then
            echo "FLEET_PILOT_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"
          fi
          if [[ -n "$EXPECTED_INSTALLED_REVISION" ]]; then
            [[ "$EXPECTED_INSTALLED_REVISION" =~ ^[0-9a-f]{40}$ ]]
            if [[ "$FIXTURE_SIGNER_REQUESTED" == true && "$EXPECTED_INSTALLED_REVISION" != b85bfb06ab573259c250231623b77b0f65e2ae5c ]]; then
              [[ "$RELEASE_OPERATION" == recover-fixture-fallback || "$RELEASE_OPERATION" == resume-pairing-rollback || "$RELEASE_OPERATION" == rollout || "$RELEASE_OPERATION" == verify ]]
              [[ "$STAGE_ARTIFACT" =~ ^[1-9][0-9]{0,19}$ && "$STAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            else
              [[ "$RELEASE_OPERATION" == verify || "$RELEASE_OPERATION" == verify-erasure || "$RELEASE_OPERATION" == continue-erasure || "$RELEASE_OPERATION" == fleet-pilot || "$RELEASE_OPERATION" == continue-fleet-cleanup || "$RELEASE_OPERATION" == ten-hosted || "$RELEASE_OPERATION" == continue-ten-cleanup ]]
            fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind the protected verifier to the staged application source
        if: inputs.transaction_fixture_signer && (env.RELEASE_OPERATION == 'reseal-fixture-fallback' || env.RELEASE_OPERATION == 'diagnose-fixture-pairing' || env.RELEASE_OPERATION == 'recover-fixture-fallback' || env.RELEASE_OPERATION == 'resume-pairing-rollback' || env.RELEASE_OPERATION == 'rollout' || env.RELEASE_OPERATION == 'verify')
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_INSTALLED_REVISION: ${{ inputs.installed_revision }}
          STAGE_ARTIFACT: ${{ inputs.fallback_artifact }}
          STAGE_SHA256: ${{ inputs.fallback_sha256 }}
        run: |
          if [[ -n "$EXPECTED_INSTALLED_REVISION" && "$EXPECTED_INSTALLED_REVISION" != b85bfb06ab573259c250231623b77b0f65e2ae5c ]]; then
            python3 scripts/infra-performance/canonical-fixture/pairing_stage.py
          else
            python3 scripts/infra-performance/canonical-fixture/unsealed_stage.py source
          fi
      - name: Authenticate the interrupted pairing upload and its original controls
        if: env.RELEASE_OPERATION == 'resume-pairing-stage'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/infra-performance/canonical-fixture/pairing_stage.py resume-upload
      - name: Authenticate the exact closed active source for canonical host planning
        if: env.RELEASE_OPERATION == 'open-canonical-signup'
        env:
          CANONICAL_TRANSFER_ARTIFACT: ${{ inputs.canonical_transfer_artifact }}
          CANONICAL_TRANSFER_SHA256: ${{ inputs.canonical_transfer_sha256 }}
          CANONICAL_ROLLBACK_ARTIFACT: ${{ inputs.canonical_rollback_artifact }}
          CANONICAL_ROLLBACK_SHA256: ${{ inputs.canonical_rollback_sha256 }}
          CANONICAL_SMOKE_ARTIFACT: ${{ inputs.canonical_smoke_artifact }}
          CANONICAL_SMOKE_SHA256: ${{ inputs.canonical_smoke_sha256 }}
          CANONICAL_SOURCE_REVISION: ${{ inputs.canonical_source_revision }}
          CANONICAL_SOURCE_ARTIFACT: ${{ inputs.canonical_source_artifact }}
          CANONICAL_SOURCE_SHA256: ${{ inputs.canonical_source_sha256 }}
          FIDY_NATIVE_FIXTURE_PUBLIC_KEY: ${{ vars.FIDY_NATIVE_FIXTURE_PUBLIC_KEY }}
        run: python3 scripts/infra-performance/canonical-fixture/canonical_host_source.py
      - uses: ./.github/actions/bun-runtime
      - run: bash scripts/install-workspace.sh --ignore-scripts
      - uses: ./.github/actions/configure-alchemy-cloudflare-profile
      - name: Bind evidence to the protected revision
        run: |
          if [[ -n "$NATIVE_FIXTURE_SIGNER_SHA256" ]]; then
            echo "FIXTURE_WEB_REVISION=$(jq -er .revision infra/cloudflare/native-fixture-upload.json)" >> "$GITHUB_ENV"
            echo "FIDY_NATIVE_FIXTURE_PROVIDER_REVISION=$(jq -er .revision infra/cloudflare/native-retained-provider.json)" >> "$GITHUB_ENV"
          fi
          echo "HOSTED_AI_MODEL=$(bun infra/cloudflare/scripts/print-approved-openai-model.ts)" >> "$GITHUB_ENV"
          echo "CONTRACT_DIGEST=$(bun run --silent --cwd apps/server contracts:digest)" >> "$GITHUB_ENV"
          echo "RELEASE_SNAPSHOT_FILE=$RUNNER_TEMP/native-release.json" >> "$GITHUB_ENV"
          echo "SMOKE_ATTESTATION_FILE=$RUNNER_TEMP/native-verification.json" >> "$GITHUB_ENV"
      - name: Check the reviewed release policy
        working-directory: infra/cloudflare
        run: bun verify-edge-policy.ts
      - name: Build the expected browser artifact for independent verification
        if: env.RELEASE_OPERATION == 'plan-fixture-repair' || env.RELEASE_OPERATION == 'verify' || env.RELEASE_OPERATION == 'verify-erasure' || env.RELEASE_OPERATION == 'continue-erasure' || env.RELEASE_OPERATION == 'fleet-pilot' || env.RELEASE_OPERATION == 'continue-fleet-cleanup' || env.RELEASE_OPERATION == 'ten-hosted' || env.RELEASE_OPERATION == 'continue-ten-cleanup' || env.RELEASE_OPERATION == 'stage-hosts' || env.RELEASE_OPERATION == 'recover-fixture-fallback' || env.RELEASE_OPERATION == 'resume-fixture-upload' || (inputs.transaction_fixture_signer && env.RELEASE_OPERATION == 'rollout') || env.RELEASE_OPERATION == 'plan-pairing-repair' || (env.RELEASE_OPERATION == 'stage-pairing-repair' || env.RELEASE_OPERATION == 'resume-pairing-stage')
        env:
          RELEASE_GIT_SHA: ${{ env.FIXTURE_WEB_REVISION || inputs.installed_revision || github.sha }}
        working-directory: apps/web
        run: bun run build:production
      - name: Verify the fresh native plan against the existing state store
        if: env.RELEASE_OPERATION == 'plan-first-install'
        env:
          NATIVE_FIXTURE_SIGNING_KEY: ${{ inputs.transaction_fixture_signer && secrets.NATIVE_FIXTURE_SIGNING_KEY || '' }}
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
        working-directory: infra/cloudflare
        run: bun native-storage-resources.ts plan-first-install
      - name: Install the verified fresh native application
        if: env.RELEASE_OPERATION == 'first-install'
        env:
          NATIVE_FIXTURE_SIGNING_KEY: ${{ inputs.transaction_fixture_signer && secrets.NATIVE_FIXTURE_SIGNING_KEY || '' }}
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
        working-directory: infra/cloudflare
        run: bun native-storage-resources.ts first-install
      - name: Authenticate the original interrupted upload before planning or applying its repair
        if: env.RELEASE_OPERATION == 'plan-fixture-repair' || env.RELEASE_OPERATION == 'resume-fixture-upload'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/infra-performance/canonical-fixture/interrupted_upload.py
      - name: Authenticate the unsealed zero-traffic pair
        if: env.RELEASE_OPERATION == 'reseal-fixture-fallback' || env.RELEASE_OPERATION == 'diagnose-fixture-pairing'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/infra-performance/canonical-fixture/unsealed_stage.py restore
      - name: Authenticate the predecessor of the pairing repair
        if: env.RELEASE_OPERATION == 'plan-pairing-repair' || env.RELEASE_OPERATION == 'stage-pairing-repair'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/infra-performance/canonical-fixture/unsealed_stage.py replacement
      - name: Capture the native stable pair
        if: env.RELEASE_OPERATION == 'rollout' || env.RELEASE_OPERATION == 'rehearse-rollback' || env.RELEASE_OPERATION == 'resume-fixture-upload' || env.RELEASE_OPERATION == 'prepare-fixture-fallback' || env.RELEASE_OPERATION == 'plan-fixture-fallback' || env.RELEASE_OPERATION == 'plan-fixture-repair' || env.RELEASE_OPERATION == 'plan-pairing-repair' || env.RELEASE_OPERATION == 'stage-pairing-repair'
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts capture
      - name: Read the complete dormant resource plan without applying it
        id: dormant_plan
        if: env.RELEASE_OPERATION == 'plan-fixture-fallback' || env.RELEASE_OPERATION == 'plan-fixture-repair' || env.RELEASE_OPERATION == 'plan-pairing-repair'
        working-directory: infra/cloudflare
        env:
          NATIVE_FIXTURE_SIGNING_KEY: ${{ secrets.NATIVE_FIXTURE_SIGNING_KEY }}
        run: bun native-storage-resources.ts plan-fixture-fallback
      - name: Save the observed read-only fallback inventory
        if: always() && (steps.dormant_plan.outcome == 'success' || steps.dormant_plan.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-fixture-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/native-fixture-plan.json
          if-no-files-found: error
      - name: Upload the verified native candidates
        if: env.RELEASE_OPERATION == 'rollout' || env.RELEASE_OPERATION == 'rehearse-rollback' || env.RELEASE_OPERATION == 'resume-fixture-upload' || env.RELEASE_OPERATION == 'prepare-fixture-fallback' || env.RELEASE_OPERATION == 'stage-pairing-repair'
        env:
          NATIVE_FIXTURE_SIGNING_KEY: ${{ inputs.transaction_fixture_signer && secrets.NATIVE_FIXTURE_SIGNING_KEY || '' }}
        working-directory: infra/cloudflare
        run: bun native-storage-resources.ts upload
      - name: Stage the zero-traffic native candidates
        if: env.RELEASE_OPERATION == 'rollout' || env.RELEASE_OPERATION == 'rehearse-rollback' || env.RELEASE_OPERATION == 'resume-fixture-upload' || env.RELEASE_OPERATION == 'prepare-fixture-fallback' || env.RELEASE_OPERATION == 'stage-pairing-repair'
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts stage
      - name: Resume the exact uploaded Workers at zero traffic
        if: env.RELEASE_OPERATION == 'resume-pairing-stage'
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts resume-pairing-stage
      - name: Persist and read back private observability on the installed application Workers
        if: env.RELEASE_OPERATION == 'first-install' || env.RELEASE_OPERATION == 'rollout' || env.RELEASE_OPERATION == 'rehearse-rollback' || env.RELEASE_OPERATION == 'resume-fixture-upload' || env.RELEASE_OPERATION == 'prepare-fixture-fallback' || (env.RELEASE_OPERATION == 'stage-pairing-repair' || env.RELEASE_OPERATION == 'resume-pairing-stage')
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts prepare-diagnostics
      - name: Qualify the closed recovery artifacts and their retained controls
        if: env.RELEASE_OPERATION == 'resume-fixture-upload' || env.RELEASE_OPERATION == 'prepare-fixture-fallback' || (env.RELEASE_OPERATION == 'stage-pairing-repair' || env.RELEASE_OPERATION == 'resume-pairing-stage')
        env:
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts seal-fallback
      - name: Requalify the archived zero-traffic pair without moving traffic
        if: env.RELEASE_OPERATION == 'reseal-fixture-fallback'
        env:
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts reseal-fallback
      - name: Compare pairing requests on the archived zero-traffic pair
        if: env.RELEASE_OPERATION == 'diagnose-fixture-pairing'
        env:
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts diagnose-pairing
      - name: Seal dormant fallback stage before promotion
        if: env.RELEASE_OPERATION == 'reseal-fixture-fallback' || env.RELEASE_OPERATION == 'resume-fixture-upload' || env.RELEASE_OPERATION == 'prepare-fixture-fallback' || (env.RELEASE_OPERATION == 'stage-pairing-repair' || env.RELEASE_OPERATION == 'resume-pairing-stage')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-fixture-fallback-${{ github.run_id }}
          path: ${{ runner.temp }}/native-fallback-stage.json
          if-no-files-found: error
      - name: Authenticate the interrupted dormant stage
        if: env.RELEASE_OPERATION == 'recover-fixture-fallback' && !env.FIXTURE_PAIRING_APPLICATION
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_ARTIFACT: ${{ inputs.fallback_artifact }}
          STAGE_SHA256: ${{ inputs.fallback_sha256 }}
        run: |
          python3 scripts/infra-performance/canonical-fixture/fallback_stage.py \
            --artifact-id "$STAGE_ARTIFACT" --sha256 "$STAGE_SHA256" --out "$RUNNER_TEMP/native-fallback-stage.json"
      - name: Finish only the tested closed forward repair
        if: env.RELEASE_OPERATION == 'resume-fixture-upload' || env.RELEASE_OPERATION == 'prepare-fixture-fallback' || env.RELEASE_OPERATION == 'recover-fixture-fallback'
        env:
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts forward-fallback
      - name: Verify mixed and candidate versions before promoting closed admission
        id: promote
        if: env.RELEASE_OPERATION == 'rollout' || env.RELEASE_OPERATION == 'rehearse-rollback'
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts promote
      - name: Rebuild the exact retained Web assets without uploading them
        if: env.RELEASE_OPERATION == 'open-canonical-signup'
        run: |
          source="$RUNNER_TEMP/native-canonical-host-source.json"
          web_revision=$(jq -er .website.revision "$source")
          web_digest=$(jq -er .website.contractDigest "$source")
          git worktree add --detach "$RUNNER_TEMP/canonical-retained-web" "$web_revision"
          (
            cd "$RUNNER_TEMP/canonical-retained-web"
            bash scripts/install-workspace.sh --ignore-scripts
            cd apps/web
            RELEASE_GIT_SHA="$web_revision" CONTRACT_DIGEST="$web_digest" bun run build:production
          )
          mkdir -p apps/web/dist
          cp -R "$RUNNER_TEMP/canonical-retained-web/apps/web/dist/." apps/web/dist
      - name: Capture exact closed canonical versions and the protected User Store census
        if: env.RELEASE_OPERATION == 'open-canonical-signup'
        env:
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts capture-canonical-signup
      - name: Upload only the compatible exact canonical signup versions
        if: env.RELEASE_OPERATION == 'open-canonical-signup'
        env:
          NATIVE_STORAGE_ADMISSION: open
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          KAPSO_WEBHOOK_SECRET: ${{ secrets.KAPSO_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          WOMPI_ENVIRONMENT: ${{ secrets.WOMPI_ENVIRONMENT }}
          WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
          WOMPI_PRIVATE_KEY: ${{ secrets.WOMPI_PRIVATE_KEY }}
          WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
          WOMPI_EVENT_SECRET: ${{ secrets.WOMPI_EVENT_SECRET }}
          WHATSAPP_BUSINESS_PORTFOLIO_ID: ${{ secrets.WHATSAPP_BUSINESS_PORTFOLIO_ID }}
          PAT_ADMISSION_KEY: ${{ secrets.PAT_ADMISSION_KEY }}
        working-directory: infra/cloudflare
        run: bun native-storage-resources.ts upload-canonical-signup
      - name: Stage and verify both canonical signup Workers before opening
        if: env.RELEASE_OPERATION == 'open-canonical-signup'
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts stage-canonical-signup
      - name: Open the exact canonical signup pair and verify real provider redirects
        if: env.RELEASE_OPERATION == 'open-canonical-signup'
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts promote-canonical-signup
      - name: Retain exact canonical signup deployment and redirect evidence
        if: env.RELEASE_OPERATION == 'open-canonical-signup'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-canonical-signup-open-${{ github.run_id }}
          path: ${{ runner.temp }}/native-verification.json.canonical-open
          if-no-files-found: error
      - name: Authenticate actual canonical signup and live native background evidence
        if: env.RELEASE_OPERATION == 'verify-canonical-activity'
        env:
          CANONICAL_OPENING_ARTIFACT: ${{ inputs.canonical_opening_artifact }}
          CANONICAL_OPENING_SHA256: ${{ inputs.canonical_opening_sha256 }}
          CANONICAL_SIGNUP_OBSERVED_AT: ${{ inputs.canonical_signup_observed_at }}
        run: python3 scripts/infra-performance/canonical-fixture/canonical_activity.py
      - name: Verify the same canonical routing, one added User Store and accepted recovery
        if: env.RELEASE_OPERATION == 'verify-canonical-activity'
        working-directory: infra/cloudflare
        run: bun ./native-storage-release.ts verify-canonical-activity
      - name: Retain verified actual native canonical activity
        if: env.RELEASE_OPERATION == 'verify-canonical-activity'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-canonical-signup-verified-${{ github.run_id }}
          path: ${{ runner.temp }}/native-verification.json.canonical-activity
          if-no-files-found: error
      - name: Stage only canonical Access paths and vacant hostnames on the verified closed release
        if: env.RELEASE_OPERATION == 'stage-hosts'
        env:
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
        working-directory: infra/cloudflare
        run: |
          bun native-storage-resources.ts stage-hosts
          bun native-storage-release.ts attach-hosts
      - name: Verify the installed application and retained schema markers
        id: verify
        if: env.RELEASE_OPERATION != 'plan-fixture-fallback' && env.RELEASE_OPERATION != 'plan-first-install' && env.RELEASE_OPERATION != 'first-install' && env.RELEASE_OPERATION != 'verify-erasure' && env.RELEASE_OPERATION != 'continue-erasure' && env.RELEASE_OPERATION != 'fleet-pilot' && env.RELEASE_OPERATION != 'continue-fleet-cleanup' && env.RELEASE_OPERATION != 'ten-hosted' && env.RELEASE_OPERATION != 'continue-ten-cleanup' && env.RELEASE_OPERATION != 'plan-fixture-repair' && env.RELEASE_OPERATION != 'reseal-fixture-fallback' && env.RELEASE_OPERATION != 'diagnose-fixture-pairing' && env.RELEASE_OPERATION != 'plan-pairing-repair' && env.RELEASE_OPERATION != 'stage-pairing-repair' && env.RELEASE_OPERATION != 'resume-pairing-stage' && env.RELEASE_OPERATION != 'resume-pairing-rollback' && env.RELEASE_OPERATION != 'open-canonical-signup' && env.RELEASE_OPERATION != 'verify-canonical-activity'
        env:
          EXPECTED_INSTALLED_REVISION: ${{ inputs.installed_revision }}
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts verify
      - name: Verify the installed application and physical erasure of one disposable User
        if: env.RELEASE_OPERATION == 'first-install' || env.RELEASE_OPERATION == 'verify-erasure'
        env:
          EXPECTED_INSTALLED_REVISION: ${{ inputs.installed_revision }}
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts verify-erasure
      - name: Authenticate the source protected observation
        if: env.RELEASE_OPERATION == 'continue-erasure' || env.RELEASE_OPERATION == 'continue-fleet-cleanup'
        env:
          RELEASE_OPERATION: ${{ inputs.operation || 'rollout' }}
          ERASURE_EVIDENCE: ${{ vars.ERASURE_CONTINUATION_EVIDENCE }}
          FLEET_EVIDENCE: ${{ vars.FLEET_CONTINUATION_EVIDENCE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          if [[ "$RELEASE_OPERATION" == continue-erasure ]]; then
            EVIDENCE="$ERASURE_EVIDENCE"
            step="Verify the installed application and physical erasure of one disposable User"
            jq -e '.survivorsSha256 | test("^[0-9a-f]{64}$")' <<< "$EVIDENCE" > /dev/null
          else
            EVIDENCE="$FLEET_EVIDENCE"
            step="Measure one disposable User on the verified closed release"
            jq -e '[.meterSha256,.targetSha256,.userSha256] | all(type == "string" and test("^[0-9a-f]{64}$"))' <<< "$EVIDENCE" > /dev/null
          fi
          jq -e '
            ([.runId,.artifactId] | all(type == "string" and test("^[1-9][0-9]{0,19}$"))) and
            (.sourceRevision | test("^[0-9a-f]{40}$")) and
            ([.checkpointSha256,.archiveSha256,.baselineSha256] | all(type == "string" and test("^[0-9a-f]{64}$")))
          ' <<< "$EVIDENCE" > /dev/null
          run=$(jq -r .runId <<< "$EVIDENCE")
          artifact=$(jq -r .artifactId <<< "$EVIDENCE")
          source=$(jq -r .sourceRevision <<< "$EVIDENCE")
          archive=$(jq -r .archiveSha256 <<< "$EVIDENCE")
          file=$(jq -r .checkpointSha256 <<< "$EVIDENCE")
          git merge-base --is-ancestor "$source" HEAD
          if [[ "$RELEASE_OPERATION" == continue-erasure ]]; then
            git diff --quiet "$source" HEAD -- infra/cloudflare/native-erasure.ts
          fi
          base="repos/$GITHUB_REPOSITORY/actions"
          gh api "$base/runs/$run" | jq -e --arg sha "$source" --arg repo "$GITHUB_REPOSITORY" '
            .path == ".github/workflows/native-storage-release.yml" and .repository.full_name == $repo and
            .event == "workflow_dispatch" and .head_branch == "trunk" and .head_sha == $sha and
            .run_attempt == 1 and .conclusion == "failure"' > /dev/null
          gh api "$base/runs/$run/attempts/1/jobs" | jq -e --arg step "$step" '
            [.jobs[] | select(.name == "release" and .conclusion == "failure") | .steps[] |
            select(.name == $step and .conclusion == "failure")] | length == 1' > /dev/null
          gh api "$base/artifacts/$artifact" | jq -e --arg run "$run" --arg sha "$source" --arg archive "$archive" '
            .name == ("native-storage-release-" + $run) and (.workflow_run.id|tostring) == $run and
            .workflow_run.head_sha == $sha and .expired == false and .size_in_bytes <= 1048576 and
            .digest == ("sha256:" + $archive)' > /dev/null
          zip="$RUNNER_TEMP/source.zip"
          gh api "$base/artifacts/$artifact/zip" > "$zip"
          echo "$archive  $zip" | sha256sum --check --status
          if [[ "$RELEASE_OPERATION" == continue-erasure ]]; then
            unzip -p "$zip" native-verification.json.erasure > "$SMOKE_ATTESTATION_FILE.prior"
            echo "$file  $SMOKE_ATTESTATION_FILE.prior" | sha256sum --check --status
            jq -c '{runId,artifactId,sourceRevision,archiveSha256,checkpointSha256,baselineSha256,survivorsSha256}' <<< "$EVIDENCE" > "$RUNNER_TEMP/erasure-provenance.json"
            echo "ERASURE_SOURCE_EVIDENCE=$RUNNER_TEMP/erasure-provenance.json" >> "$GITHUB_ENV"
          else
            unzip -p "$zip" native-verification.json.fleet > "$RUNNER_TEMP/fleet-source.json"
            echo "$file  $RUNNER_TEMP/fleet-source.json" | sha256sum --check --status
            unzip -p "$zip" native-fleet-meter.jsonl > "$RUNNER_TEMP/fleet-source-meter.jsonl"
            echo "$(jq -r .meterSha256 <<< "$EVIDENCE")  $RUNNER_TEMP/fleet-source-meter.jsonl" | sha256sum --check --status
            jq -c '{runId,artifactId,sourceRevision,archiveSha256,checkpointSha256,meterSha256,targetSha256,userSha256,baselineSha256}' <<< "$EVIDENCE" > "$RUNNER_TEMP/fleet-provenance.json"
            mv "$zip" "$RUNNER_TEMP/fleet-source.zip"
          fi
      - name: Continue physical verification of the previously admitted User
        if: env.RELEASE_OPERATION == 'continue-erasure'
        env:
          EXPECTED_INSTALLED_REVISION: ${{ inputs.installed_revision }}
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts continue-erasure
      - name: Measure one disposable User on the verified closed release
        if: env.RELEASE_OPERATION == 'fleet-pilot'
        env:
          EXPECTED_INSTALLED_REVISION: ${{ inputs.installed_revision }}
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts fleet-pilot
      - name: Complete cleanup of the archived single fleet User on the verified release
        if: env.RELEASE_OPERATION == 'continue-fleet-cleanup'
        env:
          EXPECTED_INSTALLED_REVISION: ${{ inputs.installed_revision }}
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts continue-fleet-cleanup
      - name: Restore only a compatible, tested target after failed promoted verification
        if: ${{ failure() && steps.promote.outcome == 'success' && steps.verify.outcome == 'failure' }}
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts rollback
      - name: Restore only the remaining Core from the archived rollback
        if: env.RELEASE_OPERATION == 'resume-pairing-rollback'
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts resume-pairing-rollback
      - name: Exercise the tested code-only rollback
        if: success() && env.RELEASE_OPERATION == 'rehearse-rollback'
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts rollback
      - name: Prepare the ten-User fleet admission
        if: env.RELEASE_OPERATION == 'ten-hosted'
        env:
          EXPECTED_INSTALLED_REVISION: ${{ inputs.installed_revision }}
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts ten-prepare
      - name: Seal the protected pre-enrollment baseline and meter
        if: env.RELEASE_OPERATION == 'ten-hosted'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-ten-admission-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/native-verification.json.fleet
            ${{ runner.temp }}/native-fleet-meter.jsonl
      - name: Measure ten hosted fleet Users
        if: env.RELEASE_OPERATION == 'ten-hosted'
        env:
          EXPECTED_INSTALLED_REVISION: ${{ inputs.installed_revision }}
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts ten-hosted
      - name: Authenticate the interrupted ten-User trial
        if: env.RELEASE_OPERATION == 'continue-ten-cleanup'
        env:
          GH_TOKEN: ${{ github.token }}
          FLEET_SOURCE_RUN: ${{ inputs.fleet_source_run }}
        run: bash scripts/infra-performance/deployed-fleet/ten-source.sh
      - name: Complete the original ten-User cleanup
        if: env.RELEASE_OPERATION == 'continue-ten-cleanup'
        env:
          EXPECTED_INSTALLED_REVISION: ${{ inputs.installed_revision }}
          FLEET_SOURCE_RUN: ${{ inputs.fleet_source_run }}
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts continue-ten-cleanup
      - name: Retain native release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-storage-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-release.json*
            ${{ runner.temp }}/native-verification.json
            ${{ runner.temp }}/native-verification.json.erasure
            ${{ runner.temp }}/native-verification.json.fleet
            ${{ runner.temp }}/native-fleet-*.jsonl
            ${{ runner.temp }}/fleet-source.zip
            ${{ runner.temp }}/fleet-provenance.json
          if-no-files-found: ignore

  site:
    if: ${{ github.ref == 'refs/heads/trunk' && inputs.operation == 'publish-site' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      ALCHEMY_PROFILE: ci
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_GIT_SHA: ${{ github.sha }}
      SITE_PUBLICATION: marketing-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun-runtime
      - run: bash scripts/install-workspace.sh --ignore-scripts
      - uses: ./.github/actions/configure-alchemy-cloudflare-profile
      - name: Publish only the existing marketing and legal Site
        working-directory: infra/cloudflare
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/trunk" --jq .object.sha)" = "$RELEASE_GIT_SHA"
          bun native-storage-resources.ts publish-site
          curl --fail --silent --show-error --max-time 30 --retry 3 https://fidyapp.com/deployment-metadata.json | jq -e --arg revision "$RELEASE_GIT_SHA" '.gitRevision == $revision'

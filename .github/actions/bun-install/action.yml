name: Bun install
description: Pin Bun, restore its install cache, and install the root dependencies.

# The cache key hashes every lockfile in the repo, not just the root one, so all
# jobs share a single entry — including the jobs that go on to install an
# isolated tool tree under tools/, which draws from the same ~/.bun cache.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.3.14"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'tools/*/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

name: Bun install
description: Pin Bun and install frozen dependencies, with an optional package archive cache.
inputs:
  cache:
    description: Restore the package archive cache before the frozen install.
    default: "false"
  cli-release:
    description: Install only CLI production dependencies, without development lifecycle scripts.
    default: "false"
  save-cache:
    description: Save a missing cache after the job; disable when another job publishes the same key.
    default: "true"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/bun-runtime
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      if: ${{ inputs.cache == 'true' && inputs.cli-release != 'true' && runner.os != 'Windows' && inputs.save-cache == 'true' }}
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'tools/*/bun.lock') }}
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      if: ${{ inputs.cache == 'true' && inputs.cli-release != 'true' && runner.os != 'Windows' && inputs.save-cache != 'true' }}
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'tools/*/bun.lock') }}
    - name: Install dependencies
      shell: bash
      env:
        CLI_RELEASE: ${{ inputs.cli-release }}
      run: |
        if [[ "$CLI_RELEASE" == true ]]; then
          bash scripts/install-workspace.sh --cli-release
        else
          bash scripts/install-workspace.sh
        fi

name: Deploy Production

on:
  push:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      recover_deleted_queue:
        description: Recover the inspected deleted Queue incident under isolated public admission
        type: boolean
        default: false
      isolate_schema_cutover:
        description: Install exact isolated Workers for the reviewed populated-schema cutover; do not release public admission
        type: boolean
        default: false
      schema_cutover_public_version_id:
        description: Inspected currently serving public Worker version for schema isolation
        type: string
        default: ""
      schema_cutover_core_version_id:
        description: Inspected currently serving Core Worker version for schema isolation
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/trunk' && (vars.SCHEMA_CUTOVER_PENDING != 'true' || (github.event_name == 'workflow_dispatch' && inputs.isolate_schema_cutover)) }}
    name: Alchemy Cloudflare topology
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      RELEASE_GIT_SHA: ${{ github.sha }}
      ISOLATE_SCHEMA_CUTOVER: ${{ inputs.isolate_schema_cutover && 'true' || 'false' }}
      SCHEMA_CUTOVER_PUBLIC_VERSION_ID: ${{ inputs.schema_cutover_public_version_id }}
      SCHEMA_CUTOVER_CORE_VERSION_ID: ${{ inputs.schema_cutover_core_version_id }}
      GITHUB_TOKEN: ${{ github.token }}
      ALCHEMY_PROFILE: ci
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAT_ADMISSION_KEY: ${{ secrets.PAT_ADMISSION_KEY }}
      OPERATOR_ALERT_EMAIL: ${{ vars.OPERATOR_ALERT_EMAIL }}
      RECOVERY_OPERATOR_EMAIL: ${{ vars.RECOVERY_OPERATOR_EMAIL }}
      CLOUDFLARE_ACCESS_ISSUER: ${{ secrets.CLOUDFLARE_ACCESS_ISSUER }}
      SMOKE_PROOF: ${{ secrets.SMOKE_PROOF }}
      PROACTIVITY_ENABLED: ${{ vars.PROACTIVITY_ENABLED || 'disabled' }}
      PROACTIVITY_TEMPLATE_JSON: ${{ vars.PROACTIVITY_TEMPLATE_JSON }}
      WOMPI_DAVIPLATA_ACTIVATED: ${{ vars.WOMPI_DAVIPLATA_ACTIVATED || 'disabled' }}
      WOMPI_DAVIPLATA_OTP_SEND_URL: ${{ vars.WOMPI_DAVIPLATA_OTP_SEND_URL }}
      WOMPI_DAVIPLATA_OTP_CONFIRM_URL: ${{ vars.WOMPI_DAVIPLATA_OTP_CONFIRM_URL }}
    steps:
      - name: Validate the explicit schema-isolation request
        env:
          INCIDENT_RECOVERY: ${{ inputs.recover_deleted_queue && 'true' || 'false' }}
          SCHEMA_CUTOVER_PENDING: ${{ vars.SCHEMA_CUTOVER_PENDING || 'false' }}
        run: |
          if [[ "$ISOLATE_SCHEMA_CUTOVER" == true ]]; then
            if [[ "$SCHEMA_CUTOVER_PENDING" != true || "$INCIDENT_RECOVERY" == true || -z "$SCHEMA_CUTOVER_PUBLIC_VERSION_ID" || -z "$SCHEMA_CUTOVER_CORE_VERSION_ID" ]]; then
              echo "Schema isolation requires the Production hold, inspected Worker versions, and a separate invocation from incident recovery." >&2
              exit 1
            fi
          elif [[ -n "$SCHEMA_CUTOVER_PUBLIC_VERSION_ID" || -n "$SCHEMA_CUTOVER_CORE_VERSION_ID" ]]; then
            echo "Schema-isolation versions require the explicit maintenance invocation." >&2
            exit 1
          fi

      - name: Check out the exact trunk revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Configure release file paths
        run: |
          echo "RELEASE_SNAPSHOT_FILE=$RUNNER_TEMP/fidy-release.json" >> "$GITHUB_ENV"
          echo "SMOKE_ATTESTATION_FILE=$RUNNER_TEMP/fidy-release-verification.json" >> "$GITHUB_ENV"

      - name: Set up Bun for build tooling
        uses: ./.github/actions/bun-runtime

      - name: Install the locked workspace
        run: bash scripts/install-workspace.sh --ignore-scripts

      - name: Select the server-approved Workers AI model
        run: |
          model=$(bun infra/cloudflare/scripts/print-approved-workers-ai-model.ts)
          echo "HOSTED_AI_MODEL=$model" >> "$GITHUB_ENV"

      - name: Capture the immutable contract digest
        run: echo "CONTRACT_DIGEST=$(bun run --silent --cwd apps/server contracts:digest)" >> "$GITHUB_ENV"

      - name: Configure Alchemy's ephemeral Cloudflare profile
        uses: ./.github/actions/configure-alchemy-cloudflare-profile

      - name: Require all parallel Production preflight gates
        run: bash infra/cloudflare/scripts/production-preflight.sh

      - name: Require the reviewed Cloudflare security policy
        working-directory: infra/cloudflare
        run: bun ./verify-edge-policy.ts

      - name: Plan the complete Cloudflare topology
        working-directory: infra/cloudflare
        env:
          RECOVERY_ISOLATION: ${{ (inputs.recover_deleted_queue || inputs.isolate_schema_cutover) && 'isolated' || '' }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          KAPSO_WEBHOOK_SECRET: ${{ secrets.KAPSO_WEBHOOK_SECRET }}
          WHATSAPP_BUSINESS_PORTFOLIO_ID: ${{ secrets.WHATSAPP_BUSINESS_PORTFOLIO_ID }}
          WHATSAPP_SANDBOX_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_SANDBOX_PHONE_NUMBER_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WOMPI_ENVIRONMENT: ${{ secrets.WOMPI_ENVIRONMENT }}
          WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
          WOMPI_PRIVATE_KEY: ${{ secrets.WOMPI_PRIVATE_KEY }}
          WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
          WOMPI_EVENT_SECRET: ${{ secrets.WOMPI_EVENT_SECRET }}
          CLOUDFLARE_ACCESS_ISSUER: ${{ secrets.CLOUDFLARE_ACCESS_ISSUER }}
        run: |
          bash scripts/check-production-runtime-config.sh
          alchemy() { bun ../../node_modules/alchemy/bin/alchemy.js "$@"; }
          alchemy plan --stage production --no-input

      - name: Recheck trunk immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          CURRENT_TRUNK_SHA=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" \
            --jq .object.sha)
          if [[ "$CURRENT_TRUNK_SHA" != "$RELEASE_GIT_SHA" ]]; then
            echo "Release $RELEASE_GIT_SHA was superseded by $CURRENT_TRUNK_SHA; leaving the prior topology active." >&2
            exit 1
          fi

      - name: Capture stable Worker deployments before candidate upload
        id: capture
        working-directory: infra/cloudflare
        run: |
          umask 077
          bun production-release.ts capture

      - name: Upload zero-traffic Worker candidates with Alchemy
        working-directory: infra/cloudflare
        env:
          RECOVERY_ISOLATION: ${{ (inputs.recover_deleted_queue || inputs.isolate_schema_cutover) && 'isolated' || '' }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          KAPSO_WEBHOOK_SECRET: ${{ secrets.KAPSO_WEBHOOK_SECRET }}
          WHATSAPP_BUSINESS_PORTFOLIO_ID: ${{ secrets.WHATSAPP_BUSINESS_PORTFOLIO_ID }}
          WHATSAPP_SANDBOX_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_SANDBOX_PHONE_NUMBER_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WOMPI_ENVIRONMENT: ${{ secrets.WOMPI_ENVIRONMENT }}
          WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
          WOMPI_PRIVATE_KEY: ${{ secrets.WOMPI_PRIVATE_KEY }}
          WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
          WOMPI_EVENT_SECRET: ${{ secrets.WOMPI_EVENT_SECRET }}
          CLOUDFLARE_ACCESS_ISSUER: ${{ secrets.CLOUDFLARE_ACCESS_ISSUER }}
        run: |
          bash scripts/check-production-runtime-config.sh
          bun production-resources.ts upload

      - name: Isolate public admission before replacing incompatible private Core
        id: isolate
        if: ${{ inputs.recover_deleted_queue || inputs.isolate_schema_cutover }}
        working-directory: infra/cloudflare
        run: |
          if [[ "$ISOLATE_SCHEMA_CUTOVER" == true ]]; then
            bun production-release.ts isolate-schema
          else
            bun production-release.ts isolate
          fi

      - name: Retain the exact schema-maintenance isolation receipt
        if: ${{ inputs.isolate_schema_cutover }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fidy-schema-isolation
          path: ${{ env.RELEASE_SNAPSHOT_FILE }}
          if-no-files-found: error
          retention-days: 7

      - name: Export isolated recovery smoke identities
        if: ${{ inputs.recover_deleted_queue }}
        run: |
          {
            echo "PUBLIC_VERSION_ID=$(jq -r .publicVersionId "$RELEASE_SNAPSHOT_FILE")"
            echo "CORE_VERSION_ID=$(jq -r .coreVersionId "$RELEASE_SNAPSHOT_FILE")"
            echo "PUBLIC_WORKER_NAME=$(jq -r .snapshot.public.name "$RELEASE_SNAPSHOT_FILE")"
            echo "CORE_WORKER_NAME=$(jq -r .snapshot.core.name "$RELEASE_SNAPSHOT_FILE")"
            echo "STABLE_PUBLIC_VERSION_ID=$(jq -r .snapshot.public.stableVersionId "$RELEASE_SNAPSHOT_FILE")"
            echo "STABLE_RELEASE_GIT_SHA=$(jq -r .snapshot.stableRevision "$RELEASE_SNAPSHOT_FILE")"
            echo "STABLE_CONTRACT_DIGEST=$(jq -r .snapshot.stableContractDigest "$RELEASE_SNAPSHOT_FILE")"
          } >> "$GITHUB_ENV"

      - name: Prove isolated recovery through normal Worker routing
        if: ${{ inputs.recover_deleted_queue }}
        working-directory: infra/cloudflare
        run: bun verify-production-smoke.ts promoted

      - name: Capture the proven isolated baseline for ordinary release gates
        id: recovery_capture
        if: ${{ inputs.recover_deleted_queue }}
        working-directory: infra/cloudflare
        run: bun production-release.ts capture

      - name: Upload ordinary candidates after isolated recovery proof
        if: ${{ inputs.recover_deleted_queue }}
        working-directory: infra/cloudflare
        env:
          RECOVERY_ISOLATION: ""
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          KAPSO_WEBHOOK_SECRET: ${{ secrets.KAPSO_WEBHOOK_SECRET }}
          WHATSAPP_BUSINESS_PORTFOLIO_ID: ${{ secrets.WHATSAPP_BUSINESS_PORTFOLIO_ID }}
          WHATSAPP_SANDBOX_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_SANDBOX_PHONE_NUMBER_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WOMPI_ENVIRONMENT: ${{ secrets.WOMPI_ENVIRONMENT }}
          WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
          WOMPI_PRIVATE_KEY: ${{ secrets.WOMPI_PRIVATE_KEY }}
          WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
          WOMPI_EVENT_SECRET: ${{ secrets.WOMPI_EVENT_SECRET }}
          CLOUDFLARE_ACCESS_ISSUER: ${{ secrets.CLOUDFLARE_ACCESS_ISSUER }}
        run: |
          bash scripts/check-production-runtime-config.sh
          bun production-resources.ts upload

      - name: Install zero-traffic candidate routing
        if: ${{ !inputs.isolate_schema_cutover }}
        working-directory: infra/cloudflare
        run: bun production-release.ts stage

      - name: Export captured smoke identities for both gates
        if: ${{ !inputs.isolate_schema_cutover }}
        run: |
          {
            echo "PUBLIC_VERSION_ID=$(jq -r .publicVersionId "$RELEASE_SNAPSHOT_FILE")"
            echo "CORE_VERSION_ID=$(jq -r .coreVersionId "$RELEASE_SNAPSHOT_FILE")"
            echo "PUBLIC_WORKER_NAME=$(jq -r .snapshot.public.name "$RELEASE_SNAPSHOT_FILE")"
            echo "CORE_WORKER_NAME=$(jq -r .snapshot.core.name "$RELEASE_SNAPSHOT_FILE")"
            echo "STABLE_PUBLIC_VERSION_ID=$(jq -r .snapshot.public.stableVersionId "$RELEASE_SNAPSHOT_FILE")"
            echo "STABLE_CORE_VERSION_ID=$(jq -r .snapshot.core.stableVersionId "$RELEASE_SNAPSHOT_FILE")"
            echo "STABLE_RELEASE_GIT_SHA=$(jq -r .snapshot.stableRevision "$RELEASE_SNAPSHOT_FILE")"
            echo "STABLE_CONTRACT_DIGEST=$(jq -r .snapshot.stableContractDigest "$RELEASE_SNAPSHOT_FILE")"
          } >> "$GITHUB_ENV"

      - name: Compare GET and pre-admission POST routing without synthetic work
        if: ${{ !inputs.isolate_schema_cutover }}
        working-directory: infra/cloudflare
        run: bun diagnose-smoke-routing.ts

      - name: Require settled exact-pair routing before synthetic work
        if: ${{ !inputs.isolate_schema_cutover }}
        working-directory: infra/cloudflare
        env:
          SMOKE_ROUTING_WINDOW: settled
        run: bun diagnose-smoke-routing.ts

      - name: Prove both candidate and intermediate Worker pairings
        if: ${{ !inputs.isolate_schema_cutover }}
        id: candidate_smoke
        working-directory: infra/cloudflare
        run: bun verify-production-smoke.ts

      - name: Promote the exact smoke-tested Workers
        if: ${{ !inputs.isolate_schema_cutover }}
        id: promote
        working-directory: infra/cloudflare
        run: bun production-release.ts promote

      - name: Retain guarded recovery receipt for operator fallback
        if: ${{ !inputs.isolate_schema_cutover && (steps.promote.outcome == 'success') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fidy-rollback
          path: ${{ env.RELEASE_SNAPSHOT_FILE }}.promoted
          if-no-files-found: error
          retention-days: 7

      - name: Probe normal Worker traffic after promotion
        id: post_smoke
        if: ${{ !inputs.isolate_schema_cutover && (always() && steps.promote.outcome == 'success') }}
        working-directory: infra/cloudflare
        run: |
          for attempt in {1..3}; do
            if bun verify-production-smoke.ts promoted; then exit 0; fi
            echo "Normal-traffic smoke not confirmed ($attempt/3)."
            sleep 3
          done
          exit 1

      - name: Restore captured Worker code after failed post-promotion probe
        if: ${{ !inputs.isolate_schema_cutover && (failure() && steps.post_smoke.outcome == 'failure' && steps.promote.outcome == 'success') }}
        working-directory: infra/cloudflare
        run: bun production-release.ts rollback

      - name: Remove failed zero-traffic candidates when safe
        if: ${{ !inputs.isolate_schema_cutover && (failure() && steps.capture.outcome == 'success' && steps.promote.outcome != 'success' && (!inputs.recover_deleted_queue || steps.recovery_capture.outcome == 'success')) }}
        working-directory: infra/cloudflare
        run: bun production-release.ts cleanup

      - name: Verify the migrated public topology
        if: ${{ !inputs.isolate_schema_cutover }}
        run: |
          verified=false
          for attempt in {1..20}; do
            site_status=$(curl --silent --show-error --max-time 10 --output /dev/null \
              --dump-header /tmp/fidy-apex-headers --write-out '%{http_code}' \
              'https://fidyapp.com/' || true)
            site_metadata=$(curl --silent --show-error --max-time 10 \
              'https://fidyapp.com/deployment-metadata.json' || true)
            metadata=$(curl --silent --show-error --max-time 10 \
              --dump-header /tmp/fidy-web-headers 'https://app.fidyapp.com/deployment-metadata.json' || true)
            health=$(curl --silent --show-error --max-time 10 \
              --dump-header /tmp/fidy-api-headers 'https://api.fidyapp.com/health' || true)

            hsts=true
            for headers in /tmp/fidy-apex-headers /tmp/fidy-web-headers /tmp/fidy-api-headers; do
              if ! grep -Eiq '^strict-transport-security: max-age=31536000(;|[[:space:]]|$)' "$headers"; then
                hsts=false
              fi
            done
            if [[ "$hsts" == true ]] && [[ "$site_status" == "200" ]] && \
              jq --exit-status --arg revision "$RELEASE_GIT_SHA" \
                '. == {gitRevision: $revision}' <<<"$site_metadata" >/dev/null && \
              jq --exit-status --arg revision "$RELEASE_GIT_SHA" --arg digest "$CONTRACT_DIGEST" \
                '. == {contractDigest: $digest, gitRevision: $revision}' <<<"$metadata" >/dev/null && \
              jq --exit-status --arg revision "$RELEASE_GIT_SHA" --arg digest "$CONTRACT_DIGEST" \
                '. == {contractDigest: $digest, gitRevision: $revision, status: "available"}' \
                <<<"$health" >/dev/null; then
              verified=true
              break
            fi

            echo "Public topology has not converged yet (attempt $attempt/20)."
            sleep 3
          done

          if [[ "$verified" != true ]]; then
            echo "The migrated public topology did not expose the exact deployed release." >&2
            exit 1
          fi

      - name: Probe production edge without valid User or provider authority
        if: ${{ !inputs.isolate_schema_cutover }}
        working-directory: infra/cloudflare
        run: bun verify-production-smoke.ts promoted

      - name: Retire obsolete resources after verified promotion
        if: ${{ !inputs.isolate_schema_cutover && (success() && steps.post_smoke.outcome == 'success') }}
        working-directory: infra/cloudflare
        env:
          RECOVERY_ISOLATION: ""
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          KAPSO_WEBHOOK_SECRET: ${{ secrets.KAPSO_WEBHOOK_SECRET }}
          WHATSAPP_BUSINESS_PORTFOLIO_ID: ${{ secrets.WHATSAPP_BUSINESS_PORTFOLIO_ID }}
          WHATSAPP_SANDBOX_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_SANDBOX_PHONE_NUMBER_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WOMPI_ENVIRONMENT: ${{ secrets.WOMPI_ENVIRONMENT }}
          WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
          WOMPI_PRIVATE_KEY: ${{ secrets.WOMPI_PRIVATE_KEY }}
          WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
          WOMPI_EVENT_SECRET: ${{ secrets.WOMPI_EVENT_SECRET }}
          CLOUDFLARE_ACCESS_ISSUER: ${{ secrets.CLOUDFLARE_ACCESS_ISSUER }}
        run: bun production-resources.ts retire

      - name: Reject post-deployment Cloudflare drift
        if: ${{ !inputs.isolate_schema_cutover }}
        working-directory: infra/cloudflare
        run: bash scripts/check-topology-drift.sh

      - name: Email operator if deployment failed
        if: ${{ failure() }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          # Only validated deployment IDs, version IDs and traffic percentages enter this alert.
          traffic=$(bun infra/cloudflare/production-release.ts report 2>/dev/null || \
            printf 'Worker traffic unavailable; inspect Cloudflare directly')
          jq -n --arg to "$OPERATOR_ALERT_EMAIL" --arg release "$RELEASE_GIT_SHA" \
            --arg traffic "$traffic" \
            '{from:"Fidy <obarboza@fidyapp.com>",to:[$to],subject:"Fidy: critical deployment failure",text:("Production release " + $release + " failed. Observed Worker traffic: " + $traffic + ". Inspect the private GitHub Actions run.")}' \
            > "$RUNNER_TEMP/operator-alert.json"
          curl --fail --silent --show-error --max-time 10 \
            --request POST 'https://api.resend.com/emails' \
            --header "Authorization: Bearer $RESEND_API_KEY" \
            --header 'Content-Type: application/json' \
            --header "Idempotency-Key: fidy-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --data-binary "@$RUNNER_TEMP/operator-alert.json" >/dev/null

      - name: Record the release
        if: ${{ always() }}
        env:
          ISOLATION_OUTCOME: ${{ steps.isolate.outcome }}
        run: |
          {
            if [[ "$ISOLATE_SCHEMA_CUTOVER" == true ]]; then
              echo "### Schema maintenance invocation"
              echo "- Isolation outcome: $ISOLATION_OUTCOME. Only a successful isolation receipt confirms the closed serving pair."
              echo "- Database transition and ordinary release verification are still required."
            else
              echo "### Production release"
            fi
            echo "- Git revision: \`$RELEASE_GIT_SHA\`"
            echo "- Contract digest: \`${CONTRACT_DIGEST:-not-planned}\`"
            echo "- Alchemy stack: \`FidyCloudflare/production\`"
          } >> "$GITHUB_STEP_SUMMARY"

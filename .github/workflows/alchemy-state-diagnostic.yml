name: Restore uninstrumented Alchemy state-store Worker

on:
  pull_request:
    branches: [trunk]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: alchemy-cloudflare-state-bootstrap
  cancel-in-progress: false

jobs:
  recover:
    name: Rebuild the existing state-store Worker
    if: ${{ github.event.pull_request.number == 2488 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/1809-recurring-transaction-details' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ALCHEMY_PROFILE: ci
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/bun-runtime
      - run: bash scripts/install-workspace.sh --ignore-scripts
      - uses: ./.github/actions/configure-alchemy-cloudflare-profile
      - name: Require existing Worker, secrets, and namespace
        shell: bash
        run: |
          bun - <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync, writeFileSync } from "node:fs";
          const source = new URL("../", import.meta.resolve("@alchemy.run/cloudflare/Alchemist"));
          assert.ok(decodeURIComponent(source.pathname).endsWith("/@alchemy.run/cloudflare/src/"));
          const edit = (relativePath, transform) => {
            const path = new URL(relativePath, source);
            writeFileSync(path, transform(readFileSync(path, "utf8")));
          };
          const exact = (text, before, after, count = 1) => {
            assert.equal(text.split(before).length - 1, count);
            return text.replaceAll(before, () => after);
          };
          edit("Alchemist/StateStore.ts", (text) => exact(text,
            "const store = yield* bootstrapStateStore({",
            'if (!existed) return yield* Effect.die(new Error("Existing state-store Worker required"));\n        const store = yield* bootstrapStateStore({',
          ));
          edit("StateStore/State.ts", (text) => {
            const guarded = exact(text, "!(force || (yield* confirmNewEncryptionKey(scriptName, isCI)))", "true");
            return exact(guarded, "yield* forgetLegacyBootstrapStack(credentials, scriptName);", "void 0;", 2);
          });
          edit("StateStore/Deploy.ts", (text) => {
            const store = exact(text,
              "if (existing) return existing.id;",
              'if (existing) return existing.id;\n  return yield* Effect.die(new Error("Existing Secrets Store required"));',
            );
            const secrets = exact(store,
              "Stream.filter((secret) => secret.name === name),\n    Stream.runHead,",
              'Stream.filter((secret) => secret.name === name && secret.status === "active" && (secret.scopes == null || secret.scopes.includes("workers"))),\n    Stream.runHead,',
            );
            const noCreation = exact(secrets,
              "if (exists) return undefined;",
              'if (exists) return undefined;\n  return yield* Effect.die(new Error("Existing active state-store secret required"));',
            );
            return exact(noCreation,
              'Effect.map((ns) =>\n      Option.isSome(ns) && ns.value.useSqlite === false\n        ? ("legacy-kv" as const)\n        : ("sqlite" as const),\n    ),',
              'Effect.flatMap((ns) => Option.isNone(ns) ? Effect.die(new Error("Existing state-store Durable Object namespace required")) : Effect.succeed(ns.value.useSqlite === false ? "legacy-kv" as const : "sqlite" as const)),',
            );
          });
          JS
      - name: Rebuild the Worker and read its stack index
        working-directory: infra/cloudflare
        shell: bash
        run: |
          umask 077
          state_index="$(mktemp)"
          trap 'rm -f "$state_index"' EXIT
          bun ../../node_modules/alchemy/bin/alchemy.js state bootstrap --backend cloudflare --profile ci --force --no-input
          if bun ../../node_modules/alchemy/bin/alchemy.js state list --backend cloudflare --profile ci --no-input > "$state_index" 2>&1; then
            echo "The restored Worker can read the stack index."
          else
            grep -oE "State store failed to listStacks \([A-Za-z0-9_]+\)" "$state_index"
          fi
      - name: Report daily row-read totals by Durable Object namespace
        shell: bash
        run: |
          bun - <<'JS'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` };
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}`;
          const now = Date.now();
          const date = (ago) => new Date(now - ago * 86400000).toISOString().slice(0, 10);
          const query = `{viewer{accounts(filter:{accountTag:"${account}"}){rows:durableObjectsPeriodicGroups(filter:{date_geq:"${date(2)}", date_leq:"${date(0)}"},limit:200,orderBy:[sum_rowsRead_DESC]){dimensions{date namespaceId}sum{rowsRead rowsWritten}}}}}`;
          const [stats, namespaces] = await Promise.all([
            fetch("https://api.cloudflare.com/client/v4/graphql", {
              method: "POST",
              headers: { ...headers, "content-type": "application/json" },
              body: JSON.stringify({ query }),
            }),
            fetch(base + "/workers/durable_objects/namespaces?per_page=100", { headers }),
          ]);
          const result = await stats.json();
          const message = result.errors?.[0]?.message;
          if (message) console.log("Analytics:", String(message).replace(/[a-f0-9]{24,}/gi, "[id]").slice(0, 240));
          const rows = result.data?.viewer?.accounts?.[0]?.rows ?? [];
          const registry = (await namespaces.json()).result;
          const names = new Map((Array.isArray(registry) ? registry : []).map(entry => [
            entry.id, entry.script + "/" + entry.class,
          ]));
          console.log("Analytics HTTP", stats.status, "rows", rows.length, "namespaces HTTP", namespaces.status);
          for (const day of [date(0), date(1), date(2)]) {
            const daily = rows.filter(entry => entry.dimensions.date === day);
            const total = daily.reduce((sum, entry) => sum + Number(entry.sum.rowsRead), 0);
            console.log(day, "reported reads", total);
            for (const { dimensions, sum } of daily.slice(0, 8)) {
              console.log(names.get(dimensions.namespaceId) ?? "Unknown namespace", sum.rowsRead, "reads", sum.rowsWritten, "writes");
            }
          }
          JS

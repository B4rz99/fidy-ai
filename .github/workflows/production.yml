name: Deploy Production

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read

# Releases are serialized without cancelling an active deployment. A newer
# trunk revision waits for the current candidate to finish.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Alchemy Cloudflare topology
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      RELEASE_GIT_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
      ALCHEMY_PROFILE: ci
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAT_ADMISSION_KEY: ${{ secrets.PAT_ADMISSION_KEY }}
      OPERATOR_ALERT_EMAIL: ${{ vars.OPERATOR_ALERT_EMAIL }}
      SMOKE_PROOF: ${{ secrets.SMOKE_PROOF }}
    steps:
      - name: Check out the exact trunk revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Configure release file paths
        run: |
          echo "RELEASE_SNAPSHOT_FILE=$RUNNER_TEMP/fidy-release.json" >> "$GITHUB_ENV"
          echo "SMOKE_ATTESTATION_FILE=$RUNNER_TEMP/fidy-smoke-passed.json" >> "$GITHUB_ENV"

      - name: Set up Bun for build tooling
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"

      - name: Install the locked workspace
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Select the server-approved Workers AI model
        run: |
          model=$(bun infra/cloudflare/scripts/print-approved-workers-ai-model.ts)
          echo "HOSTED_AI_MODEL=$model" >> "$GITHUB_ENV"

      - name: Capture the immutable contract digest
        run: echo "CONTRACT_DIGEST=$(bun run --silent --cwd apps/server contracts:digest)" >> "$GITHUB_ENV"

      - name: Configure Alchemy's ephemeral Cloudflare profile
        uses: ./.github/actions/configure-alchemy-cloudflare-profile

      - name: Require all parallel Production preflight gates
        run: bash infra/cloudflare/scripts/production-preflight.sh

      - name: Require the reviewed Cloudflare security policy
        working-directory: infra/cloudflare
        run: bun ./verify-edge-policy.ts

      - name: Plan the complete Cloudflare topology
        working-directory: infra/cloudflare
        env:
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          KAPSO_WEBHOOK_SECRET: ${{ secrets.KAPSO_WEBHOOK_SECRET }}
          WHATSAPP_BUSINESS_PORTFOLIO_ID: ${{ secrets.WHATSAPP_BUSINESS_PORTFOLIO_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WOMPI_ENVIRONMENT: ${{ secrets.WOMPI_ENVIRONMENT }}
          WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
          WOMPI_PRIVATE_KEY: ${{ secrets.WOMPI_PRIVATE_KEY }}
          WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
          WOMPI_EVENT_SECRET: ${{ secrets.WOMPI_EVENT_SECRET }}
          CLOUDFLARE_ACCESS_ISSUER: ${{ secrets.CLOUDFLARE_ACCESS_ISSUER }}
          CLOUDFLARE_ACCESS_AUDIENCE: ${{ secrets.CLOUDFLARE_ACCESS_AUDIENCE }}
        run: |
          bash scripts/check-production-runtime-config.sh
          alchemy() { bun ../../node_modules/alchemy/bin/alchemy.js "$@"; }
          alchemy plan --stage production --no-input

      - name: Recheck trunk immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_TRUNK_SHA=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/${{ github.event.repository.default_branch }}" \
            --jq .object.sha)
          if [[ "$CURRENT_TRUNK_SHA" != "$RELEASE_GIT_SHA" ]]; then
            echo "Release $RELEASE_GIT_SHA was superseded by $CURRENT_TRUNK_SHA; leaving the prior topology active." >&2
            exit 1
          fi

      - name: Capture stable Worker deployments before candidate upload
        id: capture
        working-directory: infra/cloudflare
        run: |
          umask 077
          bun production-release.ts capture

      - name: Upload zero-traffic Worker candidates with Alchemy
        working-directory: infra/cloudflare
        env:
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          KAPSO_WEBHOOK_SECRET: ${{ secrets.KAPSO_WEBHOOK_SECRET }}
          WHATSAPP_BUSINESS_PORTFOLIO_ID: ${{ secrets.WHATSAPP_BUSINESS_PORTFOLIO_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WOMPI_ENVIRONMENT: ${{ secrets.WOMPI_ENVIRONMENT }}
          WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
          WOMPI_PRIVATE_KEY: ${{ secrets.WOMPI_PRIVATE_KEY }}
          WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
          WOMPI_EVENT_SECRET: ${{ secrets.WOMPI_EVENT_SECRET }}
          CLOUDFLARE_ACCESS_ISSUER: ${{ secrets.CLOUDFLARE_ACCESS_ISSUER }}
          CLOUDFLARE_ACCESS_AUDIENCE: ${{ secrets.CLOUDFLARE_ACCESS_AUDIENCE }}
        run: |
          bash scripts/check-production-runtime-config.sh
          alchemy() { bun ../../node_modules/alchemy/bin/alchemy.js "$@"; }
          alchemy deploy --stage production --yes --no-input

      - name: Install zero-traffic candidate routing
        working-directory: infra/cloudflare
        run: bun production-release.ts stage

      - name: Export captured smoke identities for both gates
        run: |
          {
            echo "PUBLIC_VERSION_ID=$(jq -r .publicVersionId "$RELEASE_SNAPSHOT_FILE")"
            echo "CORE_VERSION_ID=$(jq -r .coreVersionId "$RELEASE_SNAPSHOT_FILE")"
            echo "PUBLIC_WORKER_NAME=$(jq -r .snapshot.public.name "$RELEASE_SNAPSHOT_FILE")"
            echo "CORE_WORKER_NAME=$(jq -r .snapshot.core.name "$RELEASE_SNAPSHOT_FILE")"
            echo "STABLE_PUBLIC_VERSION_ID=$(jq -r .snapshot.public.stableVersionId "$RELEASE_SNAPSHOT_FILE")"
            echo "STABLE_CORE_VERSION_ID=$(jq -r .snapshot.core.stableVersionId "$RELEASE_SNAPSHOT_FILE")"
            echo "STABLE_RELEASE_GIT_SHA=$(jq -r .snapshot.stableRevision "$RELEASE_SNAPSHOT_FILE")"
            echo "STABLE_CONTRACT_DIGEST=$(jq -r .snapshot.stableContractDigest "$RELEASE_SNAPSHOT_FILE")"
          } >> "$GITHUB_ENV"

      - name: Compare GET and pre-admission POST routing without synthetic work
        working-directory: infra/cloudflare
        run: bun diagnose-smoke-routing.ts

      - name: Require settled exact-pair routing before synthetic work
        working-directory: infra/cloudflare
        env:
          SMOKE_ROUTING_WINDOW: settled
        run: bun diagnose-smoke-routing.ts

      - name: Prove both candidate and intermediate Worker pairings
        id: candidate_smoke
        working-directory: infra/cloudflare
        run: bun verify-production-smoke.ts

      - name: Promote the exact smoke-tested Workers
        id: promote
        working-directory: infra/cloudflare
        run: bun production-release.ts promote

      - name: Retain guarded recovery receipt for operator fallback
        if: ${{ steps.promote.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fidy-rollback
          path: ${{ env.RELEASE_SNAPSHOT_FILE }}.promoted
          if-no-files-found: error
          retention-days: 7

      - name: Probe normal Worker traffic after promotion
        id: post_smoke
        if: ${{ always() && steps.promote.outcome == 'success' }}
        working-directory: infra/cloudflare
        run: |
          for attempt in {1..3}; do
            if bun verify-production-smoke.ts promoted; then exit 0; fi
            echo "Normal-traffic smoke not confirmed ($attempt/3)."
            sleep 3
          done
          exit 1

      - name: Restore captured Worker code after failed post-promotion probe
        if: ${{ failure() && steps.post_smoke.outcome == 'failure' && steps.promote.outcome == 'success' }}
        working-directory: infra/cloudflare
        run: bun production-release.ts rollback

      - name: Remove failed zero-traffic candidates when safe
        if: ${{ failure() && steps.capture.outcome == 'success' && steps.promote.outcome != 'success' }}
        working-directory: infra/cloudflare
        run: bun production-release.ts cleanup

      - name: Verify the migrated public topology
        run: |
          verified=false
          for attempt in {1..20}; do
            redirect=$(curl --silent --show-error --max-time 10 --output /dev/null \
              --write-out '%{http_code} %{redirect_url}' \
              'https://fidyapp.com/health-check?probe=1' || true)
            metadata=$(curl --silent --show-error --max-time 10 \
              'https://app.fidyapp.com/deployment-metadata.json' || true)
            health=$(curl --silent --show-error --max-time 10 \
              'https://api.fidyapp.com/health' || true)

            if [[ "$redirect" == "301 https://app.fidyapp.com/health-check?probe=1" ]] && \
              jq --exit-status --arg revision "$RELEASE_GIT_SHA" --arg digest "$CONTRACT_DIGEST" \
                '. == {contractDigest: $digest, gitRevision: $revision}' <<<"$metadata" >/dev/null && \
              jq --exit-status --arg revision "$RELEASE_GIT_SHA" --arg digest "$CONTRACT_DIGEST" \
                '. == {contractDigest: $digest, gitRevision: $revision, status: "available"}' \
                <<<"$health" >/dev/null; then
              verified=true
              break
            fi

            echo "Public topology has not converged yet (attempt $attempt/20)."
            sleep 3
          done

          if [[ "$verified" != true ]]; then
            echo "The migrated public topology did not expose the exact deployed release." >&2
            exit 1
          fi

      - name: Probe production edge without valid User or provider authority
        working-directory: infra/cloudflare
        run: bun ./verify-edge-smoke.ts

      - name: Reject post-deployment Cloudflare drift
        working-directory: infra/cloudflare
        run: bash scripts/check-topology-drift.sh

      - name: Email operator if deployment failed
        if: ${{ failure() }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          # Only validated deployment IDs, version IDs and traffic percentages enter this alert.
          traffic=$(bun infra/cloudflare/production-release.ts report 2>/dev/null || \
            printf 'Worker traffic unavailable; inspect Cloudflare directly')
          jq -n --arg to "$OPERATOR_ALERT_EMAIL" --arg release "$RELEASE_GIT_SHA" \
            --arg traffic "$traffic" \
            '{from:"Fidy <obarboza@fidyapp.com>",to:[$to],subject:"Fidy: critical deployment failure",text:("Production release " + $release + " failed. Observed Worker traffic: " + $traffic + ". Inspect the private GitHub Actions run.")}' \
            > "$RUNNER_TEMP/operator-alert.json"
          curl --fail --silent --show-error --max-time 10 \
            --request POST 'https://api.resend.com/emails' \
            --header "Authorization: Bearer $RESEND_API_KEY" \
            --header 'Content-Type: application/json' \
            --header "Idempotency-Key: fidy-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --data-binary "@$RUNNER_TEMP/operator-alert.json" >/dev/null

      - name: Record the release
        if: ${{ always() }}
        run: |
          {
            echo "### Production release"
            echo "- Git revision: \`$RELEASE_GIT_SHA\`"
            echo "- Contract digest: \`${CONTRACT_DIGEST:-not-planned}\`"
            echo "- Alchemy stack: \`FidyCloudflare/production\`"
          } >> "$GITHUB_STEP_SUMMARY"

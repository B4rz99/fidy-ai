name: Trace computed style reads during refresh

on:
  push:
    branches: [test/2260-compare-toast-work]

permissions:
  contents: read

concurrency:
  group: browser-pilot-${{ github.ref }}-${{ inputs.dataset || 'production' }}-${{ inputs.network || 'normal' }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATASET: ${{ inputs.dataset || 'production' }}
      NETWORK: ${{ inputs.network || 'normal' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fb53d9e755c14393048dc945fc0b7f117730d872
          path: baseline-d1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 972ecaa22bb58ab472de2e9458c76290c72aa09d
          path: baseline-fixtures
          persist-credentials: false
          sparse-checkout: apps/server/cloudflare
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 289a268f8077aacca47bba9c2c3f46d3d5c9331a
          path: native-before
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9710178bf6506dffcc61de7abec977952c181fe9
          path: native-after
          persist-credentials: false
      - uses: ./.github/actions/bun-runtime
      - name: Prepare both frozen checkouts and the common browser
        run: |
          export GIT_ALTERNATE_OBJECT_DIRECTORIES="$GITHUB_WORKSPACE/baseline-fixtures/.git/objects"
          echo "GIT_ALTERNATE_OBJECT_DIRECTORIES=$GIT_ALTERNATE_OBJECT_DIRECTORIES" >> "$GITHUB_ENV"
          git -C baseline-d1 restore --source=972ecaa22bb58ab472de2e9458c76290c72aa09d --worktree -- \
            apps/server/cloudflare/browser-assessment.test-fixture.ts \
            apps/server/cloudflare/browser-acceptance-preview.ts \
            apps/server/cloudflare/browser-acceptance-seed.ts
          bash scripts/install-workspace.sh --ignore-scripts
          (cd baseline-d1 && bash scripts/install-workspace.sh --ignore-scripts)
          echo "ASSESSMENT_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
      - name: Prepare unmodified native products
        run: |
          (cd native-before && bash scripts/install-workspace.sh --ignore-scripts)
          (cd native-after && bash scripts/install-workspace.sh --ignore-scripts)
      - name: Observe browser work on one runner in balanced order
        run: |
          failed=0
          for product in native-before native-after native-after native-before; do
            python3 scripts/infra-performance/reference/run.py --d1 baseline-d1 --do "$product" \
              --dataset small --network normal --pairs 4 --origin "GitHub-hosted Ubuntu loopback" || failed=1
          done
          exit "$failed"
      - name: Preserve reference evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: same-runner-root-style-${{ github.run_id }}
          path: |
            apps/web/test-results/reference/*/plan.json
            apps/web/test-results/reference/*/attempts.jsonl
            apps/web/test-results/reference/*/*/workspace-events.jsonl
            apps/web/test-results/reference/*/*/network-events.jsonl
            apps/web/test-results/reference/*/report.json
          if-no-files-found: warn

version: "2"

pre-commit:
  commands:
    oxlint:
      glob: "*.{js,jsx,ts,tsx}"
      exclude:
        - ".repos/**"
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
      skip_output: errors
    format:
      glob: "*.{js,jsx,ts,tsx,json}"
      exclude:
        - ".repos/**"
        - "apps/server/contracts/**"
      run: bunx oxfmt --write {staged_files}
      stage_fixed: true
      skip_output: errors

commit-msg:
  commands:
    commit-message-convention:
      run: bun scripts/check-commit-message.ts {1}
      fail_text: "Commit titles must put the issue reference after the colon, for example: type(scope): #123 summary."

pre-push:
  commands:
    pushed-commit-messages:
      files: git ls-files
      run: bun scripts/check-pushed-commit-messages.ts
      skip_output: false
    pushed-secrets:
      run: bun scripts/check-pushed-secrets.ts
      skip_output: false

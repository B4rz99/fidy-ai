name: Inspect the interrupted smoke Workflow state

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/trunk' && github.ref_protected && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      NATIVE_STORAGE_ADMISSION: ${{ vars.NATIVE_STORAGE_ADMISSION }}
      NATIVE_STORAGE_HOSTS: ${{ vars.NATIVE_STORAGE_HOSTS || 'acceptance' }}
      FIXTURE_RELEASE_OPERATION: stage-fixture-successor
      RELEASE_GIT_SHA: de04a192c3836be0efb488b170a7b93b9f98f28f
      RELEASE_ATTEMPT_ID: 44806738835-1
      RELEASE_RUN_URL: https://github.com/B4rz99/fidy-ai/actions/runs/44806738835/attempts/1
      ALCHEMY_PROFILE: ci
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FIDY_NATIVE_FIXTURE_PUBLIC_KEY: ${{ vars.FIDY_NATIVE_FIXTURE_PUBLIC_KEY }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      NATIVE_FIXTURE_SIGNER_SHA256: ${{ vars.NATIVE_FIXTURE_SIGNER_SHA256 }}
      SMOKE_PROOF: ${{ secrets.NATIVE_STORAGE_SMOKE_PROOF }}
      CLOUDFLARE_ACCESS_ISSUER: ${{ secrets.CLOUDFLARE_ACCESS_ISSUER }}
      RECOVERY_OPERATOR_EMAIL: ${{ vars.RECOVERY_OPERATOR_EMAIL }}
      BETA_PRO_OPERATOR_EMAIL: ${{ vars.BETA_PRO_OPERATOR_EMAIL }}
      SAMPLE_REVIEWER_EMAIL: ${{ vars.SAMPLE_REVIEWER_EMAIL }}
      BILLING_SUPPORT_AUDIENCE: ${{ vars.BILLING_SUPPORT_AUDIENCE }}
      PRICING_PUBLISH_AUDIENCE: ${{ vars.PRICING_PUBLISH_AUDIENCE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require closed admission and a protected verifier
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_PROTECTED" == true && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$NATIVE_STORAGE_ADMISSION" == closed && "$NATIVE_STORAGE_HOSTS" == acceptance ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" && "$GITHUB_SHA" != "$RELEASE_GIT_SHA" ]]
          git merge-base --is-ancestor "$RELEASE_GIT_SHA" "$GITHUB_SHA"
      - uses: ./.github/actions/bun-runtime
      - run: bash scripts/install-workspace.sh --ignore-scripts
      - name: Check the reviewed edge policy
        run: bun infra/cloudflare/verify-edge-policy.ts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: de04a192c3836be0efb488b170a7b93b9f98f28f
          path: interrupted
          persist-credentials: false
      - name: Match verifier and original provider dependencies
        run: |
          cmp bun.lock interrupted/bun.lock
          git diff --quiet "$RELEASE_GIT_SHA" "$GITHUB_SHA" -- patches
      - run: bash scripts/install-workspace.sh --ignore-scripts
        working-directory: interrupted
      - uses: ./.github/actions/configure-alchemy-cloudflare-profile
      - name: Rebuild the original plan environment
        working-directory: interrupted
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_GIT_SHA" ]]
          echo "HOSTED_AI_MODEL=$(bun infra/cloudflare/scripts/print-approved-openai-model.ts)" >> "$GITHUB_ENV"
          echo "CONTRACT_DIGEST=$(bun run --silent --cwd apps/server contracts:digest)" >> "$GITHUB_ENV"
          echo "FIDY_NATIVE_FIXTURE_PROVIDER_REVISION=$(jq -er .revision infra/cloudflare/native-retained-provider.json)" >> "$GITHUB_ENV"
      - name: Recheck the exact failed upload and live partial state
        run: |
          umask 077
          python3 scripts/infra-performance/canonical-fixture/successor_partial.py > "$RUNNER_TEMP/native-fixture-successor-partial.json"
      - name: Inspect the existing stack without applying its plan
        working-directory: interrupted/infra/cloudflare
        env:
          NATIVE_FIXTURE_SIGNING_KEY: ${{ secrets.NATIVE_FIXTURE_SIGNING_KEY }}
        run: bun "$GITHUB_WORKSPACE/infra/cloudflare/native-workflow-recovery-plan.ts"
      - name: Retain the read-only Workflow plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-workflow-recovery-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/native-workflow-recovery-plan.json
          if-no-files-found: error

name: Rehearse closed Transaction fixture provenance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun-runtime
      - run: bash scripts/install-workspace.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8dd3b0d47d655868c1ab4f16b6145a06d99bd721
          path: closed-baseline
          persist-credentials: false
      - run: bash scripts/install-workspace.sh --ignore-scripts
        working-directory: closed-baseline
      - name: Reopen the original two mounted Sessions after the release
        if: always()
        run: python3 scripts/infra-performance/canonical-fixture/rehearse_release_controls.py --out apps/server/test-results/closed-release-controls
      - name: Verify closed release signer inventories on the real plan
        working-directory: infra/cloudflare
        run: bun run test native-application-plan.test.ts native-deployed-graph.test.ts native-fixture-plan.test.ts native-fallback-recovery.test.ts
      - name: Require genuine signed capture and own-fixture proof
        if: always()
        run: |
          python3 -m unittest discover -s scripts/infra-performance/canonical-fixture
          python3 scripts/infra-performance/canonical-fixture/direct_bridge_check.py
          python3 scripts/infra-performance/canonical-fixture/hosted.py rehearse --out apps/server/test-results/closed-native-fixture
          python3 scripts/infra-performance/canonical-fixture/hosted.py rehearse --second-member --out apps/server/test-results/closed-native-fixture-second-member
      - name: Check comparator inventory completeness and scoped recovery
        if: always()
        run: python3 -m unittest discover -s scripts/infra-performance/cells
      - name: Check receipt policy code
        if: always()
        run: |
          bun infra/cloudflare/verify-edge-policy.ts
          bun x oxlint --deny-warnings --config .oxlintrc.json --type-aware --threads=1 apps/server/cloudflare/release-isolation/{internal/performance-receipt,operations}.ts apps/server/cloudflare/transactions/{internal/performance-receipt,operations}.ts apps/server/cloudflare/{core-http/runtime,user-store/runtime,public-worker,user-store.test-fixture}.ts scripts/infra-performance/canonical-fixture/{bridge,closed-runtime.test-fixture,cohort-bridge,cohort-runtime.test-fixture}.ts infra/cloudflare/{native-fixture-signer,native-application,native-graph,native-deployed-graph,native-storage-release,native-storage-resources,storage-installation}.ts
      - name: Check owned modules and application types
        if: always()
        run: |
          bun install --cwd tools/mcp-inspector --frozen-lockfile
          bun install --cwd tools/astro --frozen-lockfile
          bun install --cwd tools/mutation --frozen-lockfile
          bun install --cwd tools/depcruise --frozen-lockfile
          bun x tsc --build
          bun run --cwd apps/server typecheck
          bun run --cwd apps/server lint:deps
      - name: Reopen native custody and prove physical disposal on fresh workerd
        if: always()
        run: |
          python3 scripts/infra-performance/canonical-fixture/rehearse_cohort.py --out apps/server/test-results/closed-native-cohort
          python3 scripts/infra-performance/canonical-fixture/rehearse_cohort.py --second-member --out apps/server/test-results/closed-native-cohort-second-member
      - name: Keep only aggregate result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: closed-native-fixture-${{ github.run_id }}
          path: |
            apps/server/test-results/closed-release-controls/summary.json
            apps/server/test-results/closed-native-fixture/summary.json
            apps/server/test-results/closed-native-cohort/summary.json
            apps/server/test-results/closed-native-fixture-second-member/summary.json
            apps/server/test-results/closed-native-cohort-second-member/summary.json

  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/bun-install
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fb53d9e755c14393048dc945fc0b7f117730d872
          path: baseline-d1
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 15cfe773cd263b6a3d4e1b6e1b958f233cdde84f
          path: baseline-calibration
          sparse-checkout: apps/server
          persist-credentials: false
      - name: Rehearse the mounted ordinary Transactions profile
        run: |
          set -eu
          (cd baseline-d1 && bash scripts/install-workspace.sh --ignore-scripts)
          export NATIVE_WEB_ASSETS="$RUNNER_TEMP/native-web" D1_WEB_ASSETS="$RUNNER_TEMP/d1-web"
          (cd apps/web && VITE_API_ORIGIN=installed bun ../../node_modules/vite/bin/vite.js build --mode production --outDir "$NATIVE_WEB_ASSETS")
          (cd baseline-d1/apps/web && VITE_API_ORIGIN=https://api.fidyapp.com bun ../../node_modules/vite/bin/vite.js build --mode production --outDir "$D1_WEB_ASSETS")
      - name: Rehearse both protected browser owners and physical disposal
        run: |
          source scripts/infra-performance/hosted-browser/tls.sh
          export ASSESSMENT_CHROMIUM="$(command -v google-chrome)"
          export NATIVE_WEB_ASSETS="$RUNNER_TEMP/native-web" D1_WEB_ASSETS="$RUNNER_TEMP/d1-web"
          python3 scripts/infra-performance/canonical-fixture/rehearse_cohort.py --out "$RUNNER_TEMP/full" \
            --d1 baseline-d1 --calibration baseline-calibration
      - name: Retain the verified workload and D1 cost
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: closed-browser-calibration-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/full/package/snapshot-proof.json
            ${{ runner.temp }}/full/package/probe.json
            ${{ runner.temp }}/full/paired/ordinary-*.json
            ${{ runner.temp }}/full/paired.json
            ${{ runner.temp }}/full/summary.json
            ${{ runner.temp }}/full/native-window-audit.json
            ${{ runner.temp }}/full/paired/comparison.json

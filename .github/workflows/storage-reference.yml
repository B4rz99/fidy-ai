name: Verify the direct Recurring SQLite candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: b8352dee780f9c685b77773e5a62decda8678f9d
          persist-credentials: false
      - uses: ./.github/actions/bun-install
      - name: Check touched TypeScript and native SQLite behavior
        run: |
          bun x oxlint --deny-warnings --config .oxlintrc.json --type-aware --threads=1 apps/server/cloudflare/recurring-plans/internal/store.ts apps/server/cloudflare/recurring-plans/user-store.test.ts apps/web/src/features/needs-review
          bun run --cwd apps/web test -- src/features/needs-review/read-selection.test.ts
          bun run --cwd apps/server test:core -- --coverage.enabled=false src/core/recurring-plans/contract.test.ts src/core/_shared/time.test.ts
          bun run --cwd apps/server test:cloudflare -- cloudflare/recurring-plans/user-store.test.ts
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: integrated
            revision: 733759e87aed22c24f3f1ce8c81684e2f20b3d2a
          - variant: direct
            revision: b8352dee780f9c685b77773e5a62decda8678f9d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: ./.github/actions/bun-install
      - name: Profile authenticated full Recurring HTTP outside acceptance
        env:
          FIDY_WORKERD_CPU: "1"
        run: |
          mkdir -p apps/server/test-results/recurring-cpu
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/infra-performance/load/measure.test-fixture.mjs')
          code = path.read_text()
          code = code.replace('const nativeOnly = profile === "native-original";', 'const nativeOnly = ["native-original", "cpu"].includes(profile);')
          start = code.index('    await profileHistory(')
          end = code.index('    return;', start)
          code = code[:start] + '''    const subject = subjectAt(variants.do, 0);
              const recurring = "/recurring-plans?month=2026-10";
              const response = await execute({ runtime: native, subject }, recurring);
              assert.equal(response.status, success);
              const body = new Uint8Array(await response.arrayBuffer());
              const { data: { document } } = JSON.parse(new TextDecoder().decode(body));
              assert.equal(document.plans.length, 100);
              assert.ok(document.plans.every((plan) => plan.revisions.length === 100));
              const digest = hash(body);
              await write("recurring-body", { digest, bytes: body.length });
              await profileHistory(native, async () => {
                const observation = await execute({ runtime: native, subject }, recurring);
                assert.equal(observation.status, success);
                assert.equal(hash(new Uint8Array(await observation.arrayBuffer())), digest);
              }, write);
          ''' + code[end:]
          path.with_name('profile-recurring.test-fixture.mjs').write_text(code)
          PY
          bun scripts/infra-performance/load/profile-recurring.test-fixture.mjs unused apps/server/test-results/recurring-cpu extreme cpu
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: recurring-cpu-${{ matrix.variant }}
          path: apps/server/test-results/recurring-cpu/
          if-no-files-found: error

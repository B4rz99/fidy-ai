name: Verify the native Transaction history candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 5154c14e8e84ab5a64a201955024ba2eaeeda912
          persist-credentials: false
      - uses: ./.github/actions/bun-install
      - name: Verify policy and native credential, history, pagination and Audit
        run: |
          bun infra/cloudflare/verify-edge-policy.ts
          bun x oxlint --deny-warnings --config .oxlintrc.json --type-aware --threads=1 apps/server/cloudflare/transactions/internal/sqlite-history.ts apps/server/cloudflare/transactions/internal/transaction-history.ts
          bun run --cwd apps/server test:cloudflare -- cloudflare/transactions/user-store.test.ts -t 'projection|browser history|stale routes|failed Audit|filters|query|standing'
          bun run --cwd apps/server test:cloudflare -- cloudflare/transactions/native-history-channels.test.ts

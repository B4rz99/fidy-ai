name: Prepare the closed Transaction fixture successor

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read the scoped inventory or prepare the independently approved dormant successor
        type: choice
        default: plan
        options:
          [
            plan,
            stage,
            resume,
            reseal,
            recover,
            recover-resumed,
            rollout,
            rollout-resumed,
            inspect-accounting,
            rollout-accounting,
          ]
        required: true
      plan_artifact:
        description: Successful protected plan artifact ID from the exact current trunk commit
        type: string
      plan_sha256:
        description: Independently approved SHA-256 digest of that GitHub archive
        type: string
      workflow_artifact:
        description: Exact protected receipt for the repaired Workflow
        type: string
      workflow_sha256:
        description: Independently approved SHA-256 digest of the Workflow repair receipt
        type: string
      seal_artifact:
        description: Successful protected zero-traffic successor seal artifact ID
        type: string
      seal_sha256:
        description: Independently approved SHA-256 digest of the successor seal archive
        type: string
      recovery_artifact:
        description: Verified dormant successor recovery artifact ID
        type: string
      recovery_sha256:
        description: Independently approved SHA-256 digest of the dormant recovery archive
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/trunk' && github.ref_protected
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      FIXTURE_RELEASE_OPERATION:
        ${{ (inputs.operation == 'resume' || inputs.operation == 'reseal') && 'stage-fixture-successor'
        || inputs.operation == 'recover-resumed' && 'recover-fixture-successor'
        || (inputs.operation == 'rollout-resumed' || endsWith(inputs.operation, '-accounting')) && 'rollout-fixture-successor'
        || format('{0}-fixture-successor', inputs.operation) }}
      FIXTURE_SUCCESSOR_RESUME: ${{ inputs.operation == 'resume' || inputs.operation == 'reseal' || endsWith(inputs.operation, '-resumed') }}
      FIXTURE_SUCCESSOR_RESEAL: ${{ inputs.operation == 'reseal' }}
      FIXTURE_ACCOUNTING_ROLLOUT: ${{ endsWith(inputs.operation, '-accounting') }}
      FIXTURE_ACCOUNTING_INSPECTION: ${{ inputs.operation == 'inspect-accounting' }}
      SUCCESSOR_WORKFLOW_ARTIFACT: ${{ inputs.workflow_artifact }}
      SUCCESSOR_WORKFLOW_DIGEST: ${{ inputs.workflow_sha256 }}
      APPROVED_PLAN_ARTIFACT: ${{ inputs.plan_artifact }}
      APPROVED_PLAN_DIGEST: ${{ inputs.plan_sha256 }}
      SUCCESSOR_SEAL_ARTIFACT: ${{ inputs.seal_artifact }}
      SUCCESSOR_SEAL_DIGEST: ${{ inputs.seal_sha256 }}
      SUCCESSOR_RECOVERY_ARTIFACT: ${{ inputs.recovery_artifact }}
      SUCCESSOR_RECOVERY_DIGEST: ${{ inputs.recovery_sha256 }}
      NATIVE_STORAGE_ADMISSION: ${{ vars.NATIVE_STORAGE_ADMISSION }}
      NATIVE_STORAGE_HOSTS: ${{ vars.NATIVE_STORAGE_HOSTS || 'acceptance' }}
      RELEASE_GIT_SHA: ${{ (inputs.operation == 'resume' || inputs.operation == 'reseal' || endsWith(inputs.operation, '-resumed')) && 'de04a192c3836be0efb488b170a7b93b9f98f28f' || github.sha }}
      RELEASE_ATTEMPT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
      ALCHEMY_PROFILE: ci
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FIDY_NATIVE_FIXTURE_PUBLIC_KEY: ${{ vars.FIDY_NATIVE_FIXTURE_PUBLIC_KEY }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      NATIVE_FIXTURE_SIGNER_SHA256: ${{ vars.NATIVE_FIXTURE_SIGNER_SHA256 }}
      SMOKE_PROOF: ${{ secrets.NATIVE_STORAGE_SMOKE_PROOF }}
      CLOUDFLARE_ACCESS_ISSUER: ${{ secrets.CLOUDFLARE_ACCESS_ISSUER }}
      RECOVERY_OPERATOR_EMAIL: ${{ vars.RECOVERY_OPERATOR_EMAIL }}
      BETA_PRO_OPERATOR_EMAIL: ${{ vars.BETA_PRO_OPERATOR_EMAIL }}
      SAMPLE_REVIEWER_EMAIL: ${{ vars.SAMPLE_REVIEWER_EMAIL }}
      BILLING_SUPPORT_AUDIENCE: ${{ vars.BILLING_SUPPORT_AUDIENCE }}
      PRICING_PUBLISH_AUDIENCE: ${{ vars.PRICING_PUBLISH_AUDIENCE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require closed protected planning
        run: |
          test "$NATIVE_STORAGE_ADMISSION" = closed
          test "$NATIVE_STORAGE_HOSTS" = acceptance
          test "$GITHUB_RUN_ATTEMPT" = 1
          if [[ "$FIXTURE_RELEASE_OPERATION" == stage-fixture-successor && "$FIXTURE_SUCCESSOR_RESUME" == false ]]; then
            [[ "$APPROVED_PLAN_ARTIFACT" =~ ^[1-9][0-9]{0,19}$ && "$APPROVED_PLAN_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ -z "$APPROVED_PLAN_ARTIFACT" && -z "$APPROVED_PLAN_DIGEST" ]]
          fi
          if [[ "$FIXTURE_SUCCESSOR_RESUME" == true && "$FIXTURE_SUCCESSOR_RESEAL" == false && "$FIXTURE_RELEASE_OPERATION" == stage-fixture-successor ]]; then
            [[ "$SUCCESSOR_WORKFLOW_ARTIFACT" =~ ^[1-9][0-9]{0,19}$ && "$SUCCESSOR_WORKFLOW_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ -z "$SUCCESSOR_WORKFLOW_ARTIFACT" && -z "$SUCCESSOR_WORKFLOW_DIGEST" ]]
          fi
          if [[ "$FIXTURE_RELEASE_OPERATION" == recover-fixture-successor || "$FIXTURE_RELEASE_OPERATION" == rollout-fixture-successor ]]; then
            [[ "$SUCCESSOR_SEAL_ARTIFACT" =~ ^[1-9][0-9]{0,19}$ && "$SUCCESSOR_SEAL_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ -z "$SUCCESSOR_SEAL_ARTIFACT" && -z "$SUCCESSOR_SEAL_DIGEST" ]]
          fi
          if [[ "$FIXTURE_RELEASE_OPERATION" == rollout-fixture-successor ]]; then
            [[ "$SUCCESSOR_RECOVERY_ARTIFACT" =~ ^[1-9][0-9]{0,19}$ && "$SUCCESSOR_RECOVERY_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ -z "$SUCCESSOR_RECOVERY_ARTIFACT" && -z "$SUCCESSOR_RECOVERY_DIGEST" ]]
          fi
      - uses: ./.github/actions/bun-runtime
      - run: bash scripts/install-workspace.sh --ignore-scripts
      - name: Check the reviewed edge policy
        run: bun infra/cloudflare/verify-edge-policy.ts
      - name: Authenticate the original release, receipt, and exact erasure
        if: inputs.operation == 'plan' || inputs.operation == 'stage'
        run: |
          umask 077
          python3 scripts/infra-performance/canonical-fixture/successor_source.py
      - name: Authenticate the repaired support and restore the exact captured predecessor
        if: inputs.operation == 'resume'
        run: |
          umask 077
          python3 scripts/infra-performance/canonical-fixture/successor_resume.py
          echo "FIXTURE_STAGED_VERIFIER_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Authenticate the failed stage and unchanged zero-traffic assignments
        if: inputs.operation == 'reseal'
        run: |
          umask 077
          python3 scripts/infra-performance/canonical-fixture/successor_reseal.py
          echo "FIXTURE_STAGED_VERIFIER_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Authenticate same-SHA successor seals
        if: env.FIXTURE_RELEASE_OPERATION == 'recover-fixture-successor' || env.FIXTURE_RELEASE_OPERATION == 'rollout-fixture-successor'
        run: |
          umask 077
          python3 scripts/infra-performance/canonical-fixture/successor_artifacts.py
          if [[ "$FIXTURE_SUCCESSOR_RESUME" == true ]]; then
            echo "FIXTURE_STAGED_VERIFIER_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: inputs.operation == 'rollout-resumed' || env.FIXTURE_ACCOUNTING_ROLLOUT == 'true'
        with:
          ref: de04a192c3836be0efb488b170a7b93b9f98f28f
          path: interrupted
          persist-credentials: false
      - run: bash scripts/install-workspace.sh --ignore-scripts
        if: inputs.operation == 'rollout-resumed' || env.FIXTURE_ACCOUNTING_ROLLOUT == 'true'
        working-directory: interrupted
      - name: Match the original app and provider build environment
        if: inputs.operation == 'rollout-resumed' || env.FIXTURE_ACCOUNTING_ROLLOUT == 'true'
        run: |
          set -euo pipefail
          original=de04a192c3836be0efb488b170a7b93b9f98f28f
          [[ "$(git -C interrupted rev-parse HEAD)" == "$original" ]]
          for package in alchemy effect @effect/platform-bun @effect/platform-node @alchemy.run/cloudflare-runtime @distilled.cloud/cloudflare @distilled.cloud/core; do
            if ! cmp -s "node_modules/$package/package.json" "interrupted/node_modules/$package/package.json"; then
              echo "Historical and verifier runtime dependency differs for $package" >&2
              exit 1
            fi
          done
          git diff --quiet "$original" "$GITHUB_SHA" -- ':(glob)patches/alchemy@*.patch'
      - uses: ./.github/actions/configure-alchemy-cloudflare-profile
      - name: Bind the protected plan to the reviewed revision
        working-directory: ${{ inputs.operation == 'rollout-resumed' && 'interrupted' || '.' }}
        run: |
          echo "HOSTED_AI_MODEL=$(bun infra/cloudflare/scripts/print-approved-openai-model.ts)" >> "$GITHUB_ENV"
          contract_digest=$(bun run --silent --cwd apps/server contracts:digest)
          if [[ "$FIXTURE_ACCOUNTING_ROLLOUT" == true ]]; then
            original_digest=$(bun run --silent --cwd interrupted/apps/server contracts:digest)
            [[ "$original_digest" == 7a998d31ff69335d7c90bef16407af1a772cf00aab9e44e23d6c2c357857618f ]]
            [[ "$contract_digest" == "$original_digest" ]]
          fi
          echo "CONTRACT_DIGEST=$contract_digest" >> "$GITHUB_ENV"
          echo "FIDY_NATIVE_FIXTURE_PROVIDER_REVISION=$(jq -er .revision infra/cloudflare/native-retained-provider.json)" >> "$GITHUB_ENV"
          echo "RELEASE_SNAPSHOT_FILE=$RUNNER_TEMP/native-release.json" >> "$GITHUB_ENV"
          echo "SMOKE_ATTESTATION_FILE=$RUNNER_TEMP/native-verification.json" >> "$GITHUB_ENV"
      - name: Inspect the scoped successor resources
        if: inputs.operation == 'plan'
        working-directory: infra/cloudflare
        env:
          NATIVE_FIXTURE_SIGNING_KEY: ${{ secrets.NATIVE_FIXTURE_SIGNING_KEY }}
        run: bun native-storage-resources.ts plan-fixture-successor
      - name: Save the verified read-only successor inventory
        if: inputs.operation == 'plan'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-fixture-successor-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/native-fixture-successor-plan.json
          if-no-files-found: error
      - name: Capture the exact predecessor and original financial controls
        if: inputs.operation == 'stage'
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts capture-successor
      - name: Upload the approved successor resources
        if: inputs.operation == 'stage'
        working-directory: infra/cloudflare
        env:
          NATIVE_FIXTURE_SIGNING_KEY: ${{ secrets.NATIVE_FIXTURE_SIGNING_KEY }}
        run: bun native-storage-resources.ts stage-fixture-successor
      - name: Recheck the predecessor and disposal before assigning the successors
        if: inputs.operation == 'stage'
        run: python3 scripts/infra-performance/canonical-fixture/successor_source.py recheck
      - name: Stage the verified successors at zero traffic
        if: inputs.operation == 'stage' || inputs.operation == 'resume'
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts stage-successor
      - name: Verify the successor and seal the dormant stage
        if: inputs.operation == 'stage' || inputs.operation == 'resume' || inputs.operation == 'reseal'
        working-directory: infra/cloudflare
        env:
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
        run: bun native-storage-release.ts seal-successor
      - name: Save the zero-traffic successor seal
        if: inputs.operation == 'stage' || inputs.operation == 'resume'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-fixture-successor-stage-${{ github.run_id }}
          path: ${{ runner.temp }}/native-fixture-successor-stage.json
          if-no-files-found: error
      - name: Save the authenticated zero-traffic reseal
        if: inputs.operation == 'reseal'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-fixture-successor-resealed-${{ github.run_id }}
          path: ${{ runner.temp }}/native-fixture-successor-stage.json
          if-no-files-found: error
      - name: Retain successor staging coordinates
        if: always() && (inputs.operation == 'stage' || inputs.operation == 'resume')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-fixture-successor-staging-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-release.json
            ${{ runner.temp }}/native-release.json.controls
            ${{ runner.temp }}/native-release.json.uploads
          if-no-files-found: ignore
      - name: Restore the sealed successor dormant pair
        if: env.FIXTURE_RELEASE_OPERATION == 'recover-fixture-successor'
        working-directory: infra/cloudflare
        env:
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
        run: bun native-storage-release.ts recover-successor
      - name: Save the verified dormant recovery
        if: env.FIXTURE_RELEASE_OPERATION == 'recover-fixture-successor'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-fixture-successor-recovered-${{ github.run_id }}
          path: ${{ runner.temp }}/native-fixture-successor-recovered.json
          if-no-files-found: error
      - name: Rebuild the original retained Web assets for verification
        if: env.FIXTURE_RELEASE_OPERATION == 'rollout-fixture-successor'
        run: |
          web_revision=$(jq -er .revision infra/cloudflare/native-fixture-upload.json)
          web_digest=$(jq -er .retainedWebContractDigest "$RUNNER_TEMP/fixture-successor-source.json")
          git worktree add --detach "$RUNNER_TEMP/retained-web" "$web_revision"
          (
            cd "$RUNNER_TEMP/retained-web"
            bash scripts/install-workspace.sh --ignore-scripts
            cd apps/web
            RELEASE_GIT_SHA="$web_revision" CONTRACT_DIGEST="$web_digest" bun run build:production
          )
          mkdir -p apps/web/dist
          cp -R "$RUNNER_TEMP/retained-web/apps/web/dist/." apps/web/dist
          if [[ "$FIXTURE_SUCCESSOR_RESUME" == true || "$FIXTURE_ACCOUNTING_ROLLOUT" == true ]]; then
            mkdir -p interrupted/apps/web/dist
            cp -R "$RUNNER_TEMP/retained-web/apps/web/dist/." interrupted/apps/web/dist
          fi
          echo "FIXTURE_WEB_CONTRACT_DIGEST=$web_digest" >> "$GITHUB_ENV"
      - name: Capture the verified successor dormant rollback position
        if: env.FIXTURE_RELEASE_OPERATION == 'rollout-fixture-successor'
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts capture-successor-rollout
      - name: Inspect the scoped accounting rollout without applying it
        if: env.FIXTURE_ACCOUNTING_INSPECTION == 'true'
        working-directory: interrupted/infra/cloudflare
        env:
          NATIVE_FIXTURE_SIGNING_KEY: ${{ secrets.NATIVE_FIXTURE_SIGNING_KEY }}
        run: bun "$GITHUB_WORKSPACE/infra/cloudflare/native-storage-resources.ts" inspect-accounting-successor
      - name: Save the scoped accounting rollout inspection
        if: env.FIXTURE_ACCOUNTING_INSPECTION == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-fixture-accounting-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/native-fixture-accounting-inspection.json
          if-no-files-found: error
      - name: Upload the reviewed active successor pair
        if: env.FIXTURE_RELEASE_OPERATION == 'rollout-fixture-successor' && env.FIXTURE_ACCOUNTING_INSPECTION == 'false'
        working-directory: ${{ (inputs.operation == 'rollout-resumed' || inputs.operation == 'rollout-accounting') && 'interrupted/infra/cloudflare' || 'infra/cloudflare' }}
        env:
          NATIVE_FIXTURE_SIGNING_KEY: ${{ secrets.NATIVE_FIXTURE_SIGNING_KEY }}
        run: bun "$GITHUB_WORKSPACE/infra/cloudflare/native-storage-resources.ts" rollout-fixture-successor
      - name: Stage the active successor pair at zero traffic
        if: env.FIXTURE_RELEASE_OPERATION == 'rollout-fixture-successor' && env.FIXTURE_ACCOUNTING_INSPECTION == 'false'
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts stage-successor-rollout
      - name: Verify and promote the active successor with its tested return pair
        id: promote_successor
        if: env.FIXTURE_RELEASE_OPERATION == 'rollout-fixture-successor' && env.FIXTURE_ACCOUNTING_INSPECTION == 'false'
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts promote-successor
      - name: Verify the installed successor and retained controls
        id: verify_successor
        if: env.FIXTURE_RELEASE_OPERATION == 'rollout-fixture-successor' && env.FIXTURE_ACCOUNTING_INSPECTION == 'false'
        working-directory: infra/cloudflare
        env:
          CLOUDFLARE_BUILDS_READ_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_READ_TOKEN }}
        run: bun native-storage-release.ts verify
      - name: Restore the sealed dormant pair after failed verification
        if: failure() && env.FIXTURE_RELEASE_OPERATION == 'rollout-fixture-successor' && env.FIXTURE_ACCOUNTING_INSPECTION == 'false' && steps.promote_successor.outcome == 'success' && steps.verify_successor.outcome == 'failure'
        working-directory: infra/cloudflare
        run: bun native-storage-release.ts rollback
      - name: Save the active successor release
        if: env.FIXTURE_RELEASE_OPERATION == 'rollout-fixture-successor' && env.FIXTURE_ACCOUNTING_INSPECTION == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-fixture-successor-active-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-release.json.promoted
            ${{ runner.temp }}/native-verification.json
            ${{ runner.temp }}/fixture-successor-seal-reference.json
            ${{ runner.temp }}/fixture-successor-recovery-reference.json
          if-no-files-found: error
      - name: Retain successor active rollout diagnostics
        if: always() && env.FIXTURE_RELEASE_OPERATION == 'rollout-fixture-successor'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-fixture-successor-rollout-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-release.json
            ${{ runner.temp }}/native-release.json.uploads
            ${{ runner.temp }}/native-release.json.promoted
            ${{ runner.temp }}/native-release.json.restored
          if-no-files-found: ignore

name: Rehearse the storage HTTP comparison

on:
  push:
    branches: [perf/hosted-storage-cells, perf/canonical-performance-fixture]
  pull_request:
    paths:
      - ".github/workflows/storage-http.yml"
      - "scripts/infra-performance/cells/**"
      - "scripts/infra-performance/canonical-fixture/**"
      - "scripts/infra-performance/reference/native*.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify comparison evidence and budget refusal
        run: |
          python3 -m unittest discover -s scripts/infra-performance/cells
          python3 -m unittest discover -s scripts/infra-performance/canonical-fixture
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fb53d9e755c14393048dc945fc0b7f117730d872
          path: baseline-d1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 972ecaa22bb58ab472de2e9458c76290c72aa09d
          path: baseline-fixtures
          persist-credentials: false
          sparse-checkout: apps/server/cloudflare
      - uses: ./.github/actions/bun-runtime
      - name: Prepare the pinned comparator
        run: |
          export GIT_ALTERNATE_OBJECT_DIRECTORIES="$GITHUB_WORKSPACE/baseline-fixtures/.git/objects"
          echo "GIT_ALTERNATE_OBJECT_DIRECTORIES=$GIT_ALTERNATE_OBJECT_DIRECTORIES" >> "$GITHUB_ENV"
          git -C baseline-d1 restore --source=972ecaa22bb58ab472de2e9458c76290c72aa09d --worktree -- \
            apps/server/cloudflare/browser-assessment.test-fixture.ts \
            apps/server/cloudflare/browser-acceptance-preview.ts \
            apps/server/cloudflare/browser-acceptance-seed.ts
          bash scripts/install-workspace.sh --ignore-scripts
          (cd baseline-d1 && bash scripts/install-workspace.sh --ignore-scripts)
      - name: Check the comparator Worker code
        run: bun x oxlint --deny-warnings --config .oxlintrc.json --type-aware --threads=1 scripts/infra-performance/cells/*.mjs scripts/infra-performance/cells/*.d.mts
      - name: Create eight Transactions with canonical capture and verify a resumed fixture
        run: python3 scripts/infra-performance/canonical-fixture/rehearse.py --out apps/server/test-results/canonical-fixture
      - name: Measure the paired canonical HTTP read with real Sessions
        run: python3 scripts/infra-performance/cells/rehearse.py --d1 baseline-d1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 15cfe773cd263b6a3d4e1b6e1b958f233cdde84f
          path: baseline-calibration
          persist-credentials: false
          sparse-checkout: |
            apps/server/scripts
            apps/server/cloudflare
      - name: Build and exercise the frozen deployment modules on workerd
        run: |
          python3 scripts/infra-performance/cells/prepare.py --d1 baseline-d1 \
            --calibration baseline-calibration --out apps/server/test-results/storage-http/d1
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: storage-http-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/server/test-results/storage-http/*.json*
            apps/server/test-results/canonical-fixture/*.json
            apps/server/test-results/canonical-fixture/fixture/manifest.json
            apps/server/test-results/storage-http/d1/manifest.json
            apps/server/test-results/storage-http/d1/probe.json
            apps/server/test-results/storage-http/d1/refusal.json
          if-no-files-found: warn
      - name: Preserve only the verified bounded Worker package
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: storage-http-d1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/server/test-results/storage-http/d1/manifest.json
            apps/server/test-results/storage-http/d1/probe.json
            apps/server/test-results/storage-http/d1/refusal.json
            apps/server/test-results/storage-http/d1/limits.json
            apps/server/test-results/storage-http/d1/plan.json
            apps/server/test-results/storage-http/d1/metered-core.mjs
            apps/server/test-results/storage-http/d1/bounded-ingress.mjs
          if-no-files-found: error

name: Verify workerd source and recover saved first-attempt evidence

on:
  workflow_dispatch:
    inputs:
      evidence:
        type: string
        description: Base85-encoded original public benchmark artifact files
      receipt:
        type: string
        description: One of the two fixed local archive SHA-256 receipts
      source:
        type: string
        description: Source revision to test on the credential-free runner

permissions:
  contents: read

jobs:
  recover:
    if: inputs.receipt != ''
    runs-on: ubuntu-latest
    steps:
      - name: Verify the archive and restore original generated files
        env:
          RECEIPT: ${{ inputs.receipt }}
          EVIDENCE: ${{ inputs.evidence }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, tarfile
          expected = {
              "a31fcc836fcc26cd1fad3f1b80a5bfef13cf03159c35b86e6ddbb679a2eebfa4": "workerd-load-44732847622-1",
              "ca90cd4fbaae804eda71bde403f8d123b0a68759c3935aada4a4ab967d6b7618": "workerd-load-44732852474-1",
          }
          receipt = os.environ["RECEIPT"]
          original = expected[receipt]
          packed = base64.b85decode(os.environ["EVIDENCE"])
          assert hashlib.sha256(packed).hexdigest() == receipt
          dest = pathlib.Path("evidence") / original
          dest.mkdir(parents=True)
          with tarfile.open(fileobj=io.BytesIO(packed), mode="r:xz") as archive:
            for member in archive.getmembers():
              assert member.isfile() and pathlib.Path(member.name).name == member.name
              (dest / member.name).write_bytes(archive.extractfile(member).read())
          files = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in dest.iterdir()}
          (dest.parent / "provenance.json").write_text(json.dumps(dict(
            originalArtifact=original, capturedBeforeRerun=True, localArchiveSha256=receipt, sha256=files), indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: restored-first-attempt-${{ github.run_id }}
          path: evidence
  verify:
    if: inputs.source != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [types, graph, profiler]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/bun-install
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Run official project typecheck with Effect diagnostics enabled
        if: matrix.check == 'types'
        run: |
          bun install --cwd tools/astro --frozen-lockfile
          bun run typecheck
          bun tools/astro/node_modules/typescript/bin/tsc -p scripts/infra-performance/load/tsconfig.json
      - name: Run repository dependency graph
        if: matrix.check == 'graph'
        run: |
          bun install --cwd tools/depcruise --frozen-lockfile
          bun run lint:deps
      - name: Run profiler and evidence regressions
        if: matrix.check == 'profiler'
        run: |
          bun test scripts/document-parsing/workerd-inspector.test.ts
          bun scripts/infra-performance/load/trace.test.mjs
          python3 -m unittest discover -s scripts/infra-performance/load

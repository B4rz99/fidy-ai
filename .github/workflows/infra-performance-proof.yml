name: Measure hosted XLSX parser

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-performance-proof
  cancel-in-progress: false

jobs:
  measure:
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out protected trunk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: ./.github/actions/bun-runtime
      - name: Install locked workspace
        run: bash scripts/install-workspace.sh --ignore-scripts
      - name: Measure synthetic XLSX in an isolated Cloudflare preview
        run: |
          set -o pipefail
          bun scripts/document-parsing/xlsx-work.ts --remote | tee "$RUNNER_TEMP/xlsx-performance.jsonl"
      - name: Preserve synthetic measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-xlsx-performance
          path: ${{ runner.temp }}/xlsx-performance.jsonl
          if-no-files-found: error
          retention-days: 7

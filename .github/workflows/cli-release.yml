name: Publish CLI
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [trunk]
permissions:
  contents: read
concurrency:
  group: cli-publication
  cancel-in-progress: false
jobs:
  plan:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/bun-install
      - name: Plan from the resolved CLI inputs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/trunk" --jq .object.sha)
          [[ "$current" == "$SOURCE_SHA" ]] || { echo 'Superseded revision; leaving the default unchanged.' >&2; exit 1; }
          python3 scripts/cli-release/release.py plan --sha "$SOURCE_SHA" --output cli-plan.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.plan.outputs.changed == 'true'
        with:
          name: cli-plan
          path: cli-plan.json
          if-no-files-found: error
          retention-days: 14
  packages:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      FIDY_CLI_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/bun-install
        with:
          save-cache: "false"
      - name: Build and verify the native release
        shell: bash
        run: |
          bash scripts/cli-release/build.sh
          bash scripts/cli-release/build.sh dist/cli-repeat
          for archive in dist/cli-release/*.zip; do
            cmp "$archive" "dist/cli-repeat/$(basename "$archive")"
          done
      - name: Verify POSIX installation and release selection
        if: runner.os != 'Windows'
        run: |
          python3 scripts/cli-release/test-install.py
          python3 scripts/cli-release/test-release.py
      - name: Verify Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/cli-release/test-install.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-release-${{ runner.os }}
          path: |
            dist/cli-release/*.zip
            dist/cli-release/*.sha256
            dist/cli-release/install.sh
            dist/cli-release/install.ps1
            dist/cli-release/THIRD-PARTY-NOTICES.txt
            dist/cli-release/fidy.js
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [plan, packages]
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/bun-install
        with:
          save-cache: "false"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-plan
          path: dist/cli-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-release-*
          path: dist/cli-publication
          merge-multiple: true
      - name: Publish verified immutable assets, then advance the default
        run: python3 scripts/cli-release/release.py publish --plan dist/cli-plan/cli-plan.json --directory dist/cli-publication

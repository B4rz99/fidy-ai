name: Measure the native watchdog fleet

on:
  pull_request:
    paths:
      - ".github/workflows/native-fleet.yml"
      - "scripts/infra-performance/fleet/**"
      - "apps/server/cloudflare/maintenance/native-fleet.test-fixture.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-fleet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/bun-install
        with:
          scope: server-tests
          save-cache: "false"
      - name: Verify rolling coverage calculations
        run: python3 -m unittest discover -s scripts/infra-performance/fleet
      - name: Rehearse with 36 real SQLite User stores
        timeout-minutes: 20
        run: bash scripts/infra-performance/fleet/run.sh 36
      - name: Measure 1,000 real SQLite User stores
        timeout-minutes: 40
        run: bash scripts/infra-performance/fleet/run.sh 1000
      - name: Preserve partial and completed evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-fleet-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/server/test-results/2261-fleet/*/events.jsonl
            apps/server/test-results/2261-fleet/*/report.json
            apps/server/test-results/2261-fleet/*/persistence-kib.tsv
            apps/server/test-results/2261-fleet/*/runner-resources.txt
          if-no-files-found: warn

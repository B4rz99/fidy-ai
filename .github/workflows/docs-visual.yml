name: Docs visual evidence

on:
  pull_request:
    branches: [trunk]
    paths:
      - apps/docs/**
      - design/**
      - bun.lock
      - package.json
      - .github/workflows/docs-visual.yml

permissions:
  contents: read

concurrency:
  group: docs-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - uses: ./.github/actions/bun-install
      - name: Select installed Playwright version
        id: playwright-version
        run: bun -e 'console.log("version=" + require("@playwright/test/package.json").version)' >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browser cache
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-headless-shell
      - name: Reuse or install Chromium headless shell
        env:
          BROWSER_CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
        run: |
          if [[ "$BROWSER_CACHE_HIT" != "true" ]]; then
            bunx --bun playwright install --only-shell chromium
          fi
      - name: Verify Chromium system dependencies
        run: |
          verify_chromium() {
            node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch(); await browser.close();'
          }
          if ! verify_chromium; then
            bunx --bun playwright install --only-shell chromium
            verify_chromium || sudo env NEEDRESTART_SUSPEND=1 node node_modules/.bin/playwright install-deps chromium
            verify_chromium
          fi
      - name: Build documentation and capture all routes and states
        env:
          DOCS_BROWSER_PREBUILT: "true"
          DOCS_VISUAL_CAPTURE: "1"
          DOCS_CAPTURE_SHA: ${{ github.event.pull_request.head.sha }}
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          bun run docs:build
          bun run --cwd apps/docs test:browser e2e/visual.spec.ts
      - name: Preserve actual browser screenshots and metadata
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-browser-evidence-${{ github.event.pull_request.head.sha }}
          path: apps/docs/test-results/
          if-no-files-found: error
          retention-days: 14

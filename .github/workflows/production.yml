name: Deploy Production

on:
  push:
    branches: [trunk]

permissions:
  contents: read

# Releases are serialized without cancelling an active deployment. A newer
# trunk revision waits for the current candidate to finish.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare static application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out the exact trunk revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun for build tooling
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"

      - name: Install the locked workspace
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build and validate the Production static artifact
        env:
          RELEASE_GIT_SHA: ${{ github.sha }}
        run: bun run --cwd apps/web build:production

      - name: Validate the static-only Cloudflare adapter
        working-directory: apps/web
        run: >-
          bunx wrangler deploy --dry-run
          --config cloudflare/wrangler.json
          --outdir /tmp/fidy-cloudflare-dry-run

      - name: Bootstrap the static Worker when explicitly requested
        if: vars.CLOUDFLARE_BOOTSTRAP_REQUIRED == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: >-
            deploy
            --config cloudflare/wrangler.json
            --tag ${{ github.sha }}
            --message "Initial Production ${{ github.sha }}"

      - name: Upload one immutable Cloudflare version
        id: cloudflare-upload
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: >-
            versions upload
            --config cloudflare/wrangler.json
            --tag ${{ github.sha }}
            --message "Production ${{ github.sha }}"

      - name: Capture the exact uploaded Cloudflare version
        id: cloudflare-version
        env:
          WRANGLER_OUTPUT: ${{ steps.cloudflare-upload.outputs.command-output }}
        run: bun scripts/production/cloudflare-version.ts

      - name: Recheck trunk immediately before promotion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GIT_SHA: ${{ github.sha }}
        run: |
          CURRENT_TRUNK_SHA=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/${{ github.event.repository.default_branch }}" \
            --jq .sha)
          if [[ "$CURRENT_TRUNK_SHA" != "$RELEASE_GIT_SHA" ]]; then
            echo "Release $RELEASE_GIT_SHA was superseded by $CURRENT_TRUNK_SHA; leaving the prior version active." >&2
            exit 1
          fi

      - name: Promote only the uploaded Cloudflare version
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: >-
            versions deploy
            ${{ steps.cloudflare-version.outputs.version-id }}
            --config cloudflare/wrangler.json
            --message "Production ${{ github.sha }}"
            --yes

      - name: Record the release
        if: ${{ always() }}
        env:
          CLOUDFLARE_VERSION_ID: ${{ steps.cloudflare-version.outputs.version-id }}
          RELEASE_GIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Production release"
            echo "- Git revision: \`$RELEASE_GIT_SHA\`"
            echo "- Cloudflare version: \`${CLOUDFLARE_VERSION_ID:-not-uploaded}\`"
          } >> "$GITHUB_STEP_SUMMARY"

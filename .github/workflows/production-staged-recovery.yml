name: Recover abandoned Worker candidates

on:
  workflow_dispatch:
    inputs:
      public_deployment_id:
        description: Inspected public deployment, either already stable or containing its zero-traffic candidate
        required: true
        type: string
      core_deployment_id:
        description: Inspected Core deployment, either already stable or containing its zero-traffic candidate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      RELEASE_GIT_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
      ALCHEMY_PROFILE: ci
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RECOVERY_PUBLIC_DEPLOYMENT_ID: ${{ inputs.public_deployment_id }}
      RECOVERY_CORE_DEPLOYMENT_ID: ${{ inputs.core_deployment_id }}
      SMOKE_PROOF: ${{ secrets.SMOKE_PROOF }}
    steps:
      - name: Configure release file paths
        run: |
          echo "RELEASE_SNAPSHOT_FILE=$RUNNER_TEMP/fidy-release.json" >> "$GITHUB_ENV"
          echo "SMOKE_ATTESTATION_FILE=$RUNNER_TEMP/fidy-smoke-passed.json" >> "$GITHUB_ENV"
      - name: Check out protected trunk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: ./.github/actions/bun-runtime
      - name: Install locked workspace
        run: bash scripts/install-workspace.sh --ignore-scripts
      - name: Configure Alchemy's ephemeral Cloudflare profile
        uses: ./.github/actions/configure-alchemy-cloudflare-profile
      - name: Remove only the inspected zero-traffic candidates
        working-directory: infra/cloudflare
        run: bun production-release.ts recover-staged
      - name: Confirm the unchanged serving pair can be captured
        working-directory: infra/cloudflare
        run: bun production-release.ts capture
      - name: Report public and Core Worker deployments without changing traffic
        if: always()
        working-directory: infra/cloudflare
        run: bun production-release.ts inspect

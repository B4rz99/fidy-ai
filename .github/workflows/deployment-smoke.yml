name: Railway Deployment

on:
  deployment_status:

permissions:
  contents: read
  # The guard step below reads this workflow's own run history.
  actions: read

# Railway posts `success` on the same deployment more than once, so a single
# commit arrives here several times. Two mechanisms cover the two shapes that
# takes: this group cancels a repeat that overlaps a run still in flight, and the
# guard step below drops a repeat that arrives after one already finished — 31
# seconds apart, in the case that motivated it, which is far too late to cancel.
concurrency:
  group: production-smoke-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Production Deployment Smoke
    # Vercel also reports a Production deployment, but this smoke targets Railway's backend.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.creator.login == 'railway-app[bot]' &&
      github.event.deployment.environment == 'fidy / production'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      # A run that was skipped by the job condition concludes `skipped`, not
      # `success`, so it is not mistaken here for a smoke test that happened.
      - name: Look for a smoke test already passed on this commit
        id: prior
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.deployment.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          passed=$(gh api \
            "repos/$REPO/actions/workflows/deployment-smoke.yml/runs?head_sha=$SHA&status=success" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID)] | length")
          echo "found=$passed" >>"$GITHUB_OUTPUT"
          if [[ "$passed" != "0" ]]; then
            echo "Commit $SHA already passed its smoke test; nothing to re-verify." >&2
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.prior.outputs.found == '0' }}
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: ./.github/actions/bun-install
        if: ${{ steps.prior.outputs.found == '0' }}
      - name: Check production deployment
        if: ${{ steps.prior.outputs.found == '0' }}
        env:
          DEPLOYMENT_URL: https://fidy-ai-production.up.railway.app
        run: bun scripts/check-deployment-smoke.ts
      - name: Verify production Sentry smoke from the production image
        if: ${{ steps.prior.outputs.found == '0' }}
        env:
          SENTRY_DEPLOYMENT_SMOKE_DSN: ${{ secrets.SENTRY_DEPLOYMENT_SMOKE_DSN }}
          SENTRY_RELEASE: fidy@${{ github.event.deployment.sha }}
          SENTRY_PRODUCTION_DSN_ORIGIN: ${{ vars.SENTRY_PRODUCTION_DSN_ORIGIN }}
          SENTRY_PRODUCTION_DSN_PROJECT_ID: ${{ vars.SENTRY_PRODUCTION_DSN_PROJECT_ID }}
          SENTRY_SMOKE_READ_TOKEN: ${{ secrets.SENTRY_SMOKE_READ_TOKEN }}
          SENTRY_ORGANIZATION_SLUG: ${{ secrets.SENTRY_ORGANIZATION_SLUG }}
          SENTRY_PRODUCTION_PROJECT_SLUG: ${{ secrets.SENTRY_PRODUCTION_PROJECT_SLUG }}
          SENTRY_NON_PRODUCTION_PROJECT_SLUG: ${{ secrets.SENTRY_NON_PRODUCTION_PROJECT_SLUG }}
          SENTRY_TRACE_URL_TEMPLATE: ${{ vars.SENTRY_TRACE_URL_TEMPLATE }}
          ROLLOUT_IMAGE: fidy-rollout-gate:${{ github.event.deployment.sha }}
        run: |
          trap 'docker image rm --force "$ROLLOUT_IMAGE" >/dev/null 2>&1 || true' EXIT
          docker build --tag "$ROLLOUT_IMAGE" .
          docker run --rm \
            --env SENTRY_DEPLOYMENT_SMOKE_DSN \
            --env SENTRY_RELEASE \
            --env SENTRY_PRODUCTION_DSN_ORIGIN \
            --env SENTRY_PRODUCTION_DSN_PROJECT_ID \
            --env SENTRY_SMOKE_READ_TOKEN \
            --env SENTRY_ORGANIZATION_SLUG \
            --env SENTRY_PRODUCTION_PROJECT_SLUG \
            --env SENTRY_NON_PRODUCTION_PROJECT_SLUG \
            --env SENTRY_TRACE_URL_TEMPLATE \
            "$ROLLOUT_IMAGE" \
            bun dist/commands/smoke-sentry-deployment.js

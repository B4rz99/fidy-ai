services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: fidy
      # NOFLUID Local-development database only; throwaway credential for a container bound to localhost, no real data
      POSTGRES_PASSWORD: fidy
      POSTGRES_DB: fidy
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fidy"]
      interval: 2s
      timeout: 2s
      retries: 15

name: Compare the storage reference

on:
  pull_request:
    paths:
      - ".github/workflows/storage-reference.yml"
      - "scripts/infra-performance/reference/**"
      - "scripts/dev-browser-api.ts"
  workflow_dispatch:
    inputs:
      dataset:
        description: FinancialRecord fixture
        type: choice
        options: [production, small, extreme]
        default: production
      network:
        description: Browser network
        type: choice
        options: [normal, poor]
        default: normal
      workerd_profile:
        description: User count and review population for the workerd load
        type: choice
        options: [original, native-original, mixed-review, single, cpu]
        default: original
      workerd_load:
        description: Run 20 authenticated financial Users and 30 paired Corrections in workerd
        type: boolean
        default: false
      transaction_read_only:
        description: Measure mounted Transactions startup and fresh history only
        type: boolean
        default: false
      full_recurring:
        description: Measure only the four compact Recurring interactions and full revision HTTP on extreme
        type: boolean
        default: false
      review_phases:
        description: Run focused Needs Review request probes on the extreme fixture
        type: boolean
        default: false
      review_workerd_d1:
        description: Compare the full-size mounted Needs Review journey with both API graphs in workerd
        type: boolean
        default: false
      setup_idle_ms:
        description: Idle time between authenticated fixture preparation and the first browser journey
        type: choice
        options: ["0", "2000"]
        default: "0"

permissions:
  contents: read

concurrency:
  group: storage-reference-${{ (inputs.review_phases || inputs.review_workerd_d1) && github.sha || github.ref }}-${{ inputs.workerd_profile }}-${{ inputs.dataset || 'production' }}-${{ inputs.network || 'normal' }}-${{ inputs.setup_idle_ms || '0' }}-${{ inputs.transaction_read_only || false }}-${{ inputs.full_recurring || false }}
  cancel-in-progress: false

jobs:
  compare:
    if: ${{ !inputs.workerd_load }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FIDY_REFERENCE_REVIEW_PHASES: ${{ (inputs.review_phases || inputs.review_workerd_d1) && '1' || '0' }}
      DATASET: ${{ inputs.dataset || 'production' }}
      NETWORK: ${{ inputs.network || 'normal' }}
      RECURRING_FLAG: ${{ inputs.full_recurring && '--full-recurring' || '' }}
      READ_ONLY_FLAG: ${{ inputs.transaction_read_only && '--transaction-read-only' || '' }}
      SETUP_IDLE_MS: ${{ inputs.setup_idle_ms || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fb53d9e755c14393048dc945fc0b7f117730d872
          path: baseline-d1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 972ecaa22bb58ab472de2e9458c76290c72aa09d
          path: baseline-fixtures
          persist-credentials: false
          sparse-checkout: apps/server/cloudflare
      - uses: ./.github/actions/bun-runtime
      - name: Prepare both frozen checkouts and the common browser
        run: |
          export GIT_ALTERNATE_OBJECT_DIRECTORIES="$GITHUB_WORKSPACE/baseline-fixtures/.git/objects"
          echo "GIT_ALTERNATE_OBJECT_DIRECTORIES=$GIT_ALTERNATE_OBJECT_DIRECTORIES" >> "$GITHUB_ENV"
          git -C baseline-d1 restore --source=972ecaa22bb58ab472de2e9458c76290c72aa09d --worktree -- \
            apps/server/cloudflare/browser-assessment.test-fixture.ts \
            apps/server/cloudflare/browser-acceptance-preview.ts \
            apps/server/cloudflare/browser-acceptance-seed.ts
          bash scripts/install-workspace.sh --ignore-scripts
          (cd baseline-d1 && bash scripts/install-workspace.sh --ignore-scripts)
          echo "ASSESSMENT_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
      - name: Verify one equivalent pair before collecting timings
        if: ${{ !inputs.review_workerd_d1 }}
        run: |
          bun scripts/infra-performance/reference/native-review-pressure.test.mjs
          bun apps/web/scripts/check-transaction-panel.ts
          bun scripts/infra-performance/reference/review-failure.test.mjs
          bun scripts/infra-performance/reference/recurring-response.test.mjs
          python3 -m unittest discover -s scripts/infra-performance/reference
          python3 scripts/infra-performance/reference/run.py --d1 baseline-d1 --do . \
            --dataset "$DATASET" --network "$NETWORK" --setup-idle-ms "$SETUP_IDLE_MS" ${READ_ONLY_FLAG:+"$READ_ONLY_FLAG"} ${RECURRING_FLAG:+"$RECURRING_FLAG"} --pairs 1 --origin "GitHub-hosted Ubuntu loopback"
      - name: Measure 30 alternating pairs
        if: ${{ !inputs.review_phases && !inputs.review_workerd_d1 }}
        run: |
          python3 scripts/infra-performance/reference/run.py --d1 baseline-d1 --do . \
            --dataset "$DATASET" --network "$NETWORK" --setup-idle-ms "$SETUP_IDLE_MS" ${READ_ONLY_FLAG:+"$READ_ONLY_FLAG"} ${RECURRING_FLAG:+"$RECURRING_FLAG"} --pairs 30 --origin "GitHub-hosted Ubuntu loopback"
      - name: Capture two paired full-fixture request traces
        if: ${{ inputs.review_phases }}
        run: |
          python3 scripts/infra-performance/reference/run.py --d1 baseline-d1 --do . \
            --dataset "$DATASET" --network "$NETWORK" --pairs 2 --origin "GitHub-hosted Ubuntu loopback"
      - name: Compare the full-size browser fixture through both workerd graphs
        if: ${{ inputs.review_workerd_d1 }}
        run: |
          python3 scripts/infra-performance/reference/run.py --d1 baseline-d1 --do . \
            --dataset extreme --network "$NETWORK" --review-workerd-d1 --pairs 1 --origin "GitHub-hosted Ubuntu loopback"
      - name: Summarize Needs Review phases
        if: ${{ always() && (inputs.review_phases || inputs.review_workerd_d1) }}
        run: |
          for folder in apps/web/test-results/reference/*; do
            python3 scripts/infra-performance/reference/phase_report.py "$folder" > "$folder/review-phases.json"
          done
      - name: Preserve reference evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: storage-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/test-results/reference/*/plan.json
            apps/web/test-results/reference/*/attempts.jsonl
            apps/web/test-results/reference/*/*/workspace-events.jsonl
            apps/web/test-results/reference/*/report.json
            apps/web/test-results/reference/*/review-phases.json
          if-no-files-found: warn

  workerd-load:
    if: inputs.workerd_load
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fb53d9e755c14393048dc945fc0b7f117730d872
          path: baseline-d1
          persist-credentials: false
      - uses: ./.github/actions/bun-runtime
      - name: Prepare both immutable application checkouts
        run: |
          bash scripts/install-workspace.sh --ignore-scripts
          (cd baseline-d1 && bash scripts/install-workspace.sh --ignore-scripts)
          bun scripts/infra-performance/load/trace.test.mjs
          python3 -m unittest discover -s scripts/infra-performance/load
      - name: Measure complete workerd requests and confirmed Corrections
        env:
          DATASET: ${{ inputs.dataset }}
          PROFILE: ${{ inputs.workerd_profile }}
          FIDY_WORKERD_CPU: ${{ inputs.workerd_profile == 'cpu' && '1' || '0' }}
        run: |
          mkdir -p apps/server/test-results/load
          touch apps/server/test-results/load/attempts.jsonl
          bun scripts/infra-performance/load/measure.test-fixture.mjs baseline-d1 apps/server/test-results/load "$DATASET" "$PROFILE"
      - name: Evaluate every planned boundary
        if: always() && inputs.workerd_profile != 'cpu'
        run: python3 scripts/infra-performance/load/report.py apps/server/test-results/load
      - name: Preserve fixture counts, attempts, accountability and comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workerd-load-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/server/test-results/load

name: Verify the storage performance integration candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 4b80660c5b6d84eddeb1eef0a127255dbf2b69ca
          persist-credentials: false
      - uses: ./.github/actions/bun-install
      - name: Verify policy, touched types and targeted tests
        run: |
          bun infra/cloudflare/verify-edge-policy.ts
          bun run --cwd apps/web check:policy
          bun x oxlint --deny-warnings --config .oxlintrc.json --type-aware --threads=1 apps/server/cloudflare/recurring-plans/internal/query.ts apps/server/src/core/_shared/time.ts apps/server/src/core/recurring-plans/contract.ts apps/web/src/features/needs-review apps/web/src/features/recurring/month.tsx apps/web/src/features/recurring/occurrence-list.tsx
          bun run --cwd apps/web typecheck
          bun run --cwd apps/web test -- src/features/needs-review/read-selection.test.ts
          bun run --cwd apps/server test:core -- --coverage.enabled=false src/core/recurring-plans/contract.test.ts src/core/_shared/time.test.ts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fb53d9e755c14393048dc945fc0b7f117730d872
          path: baseline-d1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 972ecaa22bb58ab472de2e9458c76290c72aa09d
          path: baseline-fixtures
          sparse-checkout: apps/server/cloudflare
          persist-credentials: false
      - name: Verify mounted Review and Recurring layout in Chromium
        run: |
          export GIT_ALTERNATE_OBJECT_DIRECTORIES="$GITHUB_WORKSPACE/baseline-fixtures/.git/objects"
          git -C baseline-d1 restore --source=972ecaa22bb58ab472de2e9458c76290c72aa09d --worktree -- \
            apps/server/cloudflare/browser-assessment.test-fixture.ts \
            apps/server/cloudflare/browser-acceptance-preview.ts \
            apps/server/cloudflare/browser-acceptance-seed.ts
          (cd baseline-d1 && bash scripts/install-workspace.sh --ignore-scripts)
          export ASSESSMENT_CHROMIUM="$(command -v google-chrome)"
          bun apps/web/scripts/check-transaction-panel.ts
          python3 scripts/infra-performance/reference/run.py --d1 baseline-d1 --do . \
            --dataset extreme --network normal --pairs 1 --origin "GitHub-hosted Ubuntu loopback"
          python3 scripts/infra-performance/reference/run.py --d1 baseline-d1 --do . \
            --dataset extreme --network normal --pairs 1 --origin "GitHub-hosted Ubuntu loopback" --full-recurring
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-browser-smoke
          path: |
            apps/web/test-results/reference/*/plan.json
            apps/web/test-results/reference/*/attempts.jsonl
            apps/web/test-results/reference/*/report.json
          if-no-files-found: warn

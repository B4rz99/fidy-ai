services:
  app:
    build: .
    environment:
      APP_VERSION: local-container
      # NOFLUID Local-development database only; restricted throwaway runtime credential
      DATABASE_URL: postgres://fidy_runtime:fidy_runtime@db:5432/fidy
      # NOFLUID Local-development database only; privileged throwaway migration credential
      MIGRATION_DATABASE_URL: postgres://fidy:fidy@db:5432/fidy
      WHATSAPP_BUSINESS_PORTFOLIO_ID: portfolio-local
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: fidy
      # NOFLUID Local-development database only; throwaway credential for a container bound to localhost, no real data
      POSTGRES_PASSWORD: fidy
      POSTGRES_DB: fidy
    ports:
      - "5433:5432"
    volumes:
      - ./apps/server/tools/local-postgres-init.sql:/docker-entrypoint-initdb.d/010-runtime-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fidy"]
      interval: 2s
      timeout: 2s
      retries: 15

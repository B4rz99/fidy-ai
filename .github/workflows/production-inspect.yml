name: Inspect Production Worker traffic

on:
  workflow_dispatch:
    inputs:
      verify_database:
        description: Run the signed database, Queue and Workflow proof on the live release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      RELEASE_GIT_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
      ALCHEMY_PROFILE: ci
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SMOKE_PROOF: ${{ secrets.SMOKE_PROOF }}
    steps:
      - name: Configure release file paths
        run: |
          echo "RELEASE_SNAPSHOT_FILE=$RUNNER_TEMP/fidy-release.json" >> "$GITHUB_ENV"
          echo "SMOKE_ATTESTATION_FILE=$RUNNER_TEMP/fidy-smoke-passed.json" >> "$GITHUB_ENV"
      - name: Check out protected trunk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: ./.github/actions/bun-runtime
      - name: Install locked workspace
        run: bash scripts/install-workspace.sh --ignore-scripts
      - name: Configure Alchemy's ephemeral Cloudflare profile
        uses: ./.github/actions/configure-alchemy-cloudflare-profile
      - name: Report public and Core Worker deployments without changing traffic
        working-directory: infra/cloudflare
        run: bun production-release.ts inspect
      - name: Classify Production drift without printing provider attributes
        working-directory: infra/cloudflare
        run: |
          if bash scripts/check-topology-drift.sh inspect; then
            echo 'No Production topology drift.'
          else
            echo 'Drift remains blocked; see sanitized resource categories above.'
          fi
      - name: Capture the live release for database verification
        if: ${{ inputs.verify_database }}
        working-directory: infra/cloudflare
        run: |
          bash scripts/check-topology-drift.sh
          bun production-release.ts capture
      - name: Export the captured live smoke identities
        if: ${{ inputs.verify_database }}
        run: |
          {
            echo "RELEASE_GIT_SHA=$(jq -r .stableRevision "$RELEASE_SNAPSHOT_FILE")"
            echo "CONTRACT_DIGEST=$(jq -r .stableContractDigest "$RELEASE_SNAPSHOT_FILE")"
            echo "PUBLIC_VERSION_ID=$(jq -r .public.stableVersionId "$RELEASE_SNAPSHOT_FILE")"
            echo "CORE_VERSION_ID=$(jq -r .core.stableVersionId "$RELEASE_SNAPSHOT_FILE")"
            echo "PUBLIC_WORKER_NAME=$(jq -r .public.name "$RELEASE_SNAPSHOT_FILE")"
            echo "CORE_WORKER_NAME=$(jq -r .core.name "$RELEASE_SNAPSHOT_FILE")"
            echo "STABLE_PUBLIC_VERSION_ID=$(jq -r .public.stableVersionId "$RELEASE_SNAPSHOT_FILE")"
            echo "STABLE_RELEASE_GIT_SHA=$(jq -r .stableRevision "$RELEASE_SNAPSHOT_FILE")"
            echo "STABLE_CONTRACT_DIGEST=$(jq -r .stableContractDigest "$RELEASE_SNAPSHOT_FILE")"
          } >> "$GITHUB_ENV"
      - name: Require the full signed live database proof
        if: ${{ inputs.verify_database }}
        working-directory: infra/cloudflare
        run: |
          set -euo pipefail
          bun verify-production-smoke.ts promoted | tee "$RUNNER_TEMP/fidy-live-smoke.log"
          grep -Fxq 'Production smoke passed.' "$RUNNER_TEMP/fidy-live-smoke.log"

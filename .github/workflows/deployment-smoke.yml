name: Railway Deployment

on:
  deployment_status:

permissions:
  contents: read

jobs:
  production-smoke:
    name: Production Deployment Smoke
    if: >-
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'production' ||
      endsWith(github.event.deployment.environment, '/ production'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check production deployment
        env:
          DEPLOYMENT_URL: https://fidy-ai-production.up.railway.app
        run: bun scripts/check-deployment-smoke.ts

name: Recover interrupted Production Core promotion

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      RELEASE_GIT_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
      ALCHEMY_PROFILE: ci
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SMOKE_PROOF: ${{ secrets.SMOKE_PROOF }}
    steps:
      - name: Configure release file paths
        run: |
          echo "RELEASE_SNAPSHOT_FILE=$RUNNER_TEMP/fidy-release.json" >> "$GITHUB_ENV"
          echo "SMOKE_ATTESTATION_FILE=$RUNNER_TEMP/fidy-smoke-passed.json" >> "$GITHUB_ENV"
      - name: Check out protected trunk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"
      - name: Install locked workspace
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Configure Alchemy's ephemeral Cloudflare profile
        uses: ./.github/actions/configure-alchemy-cloudflare-profile
      - name: Require the same Worker runtime source as the smoke-tested pair
        run: git diff --quiet 2d65bde42f81b5c4af377e433100a7500bec0a5b HEAD -- apps/server/cloudflare/ infra/cloudflare/alchemy.run.ts
      - name: Restore the exact stable Core version from the interrupted promotion
        working-directory: infra/cloudflare
        run: bun production-release.ts recover-core
      - name: Report both Worker deployments even if recovery fails
        if: ${{ always() }}
        working-directory: infra/cloudflare
        run: bun production-release.ts inspect

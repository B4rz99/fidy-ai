name: Verify unapplied D1 migration repair

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request containing the migration correction
        required: true
        type: string
      migration_name:
        description: Existing migration filename being edited, removed, or renamed
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  verify:
    name: Verify Production migration history
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Production environment allows only protected trunk; this guard is defense in depth.
    environment: production
    env:
      ALCHEMY_PROFILE: ci
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      MIGRATION_REPAIR_PR_NUMBER: ${{ inputs.pull_request_number }}
      MIGRATION_REPAIR_NAME: ${{ inputs.migration_name }}
    steps:
      - name: Check out the trusted trunk revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/bun-runtime

      - name: Install the locked workspace
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Configure Alchemy's ephemeral Cloudflare profile
        uses: ./.github/actions/configure-alchemy-cloudflare-profile

      - name: Ensure Alchemy's Cloudflare state authority exists
        uses: ./.github/actions/bootstrap-alchemy-cloudflare-state

      - name: Verify the requested migration remains unapplied
        working-directory: infra/cloudflare
        run: bun scripts/verify-unapplied-migration-repair.ts

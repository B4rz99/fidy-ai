name: Map the installed browser chunks for startup

on: workflow_dispatch

permissions:
  contents: read

jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun-runtime
      - name: Build the proposed admission split
        run: |
          bash scripts/install-workspace.sh --ignore-scripts
          cd apps/web
          VITE_API_ORIGIN=https://127.0.0.1:4174 bun ../../node_modules/vite/bin/vite.js build --mode production --outDir playwright-dist --sourcemap hidden --manifest
      - name: Record chunk membership without source content
        run: |
          cd apps/web/playwright-dist
          python3 - <<'PY'
          import json
          from pathlib import Path

          chunks = {}
          for code in sorted(Path("assets").glob("*.js")):
              source_map = code.with_suffix(".js.map")
              sources = json.loads(source_map.read_text())["sources"] if source_map.is_file() else []
              chunks[code.as_posix()] = {"bytes": code.stat().st_size, "sources": sources}
          assert chunks, "Expected compiled browser assets"
          Path("chunk-sources.json").write_text(json.dumps(chunks, indent=2) + "\n")
          PY
          cp .vite/manifest.json chunk-manifest.json
      - name: Verify the admission dependency closure
        run: |
          cd apps/web/playwright-dist
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("chunk-manifest.json").read_text())
          chunks = json.loads(Path("chunk-sources.json").read_text())
          pending = ["src/transport/initial-session.ts"]
          closure = set()
          while pending:
              entry = pending.pop()
              if entry in closure:
                  continue
              closure.add(entry)
              pending.extend(manifest[entry].get("imports", []))
          files = sorted(manifest[entry]["file"] for entry in closure)
          sources = [source for file in files for source in chunks[file]["sources"]]
          assert not any("shared-presentation" in file for file in files), files
          assert not any(source.endswith("/src/shell/api.ts") for source in sources), files
          print(json.dumps({"files": files, "bytes": sum(chunks[file]["bytes"] for file in files)}))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: startup-module-graph
          path: |
            apps/web/playwright-dist/chunk-manifest.json
            apps/web/playwright-dist/chunk-sources.json
            apps/web/playwright-dist/index.html

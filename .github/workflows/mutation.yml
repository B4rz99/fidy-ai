name: Mutation

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Mutation testing is deliberately shifted right: it protects trunk nightly
    # without extending or blocking pull-request feedback.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      # Stryker's Babel instrumenter needs Node. Bun still installs dependencies
      # and runs Vitest; only the Stryker process itself runs on Node.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Cache Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'tools/mutation/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Stryker rewrites its sandbox tsconfig through the classic TypeScript
      # compiler API, isolated under tools/mutation from Effect tsgo.
      - name: Install mutation runner
        working-directory: tools/mutation
        run: bun install --frozen-lockfile
      - name: Mutation score
        run: bun run test:mutation

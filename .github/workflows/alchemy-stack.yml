name: Alchemy stack

on:
  workflow_call:
    inputs:
      stack:
        description: Deployed stack to operate (app, site or docs)
        required: true
        type: string
      operation:
        description: plan or deploy
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  stack:
    name: ${{ inputs.operation }} ${{ inputs.stack }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      STACK: ${{ inputs.stack }}
      OPERATION: ${{ inputs.operation }}
      RELEASE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ALCHEMY_PROFILE: ci
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCESS_ISSUER: ${{ secrets.CLOUDFLARE_ACCESS_ISSUER }}
      RECOVERY_OPERATOR_EMAIL: ${{ vars.RECOVERY_OPERATOR_EMAIL }}
      BETA_PRO_OPERATOR_EMAIL: ${{ vars.BETA_PRO_OPERATOR_EMAIL }}
      SAMPLE_REVIEWER_EMAIL: ${{ vars.SAMPLE_REVIEWER_EMAIL }}
      BILLING_SUPPORT_AUDIENCE: ${{ vars.BILLING_SUPPORT_AUDIENCE }}
      PRICING_PUBLISH_AUDIENCE: ${{ vars.PRICING_PUBLISH_AUDIENCE }}
      PROACTIVITY_ENABLED: ${{ vars.PROACTIVITY_ENABLED }}
      PROACTIVITY_TEMPLATE_JSON: ${{ vars.PROACTIVITY_TEMPLATE_JSON }}
      PAT_ADMISSION_KEY: ${{ secrets.PAT_ADMISSION_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
      KAPSO_WEBHOOK_SECRET: ${{ secrets.KAPSO_WEBHOOK_SECRET }}
      WHATSAPP_BUSINESS_PORTFOLIO_ID: ${{ secrets.WHATSAPP_BUSINESS_PORTFOLIO_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
      WOMPI_ENVIRONMENT: ${{ secrets.WOMPI_ENVIRONMENT }}
      WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
      WOMPI_PRIVATE_KEY: ${{ secrets.WOMPI_PRIVATE_KEY }}
      WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
      WOMPI_EVENT_SECRET: ${{ secrets.WOMPI_EVENT_SECRET }}
      WOMPI_DAVIPLATA_OTP_SEND_URL: ${{ vars.WOMPI_DAVIPLATA_OTP_SEND_URL }}
      WOMPI_DAVIPLATA_OTP_CONFIRM_URL: ${{ vars.WOMPI_DAVIPLATA_OTP_CONFIRM_URL }}
      BANCOLOMBIA_SANDBOX_CERTIFICATE_ID: ${{ vars.BANCOLOMBIA_SANDBOX_CERTIFICATE_ID }}
      BANCOLOMBIA_SANDBOX_CLIENT_ID: ${{ vars.BANCOLOMBIA_SANDBOX_CLIENT_ID }}
      BANCOLOMBIA_SANDBOX_PRIVATE_KEY_PEM: ${{ secrets.BANCOLOMBIA_SANDBOX_PRIVATE_KEY_PEM }}
      BANCOLOMBIA_SANDBOX_GRANT_KEY: ${{ secrets.BANCOLOMBIA_SANDBOX_GRANT_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_GIT_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: ./.github/actions/bun-runtime
      - run: bash scripts/install-workspace.sh --ignore-scripts
      - uses: ./.github/actions/configure-alchemy-cloudflare-profile
      - name: Derive the release identity
        run: |
          echo "HOSTED_AI_MODEL=$(bun infra/cloudflare/scripts/print-approved-openai-model.ts)" >> "$GITHUB_ENV"
          echo "CONTRACT_DIGEST=$(bun run --silent --cwd apps/server contracts:digest)" >> "$GITHUB_ENV"
      - name: Run the stack operation
        run: |
          case "$STACK:$OPERATION" in
            app:plan) target=(--cwd infra/cloudflare plan) ;;
            app:deploy) target=(--cwd infra/cloudflare deploy) ;;
            site:plan) target=(--cwd infra/cloudflare plan:site) ;;
            site:deploy) target=(--cwd infra/cloudflare deploy:site) ;;
            docs:plan) target=(--cwd infra/docs plan) ;;
            docs:deploy) target=(--cwd infra/docs publish) ;;
            *) echo "Unknown stack operation $STACK:$OPERATION" >&2; exit 1 ;;
          esac
          set -o pipefail
          bun run "${target[@]}" 2>&1 | tee "$RUNNER_TEMP/stack.log"
      - name: Summarize the stack operation
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### $OPERATION $STACK at \`$RELEASE_GIT_SHA\`"
            echo '```'
            tail -c 60000 "$RUNNER_TEMP/stack.log" 2>/dev/null || echo "No output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the deployed revision
        if: ${{ inputs.operation == 'deploy' }}
        run: |
          revision() {
            curl --fail --silent --show-error --max-time 30 --retry 5 --retry-all-errors --retry-delay 10 "$1" | jq -er "$2"
          }
          case "$STACK" in
            app)
              test "$(revision https://api.fidyapp.com/health .gitRevision)" = "$RELEASE_GIT_SHA"
              test "$(revision https://app.fidyapp.com/deployment-metadata.json .gitRevision)" = "$RELEASE_GIT_SHA"
              ;;
            site)
              test "$(revision https://fidyapp.com/deployment-metadata.json .gitRevision)" = "$RELEASE_GIT_SHA"
              ;;
          esac

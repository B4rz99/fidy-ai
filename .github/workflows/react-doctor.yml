name: React Doctor

on:
  pull_request:
    branches:
      - trunk
      - refactor/595-identity-owner-operations
      - refactor/596-websession-owner-operations
      - feat/publish-categories
      - "stack/580/**"
    paths:
      - "apps/web/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig*.json"
      - ".github/workflows/react-doctor.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  react-doctor:
    name: React health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan apps/web
        id: react-doctor
        uses: millionco/react-doctor@01820bb4fd4d0a4aebcd8df2b2a143a098649cb2 # v2.2.8
        with:
          directory: apps/web
          scope: changed
          blocking: error
          version: "0.9.12"
      - name: Require a perfect React health score
        if: ${{ always() && steps.react-doctor.outputs.score != '' }}
        env:
          SCORE: ${{ steps.react-doctor.outputs.score }}
        run: |
          if [[ "$SCORE" != "100" ]]; then
            echo "React Doctor score must be 100; got ${SCORE:-unavailable}." >&2
            exit 1
          fi

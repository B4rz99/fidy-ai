name: Railway Deployment

on:
  deployment_status:

permissions:
  contents: read

# Railway posts `success` on the same deployment more than once, and each repeat
# smoke-tests a commit already smoke-tested. Keying the group on the sha collapses
# the repeats to the last one, which is also the only one whose verdict is current.
concurrency:
  group: production-smoke-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Production Deployment Smoke
    if: >-
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'production' ||
      endsWith(github.event.deployment.environment, '/ production'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: ./.github/actions/bun-install
      - name: Check production deployment
        env:
          DEPLOYMENT_URL: https://fidy-ai-production.up.railway.app
        run: bun scripts/check-deployment-smoke.ts

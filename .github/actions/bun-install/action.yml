name: Bun install
description: Pin Bun, restore its install cache, and install the root dependencies.

# The cache key hashes every lockfile in the repo, not just the root one, so all
# jobs share one exact entry — including jobs that install an isolated tool
# tree under tools/. Stale fallback entries are intentionally not restored:
# measured fallback transfer time exceeded a fresh Bun install.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.3.14"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'tools/*/bun.lock') }}
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

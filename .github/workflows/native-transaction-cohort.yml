name: Measure the closed native Transaction cohort

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [compare, cleanup]
        required: true
      revision:
        description: Rollback-qualified deployed native SHA
        type: string
        required: true
      core:
        description: Qualified Core version UUID
        type: string
        required: true
      ingress:
        description: Qualified Ingress version UUID
        type: string
        required: true
      release_artifact:
        description: Successful protected rollout artifact ID
        type: string
        required: true
      archive_sha256:
        description: Independently approved native rollout artifact SHA-256
        type: string
        required: true
      prefix:
        description: Allocated fidy-2259- prefix with twelve random hexadecimal digits
        type: string
        required: true
      pairs:
        type: choice
        options: ["1", "30"]
        required: true

permissions:
  contents: read
  actions: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  cohort:
    if: github.ref == 'refs/heads/trunk' && github.ref_protected
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 105
    env:
      NATIVE_STORAGE_ADMISSION: ${{ vars.NATIVE_STORAGE_ADMISSION }}
      FIDY_NATIVE_FIXTURE_PUBLIC_KEY: ${{ vars.FIDY_NATIVE_FIXTURE_PUBLIC_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      REVISION: ${{ inputs.revision }}
      RESOURCE_PREFIX: ${{ inputs.prefix }}
      CORE: ${{ inputs.core }}
      INGRESS: ${{ inputs.ingress }}
      RELEASE_ARTIFACT: ${{ inputs.release_artifact }}
      ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
      PAIRS: ${{ inputs.pairs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/bun-runtime
      - run: bash scripts/install-workspace.sh --ignore-scripts
      - name: Prepare a private runner directory and verify the reviewed release policy
        run: |
          umask 077
          install -d -m 700 "$RUNNER_TEMP/native-comparison"
          echo "OUT=$RUNNER_TEMP/native-comparison" >> "$GITHUB_ENV"
          bun infra/cloudflare/verify-edge-policy.ts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: inputs.action == 'compare'
        with:
          ref: fb53d9e755c14393048dc945fc0b7f117730d872
          path: baseline-d1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: inputs.action == 'compare'
        with:
          ref: 972ecaa22bb58ab472de2e9458c76290c72aa09d
          path: baseline-fixtures
          persist-credentials: false
          sparse-checkout: apps/server/cloudflare
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: inputs.action == 'compare'
        with:
          ref: 15cfe773cd263b6a3d4e1b6e1b958f233cdde84f
          path: baseline-calibration
          persist-credentials: false
          sparse-checkout: |
            apps/server/scripts
            apps/server/cloudflare
      - name: Restore the frozen D1 fixture before native enrollment
        if: inputs.action == 'compare'
        run: |
          export GIT_ALTERNATE_OBJECT_DIRECTORIES="$GITHUB_WORKSPACE/baseline-fixtures/.git/objects"
          git -C baseline-d1 restore --source=972ecaa22bb58ab472de2e9458c76290c72aa09d --worktree -- \
            apps/server/cloudflare/{browser-assessment.test-fixture,browser-acceptance-preview,browser-acceptance-seed}.ts
          (cd baseline-d1 && bash scripts/install-workspace.sh --ignore-scripts)
      - name: Admit the exact release and enroll its closed performance User
        id: collection
        if: inputs.action == 'compare'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SMOKE_PROOF: ${{ secrets.NATIVE_STORAGE_SMOKE_PROOF }}
        run: |
          python3 scripts/infra-performance/canonical-fixture/hosted.py hosted --out "$OUT" \
            --native-revision "$REVISION" --core-version "$CORE" --ingress-version "$INGRESS" \
            --resource-prefix "$RESOURCE_PREFIX" --release-artifact "$RELEASE_ARTIFACT" --archive-sha256 "$ARCHIVE_SHA256"
      - name: Verify the signed native originals and build the materialized D1 package
        if: inputs.action == 'compare'
        env:
          FIDY_NATIVE_REVISION: ${{ inputs.revision }}
          FIDY_NATIVE_RESOURCE_PREFIX: ${{ inputs.prefix }}
          SMOKE_PROOF: ${{ secrets.NATIVE_STORAGE_SMOKE_PROOF }}
        run: |
          umask 077
          python3 scripts/infra-performance/cells/prepare.py --d1 baseline-d1 --calibration baseline-calibration \
            --materialized --canonical-fixture "$OUT/fixture" --out "$OUT/package"
          echo "PACKAGE_SHA256=$(sha256sum "$OUT/package/manifest.json" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Run the scoped comparator under its calibrated Free ceiling
        if: inputs.action == 'compare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SMOKE_PROOF: ${{ secrets.NATIVE_STORAGE_SMOKE_PROOF }}
        run: |
          python3 scripts/infra-performance/cells/owner.py run --out "$OUT/comparison" \
            --prefix "$RESOURCE_PREFIX" --revision "$REVISION" --fixture "$OUT/fixture" \
            --bundle "$OUT/package" --manifest-sha256 "$PACKAGE_SHA256" --pairs "$PAIRS" \
            --core-version "$CORE" --ingress-version "$INGRESS" --maximum-reads 18194 --maximum-writes 4754
      - name: Dispose only the exact performance User and verify both established survivors
        if: always() && (inputs.action == 'cleanup' || steps.collection.outcome == 'success' || steps.collection.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SMOKE_PROOF: ${{ secrets.NATIVE_STORAGE_SMOKE_PROOF }}
        run: |
          python3 scripts/infra-performance/canonical-fixture/hosted.py cleanup --out "$OUT" \
            --native-revision "$REVISION" --core-version "$CORE" --ingress-version "$INGRESS" \
            --resource-prefix "$RESOURCE_PREFIX" --release-artifact "$RELEASE_ARTIFACT" --archive-sha256 "$ARCHIVE_SHA256"
      - name: Retain only aggregate observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: closed-native-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-comparison/summary.json
            ${{ runner.temp }}/native-comparison/cleanup.json
            ${{ runner.temp }}/native-comparison/comparison/report.json

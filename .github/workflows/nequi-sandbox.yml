name: Historical Nequi Sandbox comparison

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nequi-sandbox-protocol
  cancel-in-progress: false

jobs:
  protocol:
    if: github.ref == 'refs/heads/trunk'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fb53d9e755c14393048dc945fc0b7f117730d872
          persist-credentials: false
      - uses: ./.github/actions/bun-runtime
      - run: bash scripts/install-workspace.sh
      - name: Verify reusable sources, first-payment settlement and cancellation
        env:
          FIDY_NEQUI_SANDBOX: "1"
          WOMPI_ENVIRONMENT: ${{ secrets.WOMPI_ENVIRONMENT }}
          WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
          WOMPI_PRIVATE_KEY: ${{ secrets.WOMPI_PRIVATE_KEY }}
          WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
        run: bun run --cwd apps/server test:cloudflare subscription/payment-enrollment.test.ts -t 'proves Sandbox Nequi'
      - name: Record minimized proof scope
        if: success()
        run: |
          printf '%s\n' '## Historical Nequi Sandbox comparison' \
            'Comparator revision: `fb53d9e755c14393048dc945fc0b7f117730d872`' \
            '- Reusable NEQUI source availability and approval were authenticated.' \
            '- Weekly, monthly and yearly first payments reached verified success.' \
            '- Declined weekly first payment reached the existing bounded failure decision.' \
            '- Successful periods were cancelled canonically; retry retained the receipt and paid history.' \
            '- The reusable source was detached; declined settlement had no paid Subscription to cancel.' \
            '- Evidence contains no numbers, tokens, provider identities or response bodies.' \
            '- Historical D1 protocol observation only. Current native release evidence is recorded by the protected storage workflow.' >> "$GITHUB_STEP_SUMMARY"

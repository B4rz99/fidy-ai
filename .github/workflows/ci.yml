name: Checks

# Pull requests only. The `protect` ruleset requires the branch to be up to date
# with trunk before merging, so a pull-request run already grades the head on top
# of the current tip — a `push: trunk` trigger would re-grade an identical tree.
on:
  pull_request:
    branches:
      - trunk

# A new push to a pull request makes the run in flight worthless. Cancel it
# rather than paying for a verdict on a superseded commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Workspace Gate
    runs-on: ubuntu-latest
    # This is the mandatory repository-owned static verdict. The longer-running
    # repository-owned checks are separate sibling jobs below so one failure does
    # not hide the result of unrelated checks behind a serial verifier.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The *tip* of the base branch, not the merge base. A branch cut before a
      # higher migration id landed on trunk must still be measured against that
      # id — the merge base predates it, so comparing there would wave through
      # exactly the migration the migrator will silently skip. Depth 1 suffices:
      # only the tip's copy of the registry is read.
      - name: Fetch base branch tip
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
      - uses: ./.github/actions/bun-install
      - name: Static repository validation
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: bun run verify -- --group static

  builds:
    name: Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/bun-install
      - name: Build validation
        env:
          RELEASE_GIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run verify -- --group builds

  unit:
    name: Unit and artifact tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/bun-install
      - name: Unit and artifact validation
        run: bun run verify -- --group unit

  browser:
    name: Web browser and accessibility checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fidy
          POSTGRES_PASSWORD: fidy
          POSTGRES_DB: fidy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fidy"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/bun-install
      - name: Create restricted runtime role
        env:
          PGPASSWORD: fidy
        run: psql -h localhost -U fidy -d fidy -v ON_ERROR_STOP=1 -f apps/server/tools/local-postgres-init.sql
      - name: Install Chromium
        run: bunx --bun playwright install --with-deps chromium
      - name: Static-shell browser validation
        env:
          DATABASE_URL: postgres://fidy_runtime:fidy_runtime@localhost:5432/fidy
          MIGRATION_DATABASE_URL: postgres://fidy:fidy@localhost:5432/fidy
        run: bun run verify -- --group browser

  server:
    name: Server integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fidy
          POSTGRES_PASSWORD: fidy
          POSTGRES_DB: fidy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fidy"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/bun-install
      - name: Create restricted runtime role
        env:
          PGPASSWORD: fidy
        run: psql -h localhost -U fidy -d fidy -v ON_ERROR_STOP=1 -f apps/server/tools/local-postgres-init.sql
      - name: Server integration validation
        env:
          DATABASE_URL: postgres://fidy_runtime:fidy_runtime@localhost:5432/fidy
          MIGRATION_DATABASE_URL: postgres://fidy:fidy@localhost:5432/fidy
          WHATSAPP_BUSINESS_PORTFOLIO_ID: portfolio-test
        run: bun run verify -- --group server

  quality:
    name: Quality thresholds
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fidy
          POSTGRES_PASSWORD: fidy
          POSTGRES_DB: fidy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fidy"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/bun-install
      - name: Create restricted runtime role
        env:
          PGPASSWORD: fidy
        run: psql -h localhost -U fidy -d fidy -v ON_ERROR_STOP=1 -f apps/server/tools/local-postgres-init.sql
      - name: CRAP threshold validation
        env:
          DATABASE_URL: postgres://fidy_runtime:fidy_runtime@localhost:5432/fidy
          MIGRATION_DATABASE_URL: postgres://fidy:fidy@localhost:5432/fidy
          WHATSAPP_BUSINESS_PORTFOLIO_ID: portfolio-test
        run: bun run verify -- --group quality

  production-image:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/bun-install
      - name: Production image validation
        run: bun run verify -- --group image

  security-secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Fetch base ref
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: git fetch origin "$BASE_BRANCH"
      - name: Gitleaks — pattern-based secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: TruffleHog — verified secret scan
        uses: trufflesecurity/trufflehog@041f07e9df901a1038a528e5525b0226d04dd5ea # v3.93.6
        with:
          extra_args: --only-verified --exclude-paths=.trufflehog-exclude-paths.txt
      - name: Fluid Attacks secret scan
        run: >-
          docker run --rm --pull=always -v "$PWD:/src" -w /src docker.io/fluidattacks/ss:latest
          ss scan --strict --config .fluidattacks/secrets.yaml

  security-sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Semgrep SAST
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/owasp-top-ten
            p/typescript
            p/secrets
      - name: Fluid Attacks SAST
        run: docker run --rm --pull=always -v "$PWD:/src" docker.io/fluidattacks/sast:latest sast --strict scan /src/.fluidattacks/sast.yaml

  security-sca:
    name: SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fluid Attacks SCA
        run: docker run --rm --pull=always -v "$PWD:/src" docker.io/fluidattacks/sca:latest sca --strict scan /src/.fluidattacks/sca.yaml

  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    needs:
      - static
      - builds
      - unit
      - browser
      - server
      - quality
      - production-image
      - security-secrets
      - security-sast
      - security-sca
    if: ${{ always() }}
    steps:
      # Every needed job must report `success`. Enumerating the bad outcomes
      # instead would let `skipped` through, and a gate turned off by a mistaken
      # `if:` would then report green while grading nothing.
      - name: Verify required jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries | map(select(.value.result != "success") | "\(.key): \(.value.result)") | .[]' <<<"$RESULTS")
          if [[ -n "$failed" ]]; then
            echo "Required jobs did not succeed:" >&2
            echo "$failed" >&2
            exit 1
          fi

  preview-artifact:
    name: Preview Artifact
    needs: required-checks
    if: >-
      ${{ needs.required-checks.result == 'success' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/bun-install
      - name: Build credential-free static preview artifact
        env:
          PREVIEW_GIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run --cwd apps/web build:preview
      - name: Publish static artifact for trusted validation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fidy-web-preview-${{ github.event.pull_request.head.sha }}
          path: apps/web/preview.tar
          if-no-files-found: error
          retention-days: 1

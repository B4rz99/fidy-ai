name: Publish customer docs

on:
  push:
    branches: [trunk]
    paths:
      - apps/docs/**
      - infra/docs/**
      - design/**
      - bun.lock
      - package.json
      - patches/**
      - tools/astro/**
      - scripts/install-workspace.sh
      - scripts/install-bun.sh
      - .github/actions/bun-runtime/**
      - .github/actions/configure-alchemy-cloudflare-profile/**
      - .github/workflows/docs-publication.yml

permissions:
  contents: read

concurrency:
  group: docs-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      ALCHEMY_PROFILE: ci
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out the exact trunk revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select Node for Astro build tooling
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Set up Bun
        uses: ./.github/actions/bun-runtime
      - name: Install locked workspace
        run: bash scripts/install-workspace.sh --ignore-scripts
      - name: Install the browser for documentation checks
        run: bunx playwright install --with-deps chromium
      - name: Validate the publication and focused checks
        run: |
          bun run docs:build
          bun run docs:test
          bun run --cwd apps/docs typecheck
          bun run --cwd infra/docs typecheck
          bun run --cwd apps/docs test:browser
      - name: Configure Alchemy's ephemeral Cloudflare profile
        uses: ./.github/actions/configure-alchemy-cloudflare-profile
      - name: Publish the independent docs stack
        working-directory: infra/docs
        run: bun run publish
      - name: Verify the public documentation artifact
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 3 https://docs.fidyapp.com/ -o "$RUNNER_TEMP/docs-index.html"
          cmp apps/docs/dist/index.html "$RUNNER_TEMP/docs-index.html"
          curl --fail --silent --show-error --max-time 30 --retry 3 https://docs.fidyapp.com/index.md -o "$RUNNER_TEMP/docs-index.md"
          cmp apps/docs/dist/index.md "$RUNNER_TEMP/docs-index.md"
          curl --fail --silent --show-error --max-time 30 --retry 3 https://docs.fidyapp.com/llms.txt -o "$RUNNER_TEMP/docs-llms.txt"
          cmp apps/docs/dist/llms.txt "$RUNNER_TEMP/docs-llms.txt"

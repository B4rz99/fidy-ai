name: Measure the closed native browser journey

on:
  pull_request:
    paths:
      - ".github/workflows/hosted-browser.yml"
      - "scripts/infra-performance/hosted-browser/**"
      - "scripts/infra-performance/reference/fresh-transactions.mjs"
      - "scripts/infra-performance/reference/fresh-workspaces.mjs"
      - "scripts/infra-performance/reference/fresh-dashboard.mjs"
      - "scripts/infra-performance/reference/fresh-recurring.mjs"
      - "infra/cloudflare/native-acceptance.ts"
      - "apps/server/cloudflare/release-isolation/**"
  workflow_dispatch:
    inputs:
      revision:
        description: Installed closed native release Git SHA
        required: true
        type: string
      view:
        description: Browser journey on the prepared synthetic fixture
        type: choice
        options: [transactions, budgets, needs-review, dashboard, recurring]
        default: transactions
      network:
        description: Browser network profile
        type: choice
        options: [ordinary, poor]
        default: ordinary

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/bun-install
      - name: Exercise the real signed fixture on the two product clients
        run: |
          set -eu
          source scripts/infra-performance/hosted-browser/tls.sh
          export ASSESSMENT_CHROMIUM="$(command -v google-chrome)"
          export FIDY_DIAGNOSTIC_DIR="$RUNNER_TEMP/paired-browser"
          export D1_WEB_ASSETS="$FIDY_DIAGNOSTIC_DIR/web-d1" NATIVE_WEB_ASSETS="$FIDY_DIAGNOSTIC_DIR/web-do"
          mkdir -m 700 "$FIDY_DIAGNOSTIC_DIR"
          (cd apps/web && VITE_API_ORIGIN=installed bun ../../node_modules/vite/bin/vite.js build --mode production --outDir "$NATIVE_WEB_ASSETS")
          python3 scripts/infra-performance/canonical-fixture/hosted.py rehearse --out "$FIDY_DIAGNOSTIC_DIR/native"
      - name: Preserve counters, metadata and view digests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-browser-read-feasibility-${{ github.run_id }}
          path: |
            ${{runner.temp}}/paired-browser/do-*.json
            ${{runner.temp}}/paired-browser/native-counters.json
            ${{runner.temp}}/paired-browser/native/summary.json


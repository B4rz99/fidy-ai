name: Check reference failure provenance
on:
  push:
    branches: [test/2260-read-failure]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: scripts/infra-performance/reference
      - run: python3 -m unittest discover -s scripts/infra-performance/reference

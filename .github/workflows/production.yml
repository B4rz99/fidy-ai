name: Deploy Production

on:
  push:
    branches: [trunk]

permissions:
  contents: read

# Releases are serialized without cancelling an active deployment. A newer
# trunk revision waits for the current candidate to finish.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Alchemy Cloudflare topology
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      RELEASE_GIT_SHA: ${{ github.sha }}
      ALCHEMY_PROFILE: ci
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out the exact trunk revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure ephemeral Alchemy storage
        run: echo "ALCHEMY_HOME=$RUNNER_TEMP/alchemy" >> "$GITHUB_ENV"

      - name: Set up Bun for build tooling
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"

      - name: Install the locked workspace
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Capture the immutable contract digest
        run: echo "CONTRACT_DIGEST=$(bun run --silent --cwd apps/server contracts:digest)" >> "$GITHUB_ENV"

      - name: Test the Worker boundary
        run: bun run --cwd infra/cloudflare test -- workers.test.ts

      - name: Build and validate the Production static artifact
        run: bun run --cwd apps/web build:production

      - name: Configure Alchemy's ephemeral Cloudflare profile
        run: |
          bunx alchemy profile create "$ALCHEMY_PROFILE" --no-input
          bunx alchemy profile edit \
            --profile "$ALCHEMY_PROFILE" \
            --add Cloudflare \
            --method stored \
            --set apiToken=env:CLOUDFLARE_API_TOKEN \
            --set accountId=env:CLOUDFLARE_ACCOUNT_ID \
            --no-input

      - name: Ensure Alchemy's Cloudflare state authority exists
        run: bunx alchemy provider cloudflare bootstrap --profile "$ALCHEMY_PROFILE" --no-input

      - name: Plan the complete Cloudflare topology
        working-directory: infra/cloudflare
        run: bunx alchemy plan --stage production --no-input

      - name: Recheck trunk immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_TRUNK_SHA=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/${{ github.event.repository.default_branch }}" \
            --jq .sha)
          if [[ "$CURRENT_TRUNK_SHA" != "$RELEASE_GIT_SHA" ]]; then
            echo "Release $RELEASE_GIT_SHA was superseded by $CURRENT_TRUNK_SHA; leaving the prior topology active." >&2
            exit 1
          fi

      - name: Deploy the exact planned topology with Alchemy
        working-directory: infra/cloudflare
        run: bunx alchemy deploy --stage production --yes --no-input

      - name: Verify the migrated public topology
        run: |
          verified=false
          for attempt in {1..20}; do
            redirect=$(curl --silent --show-error --max-time 10 --output /dev/null \
              --write-out '%{http_code} %{redirect_url}' \
              'https://fidyapp.com/health-check?probe=1' || true)
            metadata=$(curl --silent --show-error --max-time 10 \
              'https://app.fidyapp.com/deployment-metadata.json' || true)
            health=$(curl --silent --show-error --max-time 10 \
              'https://api.fidyapp.com/health' || true)

            if [[ "$redirect" == "301 https://app.fidyapp.com/health-check?probe=1" ]] && \
              jq --exit-status --arg revision "$RELEASE_GIT_SHA" --arg digest "$CONTRACT_DIGEST" \
                '. == {contractDigest: $digest, gitRevision: $revision}' <<<"$metadata" >/dev/null && \
              jq --exit-status --arg revision "$RELEASE_GIT_SHA" --arg digest "$CONTRACT_DIGEST" \
                '. == {contractDigest: $digest, gitRevision: $revision, status: "available"}' \
                <<<"$health" >/dev/null; then
              verified=true
              break
            fi

            echo "Public topology has not converged yet (attempt $attempt/20)."
            sleep 3
          done

          if [[ "$verified" != true ]]; then
            echo "The migrated public topology did not expose the exact deployed release." >&2
            exit 1
          fi

      - name: Record the release
        if: ${{ always() }}
        run: |
          {
            echo "### Production release"
            echo "- Git revision: \`$RELEASE_GIT_SHA\`"
            echo "- Contract digest: \`${CONTRACT_DIGEST:-not-planned}\`"
            echo "- Alchemy stack: \`FidyCloudflare/production\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: Attribute browser request timing

on:
  push:
    branches: [test/2260-save-actionability]

permissions:
  contents: read

concurrency:
  group: browser-pilot-${{ github.ref }}-${{ inputs.dataset || 'production' }}-${{ inputs.network || 'normal' }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATASET: ${{ inputs.dataset || 'production' }}
      NETWORK: ${{ inputs.network || 'normal' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fb53d9e755c14393048dc945fc0b7f117730d872
          path: baseline-d1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 972ecaa22bb58ab472de2e9458c76290c72aa09d
          path: baseline-fixtures
          persist-credentials: false
          sparse-checkout: apps/server/cloudflare
      - uses: ./.github/actions/bun-runtime
      - name: Prepare both frozen checkouts and the common browser
        run: |
          export GIT_ALTERNATE_OBJECT_DIRECTORIES="$GITHUB_WORKSPACE/baseline-fixtures/.git/objects"
          echo "GIT_ALTERNATE_OBJECT_DIRECTORIES=$GIT_ALTERNATE_OBJECT_DIRECTORIES" >> "$GITHUB_ENV"
          git -C baseline-d1 restore --source=972ecaa22bb58ab472de2e9458c76290c72aa09d --worktree -- \
            apps/server/cloudflare/browser-assessment.test-fixture.ts \
            apps/server/cloudflare/browser-acceptance-preview.ts \
            apps/server/cloudflare/browser-acceptance-seed.ts
          bash scripts/install-workspace.sh --ignore-scripts
          (cd baseline-d1 && bash scripts/install-workspace.sh --ignore-scripts)
          echo "ASSESSMENT_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
      - name: Observe the Save button in three matched 25-row pairs
        env:
          DEBUG: pw:api
        run: |
          python3 scripts/infra-performance/reference/run.py --d1 baseline-d1 --do . \
            --dataset small --network normal --pairs 3 --origin "GitHub-hosted Ubuntu loopback"
      - name: Preserve allowlisted actionability events
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json, re
          from pathlib import Path
          stages = ("visible, enabled and stable", "not stable", "outside of the viewport",
                    "intercepts pointer events", "waiting for scheduled navigations",
                    "retrying click action", "element is visible", "scrolling into view",
                    "done scrolling", "performing click action", "element is not enabled",
                    "waiting 20ms", "waiting 100ms", "waiting 500ms", "click action done",
                    "waiting for getByRole", "attempting click action")
          for path in Path("apps/web/test-results/reference").glob("*/*/browser.log"):
              log = path.read_text().split("REFERENCE_STAGE save")[-1].split("REFERENCE_STAGE fresh-read")[0]
              out = []
              for line in log.splitlines():
                  found = next((stage for stage in stages if stage in line), None)
                  time = re.search(r"\d{4}-\d{2}-\d{2}T[\d:.]+Z", line)
                  if time and found: out.append({"event": found, "time": time[0]})
              path.with_name("save-actions.json").write_text(json.dumps(out))
          PYCODE
      - name: Preserve reference evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: storage-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/test-results/reference/*/plan.json
            apps/web/test-results/reference/*/attempts.jsonl
            apps/web/test-results/reference/*/*/workspace-events.jsonl
            apps/web/test-results/reference/*/*/network-events.jsonl
            apps/web/test-results/reference/*/*/save-actions.json
            apps/web/test-results/reference/*/report.json
          if-no-files-found: warn

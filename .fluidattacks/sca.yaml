namespace: fidy-ai
working_dir: /src
language: EN
sbom:
  include:
    - .
  exclude:
    - glob(.repos/**)
    - glob(**/node_modules/**)
sca:
  include:
    - glob(*)
    - glob(**)
  exclude:
    - glob(.repos/**)
    - glob(**/node_modules/**)
  exclusions:
    - CVE: CVE-2026-112366
      paths:
        - bun.lock
        - tools/astro/bun.lock
        - tools/depcruise/bun.lock
        - tools/mcp-inspector/bun.lock
        - tools/mutation/bun.lock

name: Count work in closed Category menus

on:
  push:
    branches: [test/2260-browser-menu-work]

permissions:
  contents: read

concurrency:
  group: browser-pilot-${{ github.ref }}-${{ inputs.dataset || 'production' }}-${{ inputs.network || 'normal' }}
  cancel-in-progress: false

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        product: [5b5efae4a6996760a7266c0fe7a8823db5349d34, dc66809f9354cc87394a08468e4860b99e8f10af]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATASET: ${{ inputs.dataset || 'production' }}
      NETWORK: ${{ inputs.network || 'normal' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fb53d9e755c14393048dc945fc0b7f117730d872
          path: baseline-d1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 972ecaa22bb58ab472de2e9458c76290c72aa09d
          path: baseline-fixtures
          persist-credentials: false
          sparse-checkout: apps/server/cloudflare
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.product }}
          path: native-product
          persist-credentials: false
      - uses: ./.github/actions/bun-runtime
      - name: Prepare both frozen checkouts and the common browser
        run: |
          export GIT_ALTERNATE_OBJECT_DIRECTORIES="$GITHUB_WORKSPACE/baseline-fixtures/.git/objects"
          echo "GIT_ALTERNATE_OBJECT_DIRECTORIES=$GIT_ALTERNATE_OBJECT_DIRECTORIES" >> "$GITHUB_ENV"
          git -C baseline-d1 restore --source=972ecaa22bb58ab472de2e9458c76290c72aa09d --worktree -- \
            apps/server/cloudflare/browser-assessment.test-fixture.ts \
            apps/server/cloudflare/browser-acceptance-preview.ts \
            apps/server/cloudflare/browser-acceptance-seed.ts
          bash scripts/install-workspace.sh --ignore-scripts
          (cd baseline-d1 && bash scripts/install-workspace.sh --ignore-scripts)
          echo "ASSESSMENT_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
      - name: Count radio option elements in the actual rendered native bundle
        working-directory: native-product
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path("apps/web/src/ui/components/choice-dropdown.tsx")
          s = p.read_text()
          tag = "<DropdownMenuRadioItem key={option.value}"
          assert s.count(tag) == 1
          p.write_text(s.replace(tag, "<DropdownMenuRadioItem key={(window.__referenceChoiceOptions = (window.__referenceChoiceOptions ?? 0) + 1, option.value)}"))
          PYCODE
          git -c user.name='Local fixture' -c user.email=fixture@example.invalid commit -am 'Count radio option elements in the disposable diagnostic build'
          bash scripts/install-workspace.sh --ignore-scripts
      - name: Trace three small-fixture pairs
        run: |
          python3 scripts/infra-performance/reference/run.py --d1 baseline-d1 --do native-product \
            --dataset small --network normal --pairs 3 --origin "GitHub-hosted Ubuntu loopback"
      - name: Preserve reference evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: menu-observations-${{ matrix.product }}-${{ github.run_id }}
          path: |
            apps/web/test-results/reference/*/plan.json
            apps/web/test-results/reference/*/attempts.jsonl
            apps/web/test-results/reference/*/*/workspace-events.jsonl
            apps/web/test-results/reference/*/*/network-events.jsonl
            apps/web/test-results/reference/*/report.json
          if-no-files-found: warn

name: Checks

on:
  pull_request:
    branches:
      - trunk
  push:
    branches:
      - trunk

jobs:
  pr-title:
    name: PR Title
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun scripts/check-pr-title.ts

  migration-ids:
    name: Migration IDs
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # No `bun install`: the check imports nothing outside Bun's own globals.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The *tip* of the base branch, not the merge base. A branch cut before a
      # higher migration id landed on trunk must still be measured against that
      # id — the merge base predates it, so comparing there would wave through
      # exactly the migration the migrator will silently skip. Depth 1 suffices:
      # only the tip's copy of the registry is read.
      - name: Fetch base branch tip
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Validate migration ids
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: bun scripts/check-migration-ids.ts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: oxlint
        run: bun run lint
      - name: oxlint --type-aware
        run: bun run lint:type-aware

  lint-suppressions:
    name: Lint Suppressions
    runs-on: ubuntu-latest
    # No `bun install`: the check reads the tree through git and Bun's own
    # globals. It is its own job rather than a step of Lint because it decides
    # whether that job's result means anything — a whole-file `oxlint-disable`
    # turns off every rule in the file, including one written to catch it.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Lint suppressions
        run: bun run lint:suppressions

  module-graph:
    name: Module Graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # dependency-cruiser reads .ts sources and the tsconfig `paths` aliases
      # through the classic TypeScript compiler API, which the repo's Effect
      # tsgo `typescript` build does not expose, so the cruiser and a classic
      # typescript live in an isolated install under tools/depcruise.
      - name: Install dependency-cruiser
        working-directory: tools/depcruise
        run: bun install --frozen-lockfile
      - name: Module-graph rules and generated graph
        run: bun run lint:deps

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    # The one job that reaches the public internet on purpose: it asks the npm
    # registry what has shipped since each pin was written. It grades the
    # manifests as the pull request declares them, not the installed tree —
    # `bun install` is here only because the check itself is an Effect program.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Dependency policy
        run: bun run lint:dependencies

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: oxfmt --check
        run: bun run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck

  test-core:
    name: Core Tests
    runs-on: ubuntu-latest
    # Deliberately no postgres service and no DATABASE_URL: the core tier needs
    # nothing (ARCHITECTURE.md §8). A core test that reaches for the world fails
    # here rather than passing quietly inside the full run, where a database is
    # always available.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Core tests
        run: bun run test:core

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fidy
          POSTGRES_PASSWORD: fidy
          POSTGRES_DB: fidy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fidy"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create restricted runtime role
        env:
          PGPASSWORD: fidy
        run: psql -h localhost -U fidy -d fidy -v ON_ERROR_STOP=1 -f deploy/local-postgres-init.sql
      - name: Test
        env:
          DATABASE_URL: postgres://fidy_runtime:fidy_runtime@localhost:5432/fidy
          MIGRATION_DATABASE_URL: postgres://fidy:fidy@localhost:5432/fidy
          WHATSAPP_BUSINESS_PORTFOLIO_ID: portfolio-test
        run: bun run test

  acceptance:
    name: WhatsApp Acceptance
    runs-on: ubuntu-latest
    # A separate service container gives the public-seam release signal a fresh database without
    # sharing state or coverage output with unit and lower-seam integration tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fidy
          POSTGRES_PASSWORD: fidy
          POSTGRES_DB: fidy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fidy"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create restricted runtime role
        env:
          PGPASSWORD: fidy
        run: psql -h localhost -U fidy -d fidy -v ON_ERROR_STOP=1 -f deploy/local-postgres-init.sql
      - name: WhatsApp acceptance scenarios and coverage
        env:
          DATABASE_URL: postgres://fidy_runtime:fidy_runtime@localhost:5432/fidy
          MIGRATION_DATABASE_URL: postgres://fidy:fidy@localhost:5432/fidy
          WHATSAPP_BUSINESS_PORTFOLIO_ID: portfolio-test
        # Verbose scenario IDs and the line/branch ratchet remain in the retained job log.
        run: bun run test:acceptance
      - name: Verify improved coverage was recorded
        run: git diff --exit-code -- vitest.acceptance.config.ts

  crap:
    name: CRAP
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fidy
          POSTGRES_PASSWORD: fidy
          POSTGRES_DB: fidy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fidy"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # crap4ts parses source with the classic TypeScript compiler API, which the
      # repo's Effect tsgo `typescript` build does not expose, so the analyzer and
      # a classic typescript live in an isolated install under tools/crap.
      - name: Install CRAP analyzer
        working-directory: tools/crap
        run: bun install --frozen-lockfile
      - name: Create restricted runtime role
        env:
          PGPASSWORD: fidy
        run: psql -h localhost -U fidy -d fidy -v ON_ERROR_STOP=1 -f deploy/local-postgres-init.sql
      - name: CRAP threshold gate
        env:
          DATABASE_URL: postgres://fidy_runtime:fidy_runtime@localhost:5432/fidy
          MIGRATION_DATABASE_URL: postgres://fidy:fidy@localhost:5432/fidy
          WHATSAPP_BUSINESS_PORTFOLIO_ID: portfolio-test
        run: bun run test:crap

  production-image:
    name: Production Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Boot production image against fresh PostgreSQL
        run: bun run check:production-image

  security-secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Fetch base ref
        if: ${{ github.event_name == 'pull_request' }}
        run: git fetch origin ${{ github.event.pull_request.base.ref }}
      - name: Gitleaks — pattern-based secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: TruffleHog — verified secret scan
        uses: trufflesecurity/trufflehog@041f07e9df901a1038a528e5525b0226d04dd5ea # v3.93.6
        with:
          extra_args: --only-verified
      - name: Fluid Attacks secret scan
        run: docker run --rm --pull=always -v "$PWD:/src" docker.io/fluidattacks/ss:latest ss scan --strict /src

  security-sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Semgrep SAST
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/owasp-top-ten
            p/typescript
            p/secrets
      - name: Fluid Attacks SAST
        run: docker run --rm --pull=always -v "$PWD:/src" docker.io/fluidattacks/sast:latest sast --strict scan /src/.fluidattacks/sast.yaml

  security-sca:
    name: SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Fluid Attacks SCA
        run: docker run --rm --pull=always -v "$PWD:/src" docker.io/fluidattacks/sca:latest sca --strict scan /src/.fluidattacks/sca.yaml

  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    needs:
      - pr-title
      - migration-ids
      - lint
      - lint-suppressions
      - module-graph
      - dependencies
      - format
      - typecheck
      - test-core
      - test
      - acceptance
      - crap
      - production-image
      - security-secrets
      - security-sast
      - security-sca
    if: ${{ always() }}
    steps:
      - name: Verify required jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more required jobs failed." >&2
            exit 1
          fi

          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs were cancelled." >&2
            exit 1
          fi

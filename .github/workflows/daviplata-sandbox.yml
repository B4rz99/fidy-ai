name: Historical DaviPlata Sandbox comparison

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daviplata-sandbox-protocol
  cancel-in-progress: false

jobs:
  protocol:
    if: github.ref == 'refs/heads/trunk'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fb53d9e755c14393048dc945fc0b7f117730d872
          persist-credentials: false
      - uses: ./.github/actions/bun-runtime
      - run: bun install --frozen-lockfile
      - name: Verify OTP, matching settlement and source cancellation
        env:
          FIDY_DAVIPLATA_SANDBOX: "1"
          WOMPI_ENVIRONMENT: ${{ secrets.WOMPI_ENVIRONMENT }}
          WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
          WOMPI_PRIVATE_KEY: ${{ secrets.WOMPI_PRIVATE_KEY }}
          WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
          WOMPI_DAVIPLATA_OTP_SEND_URL: https://api-sandbox.wompi.co/v1/webhook_events/daviplata_response/sandbox
          WOMPI_DAVIPLATA_OTP_CONFIRM_URL: https://api-sandbox.wompi.co/v1/webhook_events/daviplata_response/sandbox
        run: bun run --cwd apps/server test:cloudflare subscription/payment-enrollment.test.ts -t 'proves Sandbox DaviPlata'
      - name: Record minimized proof scope
        if: success()
        run: |
          printf '%s\n' '## Historical DaviPlata Sandbox comparison' \
            'Comparator revision: `fb53d9e755c14393048dc945fc0b7f117730d872`' \
            '- Returned OTP service destinations exactly matched reviewed Sandbox configuration.' \
            '- Synthetic tokenization, OTP send/confirm and authenticated reusable DAVIPLATA source verification completed.' \
            '- Weekly, monthly and yearly first payments reached matching verified success.' \
            '- Declined weekly first payment reached the existing bounded failure decision.' \
            '- Successful periods were cancelled canonically; retry retained the receipt and paid history.' \
            '- DaviPlata reusable sources reached independently verified VOIDED status.' \
            '- No tokens, provider identities, service URLs, document/product values or response bodies are retained.' \
            '- Historical D1 protocol observation only. Current native release evidence is recorded by the protected storage workflow.' >> "$GITHUB_STEP_SUMMARY"

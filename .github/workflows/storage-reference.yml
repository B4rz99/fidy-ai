name: Verify the direct Recurring SQLite candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: b8352dee780f9c685b77773e5a62decda8678f9d
          persist-credentials: false
      - uses: ./.github/actions/bun-install
      - name: Check touched TypeScript and native SQLite behavior
        run: |
          bun x oxlint --deny-warnings --config .oxlintrc.json --type-aware --threads=1 apps/server/cloudflare/recurring-plans/internal/store.ts apps/server/cloudflare/recurring-plans/user-store.test.ts apps/web/src/features/needs-review
          bun run --cwd apps/web test -- src/features/needs-review/read-selection.test.ts
          bun run --cwd apps/server test:core -- --coverage.enabled=false src/core/recurring-plans/contract.test.ts src/core/_shared/time.test.ts
          bun run --cwd apps/server test:cloudflare -- cloudflare/recurring-plans/user-store.test.ts

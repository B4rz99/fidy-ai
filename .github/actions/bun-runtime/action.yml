name: Pinned Bun runtime
description: Install the exact reviewed Bun build with local-only Windows Secrets persistence.
runs:
  using: composite
  steps:
    - name: Install checksum-verified Bun
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash scripts/install-bun.sh "$RUNNER_TEMP/fidy-bun-b73ae471a"

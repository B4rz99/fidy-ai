name: Verify the bound profile taxonomy
on:
  workflow_dispatch:
    inputs:
      dataset:
        type: string
        required: false
      network:
        type: string
        required: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun-runtime
      - run: bash scripts/install-workspace.sh --ignore-scripts
      - name: Assert ordered projection without SQL and equality with SQLite wire bytes
        working-directory: apps/server
        run: |
          bun ../../node_modules/vitest/vitest.mjs run --config vitest.config.ts src/shell/categories/operations.test.ts --coverage.enabled=false --maxWorkers=1
          bun -e '
            import assert from "node:assert/strict";
            import { Database } from "bun:sqlite";
            import { Effect, Option } from "effect";
            import { categoryRowsQuery, categoryResponseFromRows } from "./src/shell/categories/internal/query";
            import { listCategoriesResponse } from "./src/shell/categories/operations";
            const db = new Database(":memory:");
            const { sql, params } = categoryRowsQuery();
            const original = Option.getOrThrow(categoryResponseFromRows(db.query(sql).all(...params)));
            const projected = Effect.runSync(listCategoriesResponse);
            assert.equal(JSON.stringify(original), JSON.stringify(projected));
            console.log("Category response wire bytes", Buffer.byteLength(JSON.stringify(projected)));
            db.close();'
      - name: Verify mounted workerd profile revocation, privacy, detailed admission and Audit
        working-directory: apps/server
        run: |
          bun ../../node_modules/vitest/vitest.mjs run --config cloudflare/vitest.config.ts cloudflare/web-authentication/bound-user.test.ts cloudflare/transactions/native-privacy.test.ts cloudflare/core-http/browser-admission.test.ts cloudflare/public-worker-browser-entry.test.ts --coverage.enabled=false --maxWorkers=1
      - name: Verify the current-cookie recheck and strict recovery callers
        working-directory: apps/web
        run: |
          bun ../../node_modules/vitest/vitest.mjs run src/session/initial-session.test.ts src/transport/workspace-query.test.ts --coverage.enabled=false --maxWorkers=1
